name: apply-calibration-cohort-gate-once

on:
  push:
    branches: [feat/calibration-cohort-gate]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibration-cohort-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch runner
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('scripts/run_kr_live.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'from valuation_engine.cli_runtime import LiveAnalysisRequest  # noqa: E402\n'
          import_block = dedent('''\
          from valuation_engine.calibration_cohort_registry import (  # noqa: E402
              CalibrationCohortRegistryError,
              load_production_calibration_registry,
              resolve_production_calibration_cohort,
              validate_declared_calibration,
          )
          from valuation_engine.cli_runtime import LiveAnalysisRequest  # noqa: E402
          ''')
          if import_anchor not in text:
              raise SystemExit('runner import anchor missing')
          text = text.replace(import_anchor, import_block, 1)

          old_helper = dedent('''\
          def _optional_path(run_dir: Path, name: str) -> str | None:
              path = run_dir / "declarations" / name
              return str(path) if path.exists() else None


          ''')
          new_helper = dedent('''\
          def _run_industry_code(run_dir: Path, config: dict) -> str | None:
              """Return the deterministic KSIC anchor used for cohort matching."""
              filing = config.get("filing") or {}
              if config.get("segments"):
                  declaration_path = run_dir / "declarations" / "segments.yaml"
                  if not declaration_path.is_file():
                      return None
                  payload = yaml.safe_load(declaration_path.read_text(encoding="utf-8"))
                  rows = payload.get("segments") if isinstance(payload, dict) else None
                  if not isinstance(rows, list):
                      return None
                  anchor_segment = str(filing.get("segment_id", ""))
                  matches = tuple(
                      row
                      for row in rows
                      if isinstance(row, dict)
                      and str(row.get("segment_id", "")) == anchor_segment
                  )
                  if len(matches) != 1:
                      return None
                  code = str(matches[0].get("ksic_code", "")).strip()
                  return code or None

              company_path = run_dir / "raw" / "company.json"
              if not company_path.is_file():
                  return None
              payload = json.loads(company_path.read_text(encoding="utf-8"))
              code = (
                  str(payload.get("induty_code", "")).strip()
                  if isinstance(payload, dict)
                  else ""
              )
              return code or None


          def _required_production_calibration(run_dir: Path, config: dict):
              registry = load_production_calibration_registry()
              return resolve_production_calibration_cohort(
                  registry,
                  ksic_code=_run_industry_code(run_dir, config),
                  forecast_years=int(config.get("forecast_years", 5)),
                  scenario_ids=tuple(config.get("scenario_ids", ())),
              )


          def _enforce_production_calibration(run_dir: Path, config: dict) -> None:
              cohort = _required_production_calibration(run_dir, config)
              if cohort is None:
                  return
              try:
                  validate_declared_calibration(cohort, config.get("calibration"))
              except CalibrationCohortRegistryError as exc:
                  raise RunbookError(str(exc)) from exc


          def _optional_path(run_dir: Path, name: str) -> str | None:
              path = run_dir / "declarations" / name
              return str(path) if path.exists() else None


          ''')
          if old_helper not in text:
              raise SystemExit('runner helper anchor missing')
          text = text.replace(old_helper, new_helper, 1)

          old_execute = '    config = _load_run(run_dir)\n    filing = config["filing"]\n\n    def _parse_method'
          new_execute = '    config = _load_run(run_dir)\n    filing = config["filing"]\n    _enforce_production_calibration(run_dir, config)\n\n    def _parse_method'
          if old_execute not in text:
              raise SystemExit('execute_run anchor missing')
          text = text.replace(old_execute, new_execute, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Create runner regression
        run: |
          cat > tests/test_kr_live_calibration_gate.py <<'PY'
          from __future__ import annotations

          import importlib.util
          from pathlib import Path
          import shutil

          import pytest
          import yaml

          ROOT = Path(__file__).resolve().parents[1]
          RUNNER = ROOT / "scripts" / "run_kr_live.py"
          spec = importlib.util.spec_from_file_location("run_kr_live_cohort_gate", RUNNER)
          assert spec and spec.loader
          run_kr_live = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(run_kr_live)


          def _copy_kisco(tmp_path: Path, name: str) -> Path:
              target = tmp_path / name
              shutil.copytree(
                  ROOT / "runs" / "kisco-104700",
                  target,
                  ignore=shutil.ignore_patterns("out"),
              )
              return target


          def test_registered_production_cohort_blocks_missing_calibration(tmp_path):
              run_dir = _copy_kisco(tmp_path, "missing-calibration")
              payload = run_kr_live._load_run(run_dir)
              payload.pop("calibration", None)
              (run_dir / "run.yaml").write_text(
                  yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )

              with pytest.raises(run_kr_live.RunbookError) as caught:
                  run_kr_live.execute_run(run_dir)
              message = str(caught.value)
              assert "CALIBRATION_REQUIRED" in message
              assert "kr-steel-long-continuous-v1" in message
              assert "kr.steel.long|5y_path|continuous_v1" in message


          def test_registered_production_cohort_blocks_wrong_binding(tmp_path):
              run_dir = _copy_kisco(tmp_path, "wrong-calibration")
              payload = run_kr_live._load_run(run_dir)
              payload["calibration"]["cohort_key"] = "wrong.cohort"
              (run_dir / "run.yaml").write_text(
                  yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )

              with pytest.raises(run_kr_live.RunbookError) as caught:
                  run_kr_live.execute_run(run_dir)
              assert "CALIBRATION_COHORT_MISMATCH" in str(caught.value)


          def test_unregistered_industry_does_not_require_calibration(tmp_path):
              run_dir = _copy_kisco(tmp_path, "unregistered-industry")
              company_path = run_dir / "raw" / "company.json"
              import json
              company = json.loads(company_path.read_text(encoding="utf-8"))
              company["induty_code"] = "2611"
              company_path.write_text(json.dumps(company), encoding="utf-8")
              payload = run_kr_live._load_run(run_dir)
              payload.pop("calibration", None)
              (run_dir / "run.yaml").write_text(
                  yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )
              assert run_kr_live._required_production_calibration(run_dir, payload) is None
          PY
      - name: Validate focused and full suite
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_calibration_cohort_registry.py tests/test_kr_live_calibration_gate.py tests/test_kr_live_runbook.py
          pytest -q
          python scripts/validate_project_portfolio.py
          git diff --check
      - name: Commit clean change set
        run: |
          rm .github/workflows/_apply_calibration_cohort_gate_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/kr_calibration_cohort_registry.yaml src/valuation_engine/calibration_cohort_registry.py scripts/run_kr_live.py tests/test_calibration_cohort_registry.py tests/test_kr_live_calibration_gate.py .github/workflows/_apply_calibration_cohort_gate_once.yml
          git commit -m 'Require registered production calibration cohorts'
          git push origin HEAD:feat/calibration-cohort-gate
