name: apply-calibration-review-fixes-once

on:
  push:
    branches: [feat/calibration-cohort-gate]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calibration-cohort-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch canonical preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('scripts/run_kr_live.py')
          text = path.read_text(encoding='utf-8')

          anchor = dedent('''\
          from valuation_engine.generic_live_providers import (  # noqa: E402
              GenericKRRuntimeSpec,
              build_generic_kr_runtime_factory,
          )
          from valuation_engine.kr_opendart_provider import (  # noqa: E402
          ''')
          replacement = dedent('''\
          from valuation_engine.declared_segments import load_declared_segments  # noqa: E402
          from valuation_engine.generic_kr_industry import (  # noqa: E402
              fetch_opendart_company_profile,
              opendart_filing_snapshot_loader,
          )
          from valuation_engine.generic_live_providers import (  # noqa: E402
              GenericKRRuntimeSpec,
              build_generic_kr_runtime_factory,
          )
          from valuation_engine.kr_opendart_provider import (  # noqa: E402
          ''')
          if anchor not in text:
              raise SystemExit('generic provider import anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = 'from valuation_engine.strict_live_runtime import run_prism  # noqa: E402\n'
          replacement = dedent('''\
          from valuation_engine.live_primary_adapters import (  # noqa: E402
              CompanyResolutionRequest,
              live_opendart_company_resolver,
          )
          from valuation_engine.strict_live_runtime import run_prism  # noqa: E402
          ''')
          if anchor not in text:
              raise SystemExit('strict runtime import anchor missing')
          text = text.replace(anchor, replacement, 1)

          start = text.index('def _run_industry_code(')
          end = text.index('def _optional_path(', start)
          helpers = dedent('''\
          def _resolved_target_context(
              run_dir: Path,
              config: dict,
              network: OpenDartNetwork,
          ):
              resolver = live_opendart_company_resolver(
                  network.fetch_bytes,
                  api_key=network.api_key,
              )
              identity = resolver(
                  CompanyResolutionRequest(
                      query=str(config["company_query"]),
                      jurisdiction=str(config.get("jurisdiction", "KR")),
                  )
              )
              identity.validate()
              corp_code = next(
                  (
                      value
                      for key, value in identity.external_ids
                      if key == "opendart_corp_code"
                  ),
                  "",
              )
              if not corp_code:
                  raise RunbookError(
                      "resolved target carries no OpenDART corp code for calibration preflight"
                  )
              profile = fetch_opendart_company_profile(
                  network.fetch_text,
                  corp_code=corp_code,
                  api_key=network.api_key,
              )
              if profile.stock_code and profile.stock_code != identity.ticker:
                  raise RunbookError(
                      "OpenDART company profile ticker disagrees with resolved target"
                  )
              return identity, corp_code, profile


          def _run_industry_code(
              run_dir: Path,
              config: dict,
              *,
              identity,
              network: OpenDartNetwork,
              company_industry_code: str,
          ) -> str | None:
              """Return a KSIC anchor only after the existing scope contract is valid."""
              filing = config.get("filing") or {}
              if config.get("segments"):
                  declaration_path = run_dir / "declarations" / "segments.yaml"
                  declared = load_declared_segments(declaration_path)
                  # Reuse the canonical snapshot loader here: it validates the
                  # declaration target and exact IFRS 8 note bijection before an
                  # operator-declared segment KSIC can affect calibration routing.
                  loader = opendart_filing_snapshot_loader(
                      fetch_text=network.fetch_text,
                      fetch_bytes=network.fetch_bytes,
                      as_of=str(config["as_of"]),
                      api_key=network.api_key,
                      declared_segments=declared,
                  )
                  loader(identity)
                  anchor_segment = str(filing.get("segment_id", "core"))
                  matches = tuple(
                      row for row in declared.segments if row.segment_id == anchor_segment
                  )
                  if len(matches) != 1:
                      raise RunbookError(
                          "filing.segment_id must identify exactly one validated "
                          f"declared segment; got {anchor_segment!r}"
                      )
                  return matches[0].ksic_code
              return company_industry_code or None


          def _target_filing_receipts(run_dir: Path) -> tuple[str, ...]:
              path = run_dir / "raw" / "list.json"
              if not path.is_file():
                  return ()
              payload = json.loads(path.read_text(encoding="utf-8"))
              rows = payload.get("list") if isinstance(payload, dict) else None
              if not isinstance(rows, list):
                  return ()
              return tuple(
                  str(row.get("rcept_no") or "")
                  for row in rows
                  if isinstance(row, dict) and row.get("rcept_no")
              )


          def _conditioning_source_ref(run_dir: Path, calibration: object) -> str:
              if not isinstance(calibration, dict):
                  return ""
              raw_path = calibration.get("conditioning")
              if not isinstance(raw_path, str) or not raw_path:
                  return ""
              path = _resolve(run_dir, raw_path)
              if not path.is_file():
                  return ""
              payload = json.loads(path.read_text(encoding="utf-8"))
              return str(payload.get("source_ref") or "") if isinstance(payload, dict) else ""


          def _required_production_calibration(
              run_dir: Path,
              config: dict,
              *,
              identity,
              network: OpenDartNetwork,
              company_industry_code: str,
          ):
              registry = load_production_calibration_registry()
              return resolve_production_calibration_cohort(
                  registry,
                  ksic_code=_run_industry_code(
                      run_dir,
                      config,
                      identity=identity,
                      network=network,
                      company_industry_code=company_industry_code,
                  ),
                  forecast_years=int(config.get("forecast_years", 5)),
                  scenario_ids=tuple(config.get("scenario_ids", ())),
              )


          def _enforce_production_calibration(
              run_dir: Path,
              config: dict,
              *,
              network: OpenDartNetwork,
          ) -> None:
              try:
                  identity, corp_code, profile = _resolved_target_context(
                      run_dir, config, network
                  )
                  cohort = _required_production_calibration(
                      run_dir,
                      config,
                      identity=identity,
                      network=network,
                      company_industry_code=profile.induty_code,
                  )
                  if cohort is None:
                      return
                  calibration = config.get("calibration")
                  validate_declared_calibration(
                      cohort,
                      calibration,
                      target_ticker=identity.ticker,
                      target_corp_code=corp_code,
                      conditioning_source_ref=_conditioning_source_ref(
                          run_dir, calibration
                      ),
                      target_filing_receipts=_target_filing_receipts(run_dir),
                  )
              except CalibrationCohortRegistryError as exc:
                  raise RunbookError(str(exc)) from exc
              except RunbookError:
                  raise
              except Exception as exc:
                  # Canonical company/snapshot/declaration validation owns the
                  # rationale; preserve it instead of masking it as a cohort error.
                  raise RunbookError(str(exc)) from exc


          ''')
          text = text[:start] + helpers + text[end:]

          old = dedent('''\
              config = _load_run(run_dir)
              filing = config["filing"]
              _enforce_production_calibration(run_dir, config)

              def _parse_method''')
          new = dedent('''\
              config = _load_run(run_dir)
              filing = config["filing"]
              network = _build_network(run_dir)
              _enforce_production_calibration(run_dir, config, network=network)

              def _parse_method''')
          if old not in text:
              raise SystemExit('execute preflight anchor missing')
          text = text.replace(old, new, 1)
          old = '        network=_build_network(run_dir),\n'
          new = '        network=network,\n'
          if old not in text:
              raise SystemExit('factory network anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Extend regressions
        run: |
          cat >> tests/test_kr_live_calibration_gate.py <<'PY'

          def test_registered_cohort_binds_excluded_ticker_to_resolved_target(tmp_path):
              run_dir = _copy_kisco(tmp_path, "wrong-target-exclusion")
              payload = run_kr_live._load_run(run_dir)
              payload["calibration"]["constants"]["excluded_ticker"] = "084010"
              # Make the copied run's external conditioning path self-contained.
              source = ROOT / "config" / "kisco_conditioning_fy2025.json"
              target = run_dir / "conditioning.json"
              target.write_bytes(source.read_bytes())
              payload["calibration"]["conditioning"] = "conditioning.json"
              (run_dir / "run.yaml").write_text(
                  yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )
              with pytest.raises(run_kr_live.RunbookError) as caught:
                  run_kr_live.execute_run(run_dir)
              assert "CALIBRATION_TARGET_MISMATCH" in str(caught.value)
              assert "104700" in str(caught.value)


          def test_multisegment_invalid_declaration_preempts_cohort_gate(tmp_path):
              run_dir = tmp_path / "daehan-invalid-segments"
              shutil.copytree(
                  ROOT / "runs" / "daehansteel-084010",
                  run_dir,
                  ignore=shutil.ignore_patterns("out"),
              )
              payload = run_kr_live._load_run(run_dir)
              payload.pop("calibration", None)
              (run_dir / "run.yaml").write_text(
                  yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )
              segments_path = run_dir / "declarations" / "segments.yaml"
              segments = yaml.safe_load(segments_path.read_text(encoding="utf-8"))
              segments["segments"][0]["rationale"] = "too short"
              segments_path.write_text(
                  yaml.safe_dump(segments, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )
              with pytest.raises(run_kr_live.RunbookError) as caught:
                  run_kr_live.execute_run(run_dir)
              message = str(caught.value)
              assert "rationale" in message
              assert "CALIBRATION_REQUIRED" not in message


          def test_multisegment_missing_filing_segment_id_uses_core_default(tmp_path):
              run_dir = tmp_path / "core-default"
              shutil.copytree(
                  ROOT / "runs" / "daehansteel-084010",
                  run_dir,
                  ignore=shutil.ignore_patterns("out"),
              )
              payload = run_kr_live._load_run(run_dir)
              payload["filing"].pop("segment_id", None)
              segments_path = run_dir / "declarations" / "segments.yaml"
              segments = yaml.safe_load(segments_path.read_text(encoding="utf-8"))
              segments["segments"][0]["segment_id"] = "core"
              segments_path.write_text(
                  yaml.safe_dump(segments, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )
              # This assertion exercises the exact runtime default. The IFRS 8
              # declaration remains otherwise valid and supplies KSIC 2411.
              network = run_kr_live._build_network(run_dir)
              identity, _, profile = run_kr_live._resolved_target_context(
                  run_dir, payload, network
              )
              assert run_kr_live._run_industry_code(
                  run_dir,
                  payload,
                  identity=identity,
                  network=network,
                  company_industry_code=profile.induty_code,
              ) == "2411"
          PY
      - name: Unit target-binding regression
        run: |
          cat >> tests/test_calibration_cohort_registry.py <<'PY'

          def test_target_binding_rejects_other_issuer_exclusion():
              registry = load_production_calibration_registry()
              cohort = resolve_production_calibration_cohort(
                  registry,
                  ksic_code="2411",
                  forecast_years=5,
                  scenario_ids=("Down", "Base", "Bull"),
              )
              assert cohort is not None
              with pytest.raises(CalibrationCohortRegistryError, match="CALIBRATION_TARGET_MISMATCH"):
                  validate_declared_calibration(
                      cohort,
                      {
                          "cohort_key": cohort.cohort_key,
                          "forecast_class": cohort.forecast_class,
                          "external_probability_source": cohort.external_probability_source,
                          "constants": {"excluded_ticker": "104700"},
                      },
                      target_ticker="084010",
                      target_corp_code="00113225",
                      conditioning_source_ref=(
                          "https://opendart.fss.or.kr/api/fnlttSinglAcntAll.json?"
                          "corp_code=00113225&bsns_year=2025"
                      ),
                  )
          PY
      - name: Validate review fixes
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_calibration_cohort_registry.py tests/test_kr_live_calibration_gate.py tests/test_kr_live_runbook.py
          pytest -q
          python scripts/validate_project_portfolio.py
          git diff --check
      - name: Commit clean review fix
        run: |
          rm .github/workflows/_apply_calibration_review_fixes_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/valuation_engine/calibration_cohort_registry.py scripts/run_kr_live.py tests/test_calibration_cohort_registry.py tests/test_kr_live_calibration_gate.py .github/workflows/_apply_calibration_review_fixes_once.yml
          git commit -m 'Bind calibration gate to canonical target and segment scope'
          git push origin HEAD:feat/calibration-cohort-gate
