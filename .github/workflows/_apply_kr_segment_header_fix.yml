name: apply-kr-segment-header-fix

on:
  push:
    branches:
      - feat/kr-trading-recycling-classification

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kr-trading-recycling-classification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python scripts/_apply_kr_segment_header_fix.py
      - name: Install and verify
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_segment_note.py tests/test_declared_segments.py
          PYTHONPATH=src python scripts/validate_module_registries.py
          pytest -q
      - name: Commit target files only
        run: |
          rm scripts/_apply_kr_segment_header_fix.py
          rm .github/workflows/_apply_kr_segment_header_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/valuation_engine/segment_note.py config/kr_industry_classification_map.yaml tests/test_segment_note.py scripts/_apply_kr_segment_header_fix.py .github/workflows/_apply_kr_segment_header_fix.yml
          git commit -m 'Support two-tier KR segment headers and trading/recycling routes'
          git push origin HEAD:feat/kr-trading-recycling-classification
