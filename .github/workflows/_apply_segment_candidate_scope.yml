name: apply-segment-candidate-scope

on:
  push:
    branches: [fix/segment-scoped-evaluator-registry]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/segment-scoped-evaluator-registry
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply candidate visibility patch
        run: python scripts/_scope_evaluator_candidate_keys.py
      - name: Verify focused and full regression
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_generic_valuation_plan.py
          PYTHONPATH=src python scripts/validate_execution_authority_policy.py
          pytest -q
      - name: Commit target files only
        run: |
          rm scripts/_scope_evaluator_candidate_keys.py
          rm .github/workflows/_apply_segment_candidate_scope.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/valuation_engine/evaluator_registry.py src/valuation_engine/valuation_plan_compiler.py tests/test_generic_valuation_plan.py scripts/_scope_evaluator_candidate_keys.py .github/workflows/_apply_segment_candidate_scope.yml
          git commit -m 'Limit evaluator candidates to their registered segment'
          git push origin HEAD:fix/segment-scoped-evaluator-registry
