name: fix-calibrated-probability-summary

on:
  push:
    branches:
      - fix/segment-scoped-evaluator-registry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/segment-scoped-evaluator-registry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch calibrated probability summary
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/valuation_engine/generic_reporting.py')
          text = p.read_text(encoding='utf-8')
          old_import = '''from .probability_forecasting import (\n    ProbabilityForecastDraft,\n    ProbabilityForecastHistoryStore,\n    ScenarioProbabilityAssessment,\n)\n'''
          new_import = old_import + 'from .scenario_binding import BoundScenarioSet\n'
          if old_import not in text:
              raise SystemExit('report import anchor missing')
          text = text.replace(old_import, new_import, 1)

          anchor = '''def _probability_percent(value: Decimal | float | int) -> str:\n    return f"{Decimal(str(value)) * 100:.0f}%"\n\n\n'''
          helper = '''def _probability_percent(value: Decimal | float | int) -> str:\n    return f"{Decimal(str(value)) * 100:.0f}%"\n\n\ndef _scenario_probability_summary(\n    scenario_set: object,\n    probability_assessment: object,\n) -> str:\n    if (\n        isinstance(scenario_set, BoundScenarioSet)\n        and scenario_set.numeric_weighting_allowed\n        and scenario_set.scenarios\n        and all(item.probability is not None for item in scenario_set.scenarios)\n    ):\n        return " · ".join(\n            f"{scenario_label_ko(item.scenario_id)} "\n            f"{Decimal(str(item.probability)) * 100:.1f}%"\n            for item in scenario_set.scenarios\n        ) + " (보정 완료·수치 가중 적용)"\n    if isinstance(probability_assessment, ScenarioProbabilityAssessment):\n        return " · ".join(\n            f"{scenario_label_ko(item.scenario_id)} {_probability_percent(item.displayed_probability)}"\n            for item in probability_assessment.rows\n        ) + " (미보정·기대값 미적용)"\n    return "미산출"\n\n\n'''
          if anchor not in text:
              raise SystemExit('probability helper anchor missing')
          text = text.replace(anchor, helper, 1)

          old = '''    probability_assessment = data.get("scenario_probability_assessment")\n    probability_summary = "미산출"\n    if isinstance(probability_assessment, ScenarioProbabilityAssessment):\n        probability_summary = " · ".join(\n            f"{scenario_label_ko(item.scenario_id)} {_probability_percent(item.displayed_probability)}"\n            for item in probability_assessment.rows\n        ) + " (미보정·기대값 미적용)"\n'''
          new = '''    probability_assessment = data.get("scenario_probability_assessment")\n    probability_summary = _scenario_probability_summary(\n        scenario_set, probability_assessment\n    )\n'''
          if old not in text:
              raise SystemExit('report probability block missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          test = Path('tests/test_generic_reporting_probability_summary.py')
          test.write_text('''from decimal import Decimal\n\nfrom valuation_engine.generic_reporting import _scenario_probability_summary\nfrom valuation_engine.records import CalibrationStatus\nfrom valuation_engine.scenario_binding import BoundScenario, BoundScenarioSet\n\n\ndef test_calibrated_bound_probabilities_drive_reader_summary():\n    scenario_set = BoundScenarioSet(\n        target_id="010130",\n        scenarios=(\n            BoundScenario("Down", (), Decimal("0.0779166666666667")),\n            BoundScenario("Base", (), Decimal("0.6856166666666666")),\n            BoundScenario("Bull", (), Decimal("0.2364666666666667")),\n        ),\n        calibration_status=CalibrationStatus.CALIBRATED,\n        numeric_weighting_allowed=True,\n        scenario_set_hash="hash",\n        calibration_snapshot_hash="snapshot",\n        calibration_dataset_hash="dataset",\n    )\n\n    summary = _scenario_probability_summary(scenario_set, None)\n\n    assert summary == (\n        "하방 7.8% · 기준 68.6% · 상방 23.6% "\n        "(보정 완료·수치 가중 적용)"\n    )\n    assert "미산출" not in summary\n    assert "미보정" not in summary\n\n\ndef test_no_probability_source_remains_unavailable():\n    assert _scenario_probability_summary(None, None) == "미산출"\n''', encoding='utf-8')
          PY
      - name: Verify focused and full regression
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_generic_reporting_probability_summary.py tests/test_generic_audit_freeze_e2e.py tests/test_post_freeze_state_report.py tests/test_skhynix_public_report.py
          pytest -q
      - name: Commit target files only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/valuation_engine/generic_reporting.py tests/test_generic_reporting_probability_summary.py
          git commit -m 'Show calibrated scenario probabilities in generic reports'
          git push origin HEAD:fix/segment-scoped-evaluator-registry
