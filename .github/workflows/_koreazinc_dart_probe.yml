name: koreazinc-dart-probe

on:
  push:
    branches: [run/koreazinc-010130-prism-20260901]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch DART public filing pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import json, re

          out = Path('/tmp/koreazinc-dart')
          out.mkdir(parents=True, exist_ok=True)
          receipts = ['20260814003958','20260316000929']
          result = {}
          for rcp in receipts:
              url = f'https://dart.fss.or.kr/dsaf001/main.do?rcpNo={rcp}'
              req = Request(url, headers={'User-Agent':'Mozilla/5.0'})
              try:
                  raw = urlopen(req, timeout=30).read()
                  text = raw.decode('utf-8','replace')
              except Exception as exc:
                  result[rcp] = {'error': type(exc).__name__, 'detail': str(exc)}
                  continue
              (out / f'{rcp}_main.html').write_text(text, encoding='utf-8')
              nodes=[]
              # DART main page embeds tree nodes with text/dcmNo/eleId/offset/length.
              for m in re.finditer(r"node\d+\s*=\s*\{(.*?)\};", text, re.S):
                  block=m.group(1)
                  def grab(key):
                      x=re.search(rf"['\"]?{key}['\"]?\s*:\s*['\"]([^'\"]*)['\"]", block)
                      return x.group(1) if x else ''
                  row={k:grab(k) for k in ('text','dcmNo','eleId','offset','length','dtd')}
                  if row['dcmNo'] and row['eleId']:
                      nodes.append(row)
              if not nodes:
                  # fallback: collect viewer.do argument tuples around title text
                  patt=re.compile(r"viewDoc\(['\"]?(\d+)['\"]?,['\"]?(\d+)['\"]?,['\"]?(\d+)['\"]?,['\"]?(\d+)['\"]?,['\"]?(\d+)['\"]?,['\"]?([^'\"]*)", re.S)
                  for m in patt.finditer(text):
                      nodes.append({'text':'', 'dcmNo':m.group(2),'eleId':m.group(3),'offset':m.group(4),'length':m.group(5),'dtd':m.group(6)})
              result[rcp]={'bytes':len(raw),'contains_company':'고려아연' in text,'contains_half':'반기보고서' in text,'contains_annual':'사업보고서' in text,'nodes':nodes[:500]}
          (out/'probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False)[:12000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KOREAZINC_DART_PROBE
          path: /tmp/koreazinc-dart
