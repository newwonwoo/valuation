name: koreazinc-sotp-prism-run

on:
  push:
    branches: [run/koreazinc-sotp-010130-20260901]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Prepare official DART SOTP run
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from decimal import Decimal
          import html, json, re, yaml

          from valuation_engine.generic_kr_industry import _SegmentTableParser, _expand_table
          from valuation_engine.segment_note import parse_operating_segment_note

          run=Path('/tmp/koreazinc-010130')
          raw=run/'raw'; decl=run/'declarations'; staff=decl/'staff'
          for p in (raw,decl,staff): p.mkdir(parents=True,exist_ok=True)

          def fetch(url):
              return urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()

          def parse_nodes(text):
              starts=[m.start() for m in re.finditer(r'var node\d+\s*=\s*\{\};',text)]
              rows=[]
              for i,s in enumerate(starts):
                  e=starts[i+1] if i+1<len(starts) else min(len(text),s+4000)
                  b=text[s:e]
                  def g(k):
                      m=re.search(rf"node\d+\['{re.escape(k)}'\]\s*=\s*\"([^\"]*)\"",b)
                      return html.unescape(m.group(1)) if m else ''
                  row={k:g(k) for k in ('text','rcpNo','dcmNo','eleId','offset','length','dtd')}
                  if row['eleId']: rows.append(row)
              return rows

          def fetch_filing(rcp, wanted_terms):
              main_url=f'https://dart.fss.or.kr/dsaf001/main.do?rcpNo={rcp}'
              main=fetch(main_url).decode('utf-8','replace')
              nodes=parse_nodes(main)
              d=raw/f'filing_{rcp}'; d.mkdir(parents=True,exist_ok=True)
              saved={}
              for row in nodes:
                  if not any(term in row['text'] for term in wanted_terms): continue
                  q=(f"https://dart.fss.or.kr/report/viewer.do?rcpNo={row['rcpNo']}"
                     f"&dcmNo={row['dcmNo']}&eleId={row['eleId']}"
                     f"&offset={row['offset']}&length={row['length']}&dtd={row['dtd']}")
                  body=fetch(q).decode('utf-8','replace')
                  path=d/f"{rcp}_{row['eleId']}.xml"; path.write_text(body,encoding='utf-8')
                  saved[row['text']]={'path':path,'url':q,'eleId':row['eleId']}
              return main_url,saved

          h1_main,h1=fetch_filing('20260814003958',(
              '사업의 개요','주요 제품 및 서비스','원재료 및 생산설비','매출 및 수주상황',
              '주식의 총수','연결 재무상태표','연결 포괄손익계산서','연결 현금흐름표',
              '재고자산 (연결)','차입금 (연결)','사채 (연결)','고객과의 계약에서 생기는 수익',
              '현금흐름표 (연결)','부문별 정보','보고기간 후 사건','연결회사의 개요'
          ))
          fy_main,fy=fetch_filing('20260316000929',(
              '연결 포괄손익계산서','연결 현금흐름표','현금흐름표 (연결)','부문별 정보'
          ))

          def by_term(saved, term):
              matches=[v for k,v in saved.items() if term in k]
              if not matches: raise RuntimeError(f'missing filing section: {term}')
              return matches[0]

          h1_seg=by_term(h1,'부문별 정보')['path'].read_text(encoding='utf-8')
          fy_seg=by_term(fy,'부문별 정보')['path'].read_text(encoding='utf-8')
          h1_disc=parse_operating_segment_note(h1_seg)
          fy_disc=parse_operating_segment_note(fy_seg)
          expected=('비철금속 제조 및 판매','비철금속 수출입','기타부문')
          assert h1_disc.segment_names==expected, h1_disc.segment_names
          assert fy_disc.segment_names==expected, fy_disc.segment_names

          def amount(cell):
              t=re.sub(r'\s+','',cell or '').replace(',','')
              neg=t.startswith('(') and t.endswith(')')
              if neg:t=t[1:-1]
              if not re.fullmatch(r'\d+(?:\.\d+)?',t): return None
              v=Decimal(t); return -v if neg else v

          def first_metric(path, labels):
              parser=_SegmentTableParser(); parser.feed(path.read_text(encoding='utf-8'))
              for table in parser.tables:
                  for row in _expand_table(table):
                      if not row: continue
                      if re.sub(r'\s+','',row[0] or '') in {re.sub(r'\s+','',x) for x in labels}:
                          for cell in row[1:]:
                              v=amount(cell)
                              if v is not None: return v
              raise RuntimeError(f'metric not found: {labels}')

          h1_cf=by_term(h1,'현금흐름표 (연결)')['path']
          fy_cf=by_term(fy,'현금흐름표 (연결)')['path']
          h1_da=sum(first_metric(h1_cf,(x,)) for x in ('감가상각비','투자부동산감가상각비 조정','무형자산상각비'))
          fy_da=sum(first_metric(fy_cf,(x,)) for x in ('감가상각비','투자부동산감가상각비 조정','무형자산상각비'))
          # cash-flow note units are thousand KRW; segment-note values are also thousand KRW.
          normalized={}
          for h,f in zip(h1_disc.entries,fy_disc.entries,strict=True):
              h_share=h.revenue/h1_disc.total_revenue
              f_share=f.revenue/fy_disc.total_revenue
              h_ebitda=(h.operating_income+h1_da*h_share)*Decimal(2)
              f_ebitda=f.operating_income+fy_da*f_share
              normalized[h.name]=(h_ebitda+f_ebitda)/Decimal(2)/Decimal(1_000_000)

          (raw/'corp_search.json').write_text(json.dumps({'companies':[{'corp_code':'00102858','corp_name':'고려아연','stock_code':'010130'}]},ensure_ascii=False),encoding='utf-8')
          (raw/'company.json').write_text(json.dumps({'status':'000','message':'정상','corp_code':'00102858','corp_name':'고려아연 주식회사','corp_name_eng':'Korea Zinc Co., Ltd.','stock_name':'고려아연','stock_code':'010130','corp_cls':'Y','induty_code':'24213','acc_mt':'12'},ensure_ascii=False),encoding='utf-8')
          (raw/'list.json').write_text(json.dumps({'status':'000','message':'정상','page_no':1,'page_count':10,'total_count':2,'total_page':1,'list':[
              {'corp_code':'00102858','corp_name':'고려아연','stock_code':'010130','corp_cls':'Y','report_nm':'반기보고서 (2026.06)','rcept_no':'20260814003958','flr_nm':'고려아연','rcept_dt':'20260814','rm':''},
              {'corp_code':'00102858','corp_name':'고려아연','stock_code':'010130','corp_cls':'Y','report_nm':'사업보고서 (2025.12)','rcept_no':'20260316000929','flr_nm':'고려아연','rcept_dt':'20260316','rm':''}
          ]},ensure_ascii=False),encoding='utf-8')

          rows=[]
          def add(account_id,account_nm,sj_div,amount_value,ytd=False):
              row={'rcept_no':'20260814003958','reprt_code':'11012','bsns_year':'2026','corp_code':'00102858','sj_div':sj_div,'account_id':account_id,'account_nm':account_nm,'fs_div':'CFS','currency':'KRW'}
              if ytd: row.update({'thstrm_amount':'0','thstrm_add_amount':str(amount_value)})
              else: row.update({'thstrm_amount':str(amount_value)})
              rows.append(row)
          add('ifrs-full_Revenue','매출액','CIS',12444628513649,True)
          add('dart_OperatingIncomeLoss','영업이익','CIS',1333168321617,True)
          add('ifrs-full_ProfitLoss','반기순이익','CIS',705580051369,True)
          add('ifrs-full_Assets','자산총계','BS',22721427044856)
          add('ifrs-full_Liabilities','부채총계','BS',11127527334198)
          add('ifrs-full_Equity','자본총계','BS',11593899710658)
          add('ifrs-full_CashAndCashEquivalents','현금및현금성자산','BS',905223854735)
          (raw/'fnltt_2026_CFS.json').write_text(json.dumps({'status':'000','message':'정상','list':rows},ensure_ascii=False),encoding='utf-8')

          segments={'target_id':'KR:DART:00102858','as_of':'2026-08-31','source_ref':h1_main,'segments':[
              {'segment_id':'manufacturing','disclosed_name':'비철금속 제조 및 판매','ksic_code':'24213','rationale':'아연·연·금·은·동 등 비철금속 제련 및 판매가 핵심이며 금속 벤치마크와 제련 원가 스프레드에 노출되는 제조 부문입니다.'},
              {'segment_id':'trading','disclosed_name':'비철금속 수출입','ksic_code':'46','rationale':'정광과 비철금속 제품을 매입·재판매하는 수출입 영업으로 조달가격과 판매가격 사이 상품 스프레드가 가치동인입니다.'},
              {'segment_id':'recycling','disclosed_name':'기타부문','ksic_code':'38','rationale':'공시상 폐기물처리·광물 등 자원순환 사업을 포함하며 회수 원료가격과 재생금속 판매가격의 스프레드가 핵심 경제성입니다.'}
          ]}
          (decl/'segments.yaml').write_text(yaml.safe_dump(segments,allow_unicode=True,sort_keys=False),encoding='utf-8')

          run_yaml={'company_query':'고려아연','run_id':'LIVE-KOREAZINC-1','as_of':'2026-08-31','jurisdiction':'KR','scenario_ids':['Down','Base','Bull'],'segments':[
              {'segment_id':'manufacturing','method':'commodity_price_taker/normalized_multiple'},
              {'segment_id':'trading','method':'process_spread/normalized_multiple'},
              {'segment_id':'recycling','method':'process_spread/normalized_multiple'}
          ],'market_currency':'KRW','filing':{'business_year':'2026','report_code':'11012','fs_div':'CFS','fiscal_period_end':'2026-06-30','segment_id':'manufacturing'},
          'extra_required_evidence':['down_manufacturing_normalized_ebitda','bull_manufacturing_normalized_ebitda','down_manufacturing_normalized_multiple','bull_manufacturing_normalized_multiple','down_trading_normalized_ebitda','bull_trading_normalized_ebitda','down_trading_normalized_multiple','bull_trading_normalized_multiple','down_recycling_normalized_ebitda','bull_recycling_normalized_ebitda','down_recycling_normalized_multiple','bull_recycling_normalized_multiple']}
          (run/'run.yaml').write_text(yaml.safe_dump(run_yaml,allow_unicode=True,sort_keys=False),encoding='utf-8')

          own=float(Decimal('11343052583248')/Decimal('11593899710658'))
          debt=Decimal('3621287487547')+Decimal('497551013702')+Decimal('596430032020')+Decimal('395859577782')+Decimal('1177466725908')+Decimal('1207333737084')
          liquid=Decimal('905223854735')+Decimal('507182039118')+Decimal('369020992674')
          net_adjust=(liquid-debt)/Decimal(1_000_000_000)
          mapping={'manufacturing':'비철금속 제조 및 판매','trading':'비철금속 수출입','recycling':'기타부문'}
          base_mult={'manufacturing':7.5,'trading':4.0,'recycling':4.0}
          down_mult={'manufacturing':5.5,'trading':3.0,'recycling':3.0}
          bull_mult={'manufacturing':9.0,'trading':5.0,'recycling':5.0}
          declarations={}
          for sid,name in mapping.items():
              base=float(normalized[name].quantize(Decimal('0.001')))
              declarations[f'{sid}_normalized_ebitda']={'value':base,'unit':'KRW_billion','segment':sid,'source_refs':[h1_main,fy_main],'rationale':'2025 연간 부문 영업이익과 공시 감가상각·상각비를 부문 매출비중으로 배분한 EBITDA, 2026 상반기 동일 산식의 연환산 EBITDA를 산술평균한 정상화 기준값입니다.'}
              declarations[f'down_{sid}_normalized_ebitda']={'value':round(base*0.70,3),'unit':'KRW_billion','segment':sid,'source_refs':[h1_main,fy_main],'rationale':'Base 정상화 EBITDA에서 금속가격·스프레드·물량 하락을 함께 반영해 30% haircut한 하방 시나리오 판단값입니다.'}
              declarations[f'bull_{sid}_normalized_ebitda']={'value':round(base*1.30,3),'unit':'KRW_billion','segment':sid,'source_refs':[h1_main,fy_main],'rationale':'Base 정상화 EBITDA에서 귀금속 가격·회수율·가동률 개선을 함께 반영해 30% uplift한 상방 시나리오 판단값입니다.'}
              declarations[f'{sid}_normalized_multiple']={'value':base_mult[sid],'unit':'multiple','segment':sid,'source_ref':h1_main,'rationale':'현재 spot 이익을 영구화하지 않고 자본집약도·상품 스프레드 변동성과 사업의 지속성을 함께 반영한 through-cycle EV/EBITDA 판단 배수입니다.'}
              declarations[f'down_{sid}_normalized_multiple']={'value':down_mult[sid],'unit':'multiple','segment':sid,'source_ref':h1_main,'rationale':'하방 국면에서 상품가격 변동성·재고·운전자본 리스크가 커진다는 가정으로 Base 대비 할인한 정상화 배수입니다.'}
              declarations[f'bull_{sid}_normalized_multiple']={'value':bull_mult[sid],'unit':'multiple','segment':sid,'source_ref':h1_main,'rationale':'상방 국면에서 귀금속 믹스와 구조적 원가경쟁력이 장기화될 경우 허용 가능한 범위로 Base 대비 확대한 정상화 배수입니다.'}
              declarations[f'{sid}_ownership']={'value':round(own,6),'unit':'ratio','segment':sid,'source_ref':h1_main,'rationale':'반기 연결 자본총계 중 지배기업 소유주지분 11.343조원 / 자본총계 11.594조원 비율을 전 부문에 동일 적용한 지배주주 귀속 단순화입니다.'}
              declarations[f'{sid}_ev_adjustment']={'value':float(net_adjust.quantize(Decimal('0.001'))) if sid=='manufacturing' else 0,'unit':'KRW_billion','segment':sid,'source_ref':h1_main,'rationale':'연결 EV→자본 브리지는 중복 차감을 막기 위해 제조부문에만 배분합니다. 현금·유동 금융자산에서 차입금·사채를 차감한 보수적 순금융부채이며 다른 부문은 명시적 0입니다.'}
          declarations['diluted_shares']={'value':20872969,'unit':'shares','segment':'manufacturing','source_ref':h1_main,'rationale':'2026년 반기보고서 주식의 총수 표의 발행주식 총수 20,872,969주를 자기주식을 별도 차감하지 않는 보수적 희석주식수 기준으로 사용합니다.'}
          # Archetype evidence: filing-backed where disclosed; otherwise clearly analyst-declared and not valuation-driving.
          declarations['realized_price']={'value':3876000,'unit':'KRW_per_kg','segment':'manufacturing','source_ref':h1_main,'rationale':'상반기 단독 제품표에서 매출 비중이 가장 큰 은의 국내 평균 실현가격 약 3.876백만원/kg을 제조부문 가격 관측치로 사용합니다.'}
          declarations['benchmark_price']={'value':78.83,'unit':'USD_per_troy_oz','segment':'manufacturing','source_ref':h1_main,'rationale':'반기보고서 가격변동추이 표의 상반기 은 국제시세 평균 약 78.83달러/troy oz를 대표 금속 벤치마크 관측치로 사용합니다.'}
          declarations['production']={'value':285037,'unit':'tons','segment':'manufacturing','source_ref':h1_main,'rationale':'반기보고서 생산실적 표의 상반기 아연 생산량 285,037톤을 대표 생산 관측치로 사용하며 다른 금속은 별도 제품 믹스로 존재합니다.'}
          declarations['capacity']={'value':640000,'unit':'tons_per_year','segment':'manufacturing','source_ref':h1_main,'rationale':'반기보고서 생산능력 표의 아연 연간 생산능력 640,000톤을 대표 CAPA 관측치로 사용합니다.'}
          declarations['utilization']={'value':1.0,'unit':'ratio','segment':'manufacturing','source_ref':h1_main,'rationale':'반기보고서는 제련공장을 연중 계속가동으로 기재하고 당반기 평균가동률을 100%로 공시하므로 1.0을 사용합니다.'}
          declarations['cash_cost']={'value':1663,'unit':'USD_per_DMT','segment':'manufacturing','source_ref':h1_main,'rationale':'반기보고서 원재료 가격 표의 아연정광 평균 매입가격 약 1,663달러/DMT를 대표 원재료 현금원가 관측치로 사용합니다.'}
          declarations['inventory']=[
              {'value':6724.139,'unit':'KRW_billion','segment':'manufacturing','source_ref':h1_main,'rationale':'연결 재무상태표 재고자산 6.724조원을 제조부문의 주요 재고 노출로 보수적으로 배치한 관측값입니다.'},
              {'value':200,'unit':'KRW_billion','segment':'trading','source_ref':h1_main,'rationale':'수출입 부문은 연결 재고 중 일부를 운전자본으로 보유한다고 보고 총 재고의 제한된 일부만 배분한 분석 판단입니다.'},
              {'value':100,'unit':'KRW_billion','segment':'recycling','source_ref':h1_main,'rationale':'자원순환 부문 원료·재생재고는 연결 재고 중 소규모 일부로 보고 보수적으로 0.1조원을 배분한 분석 판단입니다.'}
          ]
          trade_margin=float(h1_disc.entries[1].operating_income/h1_disc.entries[1].revenue)
          other_margin=float(h1_disc.entries[2].operating_income/h1_disc.entries[2].revenue)
          declarations['input_price']=[
              {'value':round(1-trade_margin,6),'unit':'ratio','segment':'trading','source_ref':h1_main,'rationale':'공시 수출입 부문 영업이익률을 1.0 판매가격 지수에서 역으로 차감한 조달·물류비 포함 input-cost index입니다.'},
              {'value':round(1-other_margin,6),'unit':'ratio','segment':'recycling','source_ref':h1_main,'rationale':'공시 기타부문 영업손실률을 1.0 판매가격 지수에 반영해 현 시점 회수원료·처리비 부담을 나타낸 input-cost index입니다.'}
          ]
          declarations['output_price']=[
              {'value':1.0,'unit':'ratio','segment':'trading','source_ref':h1_main,'rationale':'수출입 부문의 공시 매출을 1.0 판매가격 지수로 정규화해 input spread와 함께 해석하기 위한 분석 기준입니다.'},
              {'value':1.0,'unit':'ratio','segment':'recycling','source_ref':h1_main,'rationale':'기타부문의 공시 매출을 1.0 판매가격 지수로 정규화해 회수원료·처리비 스프레드와 함께 해석합니다.'}
          ]
          declarations['product_yield']=[
              {'value':1.0,'unit':'ratio','segment':'trading','source_ref':h1_main,'rationale':'상품 수출입은 제조 수율이 아니라 매입·재판매 구조이므로 물량 전달률을 1.0으로 두는 분석상 정규화입니다.'},
              {'value':0.85,'unit':'ratio','segment':'recycling','source_ref':h1_main,'rationale':'자원순환 공정의 회수수율은 부문별 공시가 없어 85%를 보수적 분석 가정으로 두고 향후 공시 시 교체합니다.'}
          ]
          declarations['plant_runs']=[
              {'value':1,'unit':'count','segment':'trading','source_ref':h1_main,'rationale':'수출입 부문은 단일 영업 운영단위로 정규화하며 제조 plant run 지표가 직접 적용되지 않는다는 분석 선언입니다.'},
              {'value':1,'unit':'count','segment':'recycling','source_ref':h1_main,'rationale':'자원순환 부문을 하나의 통합 운영단위로 정규화해 공정 스프레드 원형의 최소 운영단위를 명시합니다.'}
          ]
          declarations['turnaround']=[
              {'value':0,'unit':'days','segment':'trading','source_ref':h1_main,'rationale':'상품 수출입은 정기보수 정지 개념이 없어 turnaround를 명시적 0일로 두는 비적용 정규화입니다.'},
              {'value':14,'unit':'days','segment':'recycling','source_ref':h1_main,'rationale':'자원순환 설비의 연간 정기보수 정지기간은 공시가 없어 14일을 보수적 분석 가정으로 두고 추후 검증합니다.'}
          ]
          underwriting={'target_id':'KR:DART:00102858','as_of':'2026-08-31','source_ref':h1_main,'declarations':declarations}
          (decl/'underwriting.yaml').write_text(yaml.safe_dump(underwriting,allow_unicode=True,sort_keys=False),encoding='utf-8')
          (decl/'market.yaml').write_text(yaml.safe_dump({'market_comparison':{'price':1277000,'as_of':'2026-08-31','source_ref':'https://stock.mk.co.kr/price/foreigner/KR7010130003'}},allow_unicode=True,sort_keys=False),encoding='utf-8')
          (decl/'street.json').write_text(json.dumps({'authorization_basis':'explicit_permission','reports':[]},ensure_ascii=False),encoding='utf-8')

          hypothesis_id='H:KZ:SOTP'
          intel={'rationale':'고려아연의 IFRS 8 공시 3부문을 각각 독립 가치경로로 평가하고 연결 제거와 순금융부채를 한 번만 반영한다.','hypotheses':[{'id':hypothesis_id,'statement':'비철금속 제조·수출입·자원순환의 서로 다른 스프레드를 분리한 정상화 SOTP가 단일 제조업 배수보다 연결 경제성을 더 정확히 표현한다.','causal_chain':['공시 부문별 매출·영업이익','2025 연간과 2026 H1 정상화 EBITDA','부문별 through-cycle multiple','SOTP equity value'],'supporting_evidence_ids':['UW:KR:DART:00102858:manufacturing_normalized_ebitda','UW:KR:DART:00102858:trading_normalized_ebitda','UW:KR:DART:00102858:recycling_normalized_ebitda'],'contradicting_evidence_ids':[],'kill_conditions':['다음 정기보고서에서 reportable segment 구조가 재분류되거나 제조부문 정상화 EBITDA가 두 기간 연속 Base 대비 30% 이상 하회'],'next_checks':['2026 3분기보고서 부문정보와 귀금속 실현가격']}],'requested_evidence':[],'scanner_reinforcements':[],'context_strength_linkage':{'not_applicable_reason':'이번 런은 공시 부문별 정상화 경제성 평가가 목적이며 외부 환경 변화에 대한 별도 숨은 자산가치는 정량 경로에 포함하지 않는다.'}}
          (staff/'intelligence_officer.json').write_text(json.dumps(intel,ensure_ascii=False,indent=2),encoding='utf-8')
          red={'counter_thesis':'은·금 가격 강세와 경영권 프리미엄이 현재 가격과 이익에 동시에 반영돼 정상화 EBITDA와 배수 모두 과대평가될 수 있으며, 대규모 장기금융자산·미국 프로젝트 자금은 자유현금으로 볼 수 없다.','issues':[{'id':'R:KZ:CYCLE','blocking':False,'description':'귀금속 가격과 재고·운전자본이 동시에 정상화되면 제조부문 EBITDA가 Base보다 낮아질 수 있다.','requested_evidence':['차기 분기 귀금속 실현가격과 운전자본']}],'requested_evidence':[]}
          (staff/'red_team_officer.json').write_text(json.dumps(red,ensure_ascii=False,indent=2),encoding='utf-8')

          # Bridge every valuation key deterministically from the declared underwriting Evidence.
          scenarios=('Down','Base','Bull')
          drafts=[]
          for scenario in scenarios:
              prefix={'Down':'down_','Base':'','Bull':'bull_'}[scenario]
              for sid in mapping:
                  for suffix,affected in [('normalized_ebitda','margin'),('normalized_multiple','multiple')]:
                      evidence_metric=f'{prefix}{sid}_{suffix}'
                      assumption_key=f'{sid}_{suffix}'
                      row=declarations[evidence_metric]
                      drafts.append({'assumption_key':assumption_key,'scenario_id':scenario,'hypothesis_id':hypothesis_id,'evidence_ids':[f'UW:KR:DART:00102858:{evidence_metric}'],'affected_variable':affected,'direction':'unchanged','value':row['value'],'unit':row['unit'],'canonical_unit':row['unit'],'transform_id':'identity_observation','rationale':'declared underwriting carried through unchanged','confidence':0.6,'kill_condition':'underwriting revision or contradicting filing','verification_event':'next periodic filing','economic_path_id':f'path:{sid}:{suffix}'})
                  for suffix,affected in [('ownership','segment_value'),('ev_adjustment','net_debt')]:
                      evidence_metric=f'{sid}_{suffix}'; row=declarations[evidence_metric]
                      drafts.append({'assumption_key':evidence_metric,'scenario_id':scenario,'hypothesis_id':hypothesis_id,'evidence_ids':[f'UW:KR:DART:00102858:{evidence_metric}'],'affected_variable':affected,'direction':'unchanged','value':row['value'],'unit':row['unit'],'canonical_unit':row['unit'],'transform_id':'identity_observation','rationale':'declared underwriting carried through unchanged','confidence':0.6,'kill_condition':'underwriting revision or contradicting filing','verification_event':'next periodic filing','economic_path_id':f'path:{sid}:{suffix}'})
              row=declarations['diluted_shares']
              drafts.append({'assumption_key':'diluted_shares','scenario_id':scenario,'hypothesis_id':hypothesis_id,'evidence_ids':['UW:KR:DART:00102858:diluted_shares'],'affected_variable':'share_count','direction':'unchanged','value':row['value'],'unit':row['unit'],'canonical_unit':row['unit'],'transform_id':'identity_observation','rationale':'declared underwriting carried through unchanged','confidence':0.6,'kill_condition':'underwriting revision or share-count change','verification_event':'next periodic filing','economic_path_id':'path:company:diluted_shares'})
          (staff/'bridge_analyst.json').write_text(json.dumps({'rationale':'Evidence-backed pass-through of the three-segment normalized valuation envelope.','drafts':drafts},ensure_ascii=False,indent=2),encoding='utf-8')

          (run/'prep_summary.json').write_text(json.dumps({'h1_segments':[{'name':e.name,'revenue':str(e.revenue),'operating_income':str(e.operating_income)} for e in h1_disc.entries],'fy2025_segments':[{'name':e.name,'revenue':str(e.revenue),'operating_income':str(e.operating_income)} for e in fy_disc.entries],'h1_da_thousand':str(h1_da),'fy_da_thousand':str(fy_da),'normalized_ebitda_KRW_billion':{k:str(v) for k,v in normalized.items()},'ownership':own,'net_ev_adjustment_KRW_billion':str(net_adjust)},ensure_ascii=False,indent=2),encoding='utf-8')
          print((run/'prep_summary.json').read_text(encoding='utf-8'))
          PY
      - name: Execute canonical PRISM SOTP
        id: prism
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/run_kr_live.py /tmp/koreazinc-010130 2>&1 | tee /tmp/koreazinc-010130/prism.log
      - name: Upload Korea Zinc PRISM SOTP bundle
        uses: actions/upload-artifact@v4
        with:
          name: KOREAZINC_010130_PRISM_SOTP
          path: /tmp/koreazinc-010130
