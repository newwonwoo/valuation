name: koreazinc-sotp-prism-v2

on:
  push:
    branches: [run/koreazinc-sotp-v2-010130-20260901]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Reuse frozen official-DART prepared run
        uses: actions/download-artifact@v4
        with:
          name: KOREAZINC_010130_PRISM_SOTP_V2
          path: /tmp/koreazinc-010130
          github-token: ${{ github.token }}
          run-id: 33428060052
      - name: Apply only the current PRISM work order
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, yaml

          run = Path('/tmp/koreazinc-010130')
          run_cfg = yaml.safe_load((run/'run.yaml').read_text(encoding='utf-8'))
          run_cfg['extra_required_evidence'] = [
              x for x in run_cfg.get('extra_required_evidence', [])
              if 'manufacturing' in x
          ]
          (run/'run.yaml').write_text(
              yaml.safe_dump(run_cfg, allow_unicode=True, sort_keys=False),
              encoding='utf-8',
          )

          uw_path = run/'declarations'/'underwriting.yaml'
          uw = yaml.safe_load(uw_path.read_text(encoding='utf-8'))
          d = uw['declarations']
          for sid in ('trading','recycling'):
              for pre in ('down_','bull_'):
                  d.pop(f'{pre}{sid}_normalized_ebitda', None)
                  d.pop(f'{pre}{sid}_normalized_multiple', None)

          additions = {
              'input_price': {
                  'value': 1663, 'unit': 'USD_per_DMT', 'segment': 'manufacturing',
                  'source_ref': 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814003958',
                  'rationale': '2026년 반기보고서 원재료 가격표의 아연정광 수입 평균가격 1,663달러/DMT를 제조 공정 input-price Evidence로 사용합니다.',
              },
              'output_price': {
                  'value': 5112279, 'unit': 'KRW_per_MT', 'segment': 'manufacturing',
                  'source_ref': 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814003958',
                  'rationale': '2026년 반기보고서 주요 제품 가격표의 아연 내수 평균단가 5,112,279원/MT를 제조 공정 output-price Evidence로 사용합니다.',
              },
              'product_yield': {
                  'value': 0.53, 'unit': 'ratio', 'segment': 'manufacturing',
                  'source_ref': 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814003958',
                  'rationale': '반기보고서 아연정광 기준품위 Zn 53%를 공정 input 대비 대표 금속함량 수율 proxy로 명시하며 실제 종합회수율과 동일시하지 않습니다.',
              },
              'plant_runs': {
                  'value': 1, 'unit': 'count', 'segment': 'manufacturing',
                  'source_ref': 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814003958',
                  'rationale': '반기보고서가 아연조업을 24시간 연속조업으로 기재하므로 전체 제조공정을 하나의 연속 operating run으로 정규화합니다.',
              },
              'turnaround': {
                  'value': 0, 'unit': 'days', 'segment': 'manufacturing',
                  'source_ref': 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814003958',
                  'rationale': '반기보고서는 부분 정기보수가 있어도 전체 제품생산 공정은 중단되지 않고 가동률 100%라고 공시하므로 whole-plant turnaround를 0일로 둡니다.',
              },
          }
          for metric, row in additions.items():
              existing = d.get(metric)
              rows = existing if isinstance(existing, list) else ([existing] if existing else [])
              if not any(x and x.get('segment') == 'manufacturing' for x in rows):
                  rows.insert(0, row)
              d[metric] = rows
          uw_path.write_text(
              yaml.safe_dump(uw, allow_unicode=True, sort_keys=False),
              encoding='utf-8',
          )

          bridge_path = run/'declarations'/'staff'/'bridge_analyst.json'
          bridge = json.loads(bridge_path.read_text(encoding='utf-8'))
          for draft in bridge.get('drafts', []):
              key = draft.get('assumption_key','')
              if key.startswith(('trading_','recycling_')) and key.endswith(('normalized_ebitda','normalized_multiple')):
                  base = d[key]
                  draft['evidence_ids'] = [f'UW:KR:DART:00102858:{key}']
                  draft['value'] = base['value']
                  draft['unit'] = base['unit']
                  draft['canonical_unit'] = base['unit']
          bridge_path.write_text(json.dumps(bridge, ensure_ascii=False, indent=2), encoding='utf-8')

          locator = run/'declarations'/'staff'/'filing_locator_analyst.json'
          if not locator.exists():
              locator.write_text(json.dumps({'locators': [], 'not_found': []}, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Execute canonical PRISM SOTP
        id: prism
        continue-on-error: true
        run: |
          set -o pipefail
          PYTHONPATH=src python scripts/run_kr_live.py /tmp/koreazinc-010130 2>&1 | tee /tmp/koreazinc-010130/prism.log
      - name: Upload Korea Zinc PRISM SOTP bundle
        uses: actions/upload-artifact@v4
        with:
          name: KOREAZINC_010130_PRISM_SOTP_FAST
          path: /tmp/koreazinc-010130
      - name: Show stop or completion
        run: cat /tmp/koreazinc-010130/prism.log
