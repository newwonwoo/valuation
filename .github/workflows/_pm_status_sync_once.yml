name: one-shot-pm-status-sync

on:
  push:
    branches:
      - chore/sync-pm-status-20260901

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/sync-pm-status-20260901
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Update portfolio and regenerate status
        run: |
          python scripts/_pm_status_sync_once.py
          PYTHONPATH=src python scripts/validate_project_portfolio.py
          PYTHONPATH=src python scripts/render_project_status.py --write
          PYTHONPATH=src python scripts/render_project_status.py --check
          git diff --check
      - name: Remove one-shot helpers and commit generated state
        run: |
          rm scripts/_pm_status_sync_once.py
          rm .github/workflows/_pm_status_sync_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/project_portfolio.yaml PROJECT_STATUS.md scripts/_pm_status_sync_once.py .github/workflows/_pm_status_sync_once.yml
          git commit -m 'chore: synchronize PRISM PM status [skip ci]'
          git push origin HEAD:chore/sync-pm-status-20260901
