name: refine-kr-segment-parser

on:
  push:
    branches: [feat/kr-trading-recycling-classification]

permissions:
  contents: write

jobs:
  refine:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kr-trading-recycling-classification
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply refinement
        run: python scripts/_refine_kr_segment_parser.py
      - name: Verify focused and full regression
        run: |
          python -m pip install -e '.[dev]'
          pytest -q tests/test_segment_note.py tests/test_declared_segments.py
          PYTHONPATH=src python scripts/validate_module_registries.py
          pytest -q
      - name: Commit target files only
        run: |
          rm scripts/_refine_kr_segment_parser.py
          rm .github/workflows/_refine_kr_segment_parser.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/valuation_engine/segment_note.py tests/test_segment_note.py scripts/_refine_kr_segment_parser.py .github/workflows/_refine_kr_segment_parser.yml
          git commit -m 'Accept disclosed rounding and generic two-tier segment names'
          git push origin HEAD:feat/kr-trading-recycling-classification
