name: verify-compare-runs-once

on:
  push:
    branches: [feat/compare-runs-variance-gate]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compare-runs-variance-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused variance-gate tests
        run: pytest -q tests/test_compare_runs.py
      - name: Full regression
        run: pytest -q
      - name: CLI smoke
        run: |
          python scripts/compare_runs.py --help >/tmp/compare-help.txt
          grep -q -- '--base-threshold-pct' /tmp/compare-help.txt
          grep -q -- '--probability-threshold-pp' /tmp/compare-help.txt
          grep -q -- '--wacc-threshold-pp' /tmp/compare-help.txt
          git diff --check
      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/_verify_compare_runs_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/_verify_compare_runs_once.yml
          git commit -m 'Remove compare-runs verification workflow'
          git push origin HEAD:feat/compare-runs-variance-gate
