name: verify-compare-runs-once

on:
  push:
    branches: [feat/compare-runs-variance-gate]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compare-runs-variance-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix Decimal display assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_compare_runs.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert [row["expected_delta_per_share"] for row in result["attribution"]] == [
              "5.000",
              "-2.000",
          ]
          '''
          new = '''    assert [
              Decimal(row["expected_delta_per_share"])
              for row in result["attribution"]
          ] == [Decimal("5"), Decimal("-2")]
          '''
          if old not in text:
              raise SystemExit('expected-value assertion anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused variance-gate tests
        run: pytest -q tests/test_compare_runs.py
      - name: Full regression
        run: pytest -q
      - name: CLI smoke
        run: |
          python scripts/compare_runs.py --help >/tmp/compare-help.txt
          grep -q -- '--base-threshold-pct' /tmp/compare-help.txt
          grep -q -- '--probability-threshold-pp' /tmp/compare-help.txt
          grep -q -- '--wacc-threshold-pp' /tmp/compare-help.txt
          git diff --check
      - name: Commit verified files and remove one-shot workflow
        run: |
          rm .github/workflows/_verify_compare_runs_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_compare_runs.py .github/workflows/_verify_compare_runs_once.yml
          git commit -m 'Finalize compare-runs variance gate tests'
          git push origin HEAD:feat/compare-runs-variance-gate
