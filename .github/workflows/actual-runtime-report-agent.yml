name: actual-runtime-report-agent

on:
  push:
    branches:
      - fix/capacity-live-primary-e2e

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capacity-live-primary-e2e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Add actual-run report acceptance
        run: python scripts/apply_actual_runtime_report_acceptance.py
      - name: Execute full LIVE_PRIMARY fixture and export report
        env:
          PRISM_REPORT_EXPORT_PATH: examples/report_forms/PRISM_ACTUAL_RUNTIME_REPORT.md
        run: pytest -q tests/test_full_live_primary_runtime.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Remove bootstrap agent files
        run: git rm .github/workflows/actual-runtime-report-agent.yml scripts/apply_actual_runtime_report_acceptance.py
      - name: Commit actual runtime report proof
        run: |
          git config user.name "reporting-qa-agent"
          git config user.email "reporting-qa-agent@users.noreply.github.com"
          git add -A
          git commit -m "Validate report form against an actual LIVE_PRIMARY run [report-agent]"
          git push origin HEAD:fix/capacity-live-primary-e2e
