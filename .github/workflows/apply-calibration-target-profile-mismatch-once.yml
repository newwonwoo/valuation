name: apply-calibration-target-profile-mismatch-once

on:
  push:
    branches:
      - fix/calibration-target-profile-mismatch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch fail-closed target/profile binding
        run: |
          python - <<'PY'
          from pathlib import Path

          runner = Path("scripts/run_kr_live.py")
          text = runner.read_text(encoding="utf-8")
          old = "class RunbookError(ValueError):\n    pass\n\n"
          new = "class RunbookError(ValueError):\n    pass\n\n\nclass _TargetProfileMismatchError(RunbookError):\n    \"\"\"Resolved target and OpenDART company profile identify different issuers.\"\"\"\n\n    pass\n\n"
          assert text.count(old) == 1, "RunbookError insertion anchor changed"
          text = text.replace(old, new, 1)

          old = "    if profile.stock_code and profile.stock_code != identity.ticker:\n        raise RunbookError(\n            \"OpenDART company profile ticker disagrees with resolved target\"\n        )\n    return identity, corp_code, profile\n"
          new = "    if profile.corp_code and profile.corp_code != corp_code:\n        raise _TargetProfileMismatchError(\n            \"OpenDART company profile corp code disagrees with resolved target: \"\n            f\"profile={profile.corp_code}, resolved={corp_code}\"\n        )\n    if profile.stock_code and profile.stock_code != identity.ticker:\n        raise _TargetProfileMismatchError(\n            \"OpenDART company profile ticker disagrees with resolved target: \"\n            f\"profile={profile.stock_code}, resolved={identity.ticker}\"\n        )\n    return identity, corp_code, profile\n"
          assert text.count(old) == 1, "target/profile validation anchor changed"
          text = text.replace(old, new, 1)

          old = "    try:\n        identity, corp_code, profile = _resolved_target_context(\n            run_dir, config, network\n        )\n    except Exception:\n        return\n"
          new = "    try:\n        identity, corp_code, profile = _resolved_target_context(\n            run_dir, config, network\n        )\n    except _TargetProfileMismatchError:\n        # This mismatch is not guaranteed to be rejected later by the canonical\n        # profile fetcher. Swallowing it would disable a mandatory cohort for a\n        # run whose raw company payload belongs to another issuer.\n        raise\n    except Exception:\n        return\n"
          assert text.count(old) == 1, "calibration preflight exception anchor changed"
          text = text.replace(old, new, 1)
          runner.write_text(text, encoding="utf-8")
          PY
      - name: Add regression coverage
        run: |
          cat >> tests/test_kr_live_calibration_gate.py <<'PYTEST'


          def test_target_profile_ticker_mismatch_cannot_disable_calibration_gate(tmp_path):
              run_dir = _copy_kisco(tmp_path, "target-profile-ticker-mismatch")
              company_path = run_dir / "raw" / "company.json"
              import json
              company = json.loads(company_path.read_text(encoding="utf-8"))
              company["stock_code"] = "084010"
              company_path.write_text(json.dumps(company), encoding="utf-8")
              payload = run_kr_live._load_run(run_dir)
              payload.pop("calibration", None)
              (run_dir / "run.yaml").write_text(
                  yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )

              with pytest.raises(run_kr_live.RunbookError) as caught:
                  run_kr_live.execute_run(run_dir)
              message = str(caught.value)
              assert "profile ticker disagrees with resolved target" in message
              assert "084010" in message
              assert "104700" in message


          def test_target_profile_corp_code_mismatch_cannot_disable_calibration_gate(tmp_path):
              run_dir = _copy_kisco(tmp_path, "target-profile-corp-mismatch")
              company_path = run_dir / "raw" / "company.json"
              import json
              company = json.loads(company_path.read_text(encoding="utf-8"))
              company["corp_code"] = "00111111"
              company_path.write_text(json.dumps(company), encoding="utf-8")
              payload = run_kr_live._load_run(run_dir)
              payload.pop("calibration", None)
              (run_dir / "run.yaml").write_text(
                  yaml.safe_dump(payload, allow_unicode=True, sort_keys=False),
                  encoding="utf-8",
              )

              with pytest.raises(run_kr_live.RunbookError) as caught:
                  run_kr_live.execute_run(run_dir)
              message = str(caught.value)
              assert "profile corp code disagrees with resolved target" in message
              assert "00111111" in message
              assert "00687711" in message
          PYTEST
      - name: Validate focused and full suite
        run: |
          python -m pip install -e '.[dev]' >/dev/null
          python -m pytest -q tests/test_kr_live_calibration_gate.py
          python -m pytest -q
          python scripts/validate_project_portfolio.py
      - name: Commit clean fix
        run: |
          rm .github/workflows/apply-calibration-target-profile-mismatch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fail closed on calibration target profile mismatch'
          git push origin HEAD:fix/calibration-target-profile-mismatch
