name: apply-range-authority-patch-once

on:
  push:
    branches:
      - feat/reviewed-assumption-range-rules

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reviewed-assumption-range-rules
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_apply_range_authority_review.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Focused regressions
        run: >-
          pytest -q
          tests/test_assumption_range_rules.py
          tests/test_assumption_range_review_regressions.py
          tests/test_assumption_range_authority_regressions.py
          tests/test_assumption_compiler.py
          tests/test_run_hash.py
          tests/test_generic_audit_freeze_e2e.py
          tests/test_generic_cold_start.py
          tests/test_multi_segment_cold_start.py
      - name: Full regression and PM validation
        run: |
          pytest -q
          python scripts/validate_project_portfolio.py
      - name: Commit clean change set
        run: |
          rm scripts/_apply_range_authority_review.py
          rm .github/workflows/apply-range-authority-patch-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Bind range authority to canonical reviewed registry'
          git push origin HEAD:feat/reviewed-assumption-range-rules
