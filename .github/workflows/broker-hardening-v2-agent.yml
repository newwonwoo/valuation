name: broker-hardening-v2-agent

on:
  push:
    branches: [fix/broker-research-hardening-v2]
    paths:
      - 'src/valuation_engine/broker_runtime.py'
      - 'src/valuation_engine/broker_runtime_v2.py'
      - 'tests/test_broker_runtime.py'
      - 'scripts/apply_broker_hardening_v2.py'
      - '.github/workflows/broker-hardening-v2-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/broker-research-hardening-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply deterministic hardening patch
        run: python scripts/apply_broker_hardening_v2.py
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile hardened runtime
        run: >-
          python -m py_compile
          src/valuation_engine/broker_runtime.py
          src/valuation_engine/broker_runtime_v2.py
          src/valuation_engine/live_runtime.py
          src/valuation_engine/sanil_live_primary.py
      - name: Focused Broker and Sanil regressions
        run: >-
          pytest -q
          tests/test_broker_research.py
          tests/test_broker_runtime.py
          tests/test_sanil_live_primary.py
          tests/test_full_live_primary_runtime.py
          tests/test_report_form.py
      - name: Regenerate actual Sanil LIVE_PRIMARY report
        run: >-
          PYTHONPATH=src
          python scripts/run_sanil_live_primary.py
          --output examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md
      - name: Broker and source-placement validators
        run: |
          PYTHONPATH=src python scripts/validate_broker_research_layer.py
          PYTHONPATH=src python scripts/validate_workflow_source_injection.py
          PYTHONPATH=src python scripts/validate_module_requirement_plans.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Commit validated runtime outputs only
        run: |
          git config user.name "broker-hardening-agent"
          git config user.email "broker-hardening-agent@users.noreply.github.com"
          git add \
            src/valuation_engine/live_runtime.py \
            src/valuation_engine/sanil_live_primary.py \
            tests/test_sanil_live_primary.py \
            docs/BROKER_RESEARCH_LAYER_V1.md \
            examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "Connect hardened Broker Research through LIVE_PRIMARY [broker-v2]"
          git push origin HEAD:fix/broker-research-hardening-v2
