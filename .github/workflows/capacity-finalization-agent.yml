name: capacity-finalization-agent

on:
  push:
    branches:
      - fix/capacity-live-primary-e2e

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capacity-live-primary-e2e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Finalize PM branch scope
        run: python scripts/finalize_capacity_e2e_branch.py
      - name: Regenerate report form
        run: PYTHONPATH=src python scripts/render_verified_report_form.py
      - name: Regenerate actual LIVE_PRIMARY report
        env:
          PRISM_REPORT_EXPORT_PATH: examples/report_forms/PRISM_ACTUAL_RUNTIME_REPORT.md
        run: pytest -q tests/test_full_live_primary_runtime.py
      - name: Focused acceptance
        run: >-
          pytest -q
          tests/test_capacity_commitment_gate.py
          tests/test_capacity_consumption.py
          tests/test_capacity_live_runtime_integration.py
          tests/test_capacity_runtime_integrity.py
          tests/test_capacity_freeze_binding.py
          tests/test_live_runtime_assembly.py
          tests/test_report_form.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Remove finalization bootstrap
        run: git rm .github/workflows/capacity-finalization-agent.yml scripts/finalize_capacity_e2e_branch.py
      - name: Commit final PM branch
        run: |
          git config user.name "capacity-pm-integrator"
          git config user.email "capacity-pm-integrator@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Capacity LIVE_PRIMARY acceptance [pm-integrator]"
          git push origin HEAD:fix/capacity-live-primary-e2e
