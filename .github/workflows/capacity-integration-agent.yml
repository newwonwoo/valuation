name: capacity-integration-agent

on:
  push:
    branches:
      - fix/capacity-live-primary-e2e

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capacity-live-primary-e2e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply runtime integration
        run: python scripts/apply_capacity_live_primary_integration.py
      - name: Generate verified report form
        run: PYTHONPATH=src python scripts/render_verified_report_form.py
      - name: Focused integration tests
        run: >-
          pytest -q
          tests/test_capacity_commitment_gate.py
          tests/test_capacity_consumption.py
          tests/test_capacity_live_runtime_integration.py
          tests/test_live_runtime_assembly.py
          tests/test_report_form.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Remove bootstrap agent files
        run: git rm .github/workflows/capacity-integration-agent.yml scripts/apply_capacity_live_primary_integration.py
      - name: Commit integrated implementation
        run: |
          git config user.name "capacity-runtime-agent"
          git config user.email "capacity-runtime-agent@users.noreply.github.com"
          git add -A
          git commit -m "Wire capacity commitment into LIVE_PRIMARY [capacity-agent]"
          git push origin HEAD:fix/capacity-live-primary-e2e
