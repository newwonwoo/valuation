name: capacity-integrity-agent

on:
  push:
    branches:
      - fix/capacity-live-primary-e2e

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capacity-live-primary-e2e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Wire downstream integrity adapters
        run: python scripts/apply_capacity_integrity_wiring.py
      - name: Focused integrity regression
        run: >-
          pytest -q
          tests/test_capacity_commitment_gate.py
          tests/test_capacity_consumption.py
          tests/test_capacity_live_runtime_integration.py
          tests/test_capacity_runtime_integrity.py
          tests/test_live_runtime_assembly.py
          tests/test_report_form.py
          tests/test_full_live_primary_runtime.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Remove bootstrap files
        run: git rm .github/workflows/capacity-integrity-agent.yml scripts/apply_capacity_integrity_wiring.py
      - name: Commit verified downstream integrity
        run: |
          git config user.name "capacity-integrity-agent"
          git config user.email "capacity-integrity-agent@users.noreply.github.com"
          git add -A
          git commit -m "Enforce capacity paths through valuation and audit [integrity-agent]"
          git push origin HEAD:fix/capacity-live-primary-e2e
