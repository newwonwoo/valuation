name: fix-sotp-sensitivity-review-once

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/sotp-segment-sensitivity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sotp-segment-sensitivity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch review findings and clean generated artifacts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/valuation_engine/valuation_sensitivity.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'from dataclasses import dataclass\n'
          if old_import in text:
              text = text.replace(old_import, 'from dataclasses import dataclass, replace\n', 1)

          old_dominant = dedent('''\
              @property
              def dominant(self) -> VariableSensitivity | None:
                  candidates = list(self.variables)
                  candidates.extend(
                      variable for segment in self.segments for variable in segment.variables
                  )
                  if not candidates:
                      return None
                  return max(candidates, key=lambda item: item.max_abs_pct)
          ''')
          new_dominant = dedent('''\
              @property
              def dominant(self) -> VariableSensitivity | None:
                  candidates = (
                      [
                          variable
                          for segment in self.segments
                          for variable in segment.variables
                      ]
                      if self.segments
                      else list(self.variables)
                  )
                  if not candidates:
                      return None
                  return max(candidates, key=lambda item: item.max_abs_pct)
          ''')
          if old_dominant not in text:
              raise SystemExit('dominant property source anchor not found')
          text = text.replace(old_dominant, new_dominant, 1)

          old_guard = dedent('''\
                  except (TypeError, ValueError):
                      return None
                  if diluted_shares <= 0:
          ''')
          new_guard = dedent('''\
                  except (TypeError, ValueError):
                      return None
                  if diagnostics.execution_family != "explicit_fcff_dcf":
                      return None
                  if diluted_shares <= 0:
          ''')
          # dedent removes the function-level indentation; match the body fragment directly.
          old_guard = old_guard.replace('\n', '\n    ')
          new_guard = new_guard.replace('\n', '\n    ')
          old_guard = old_guard[4:-4]
          new_guard = new_guard[4:-4]
          if old_guard not in text:
              raise SystemExit('diagnostics guard source anchor not found')
          text = text.replace(old_guard, new_guard, 1)

          old_return = dedent('''\
                  base_value_per_share=base_value_per_share,
                  segments=segments,
              )
          ''')
          new_return = dedent('''\
                  base_value_per_share=base_value_per_share,
                  variables=tuple(
                      replace(variable, label=f"{segment.asset_id} {variable.label}")
                      for segment in segments
                      for variable in segment.variables
                  ),
                  segments=segments,
              )
          ''')
          old_return = old_return.replace('\n', '\n        ')
          new_return = new_return.replace('\n', '\n        ')
          old_return = old_return[8:-8]
          new_return = new_return[8:-8]
          if old_return not in text:
              raise SystemExit('SOTP return source anchor not found')
          text = text.replace(old_return, new_return, 1)
          path.write_text(text, encoding='utf-8')

          guards = Path('tests/test_sotp_segment_sensitivity_guards.py')
          g = guards.read_text(encoding='utf-8')
          if 'from dataclasses import replace\n' not in g:
              g = g.replace('from decimal import Decimal\n', 'from dataclasses import replace\nfrom decimal import Decimal\n', 1)
          if 'from valuation_engine.report_form import _valuation_sensitivity_lines\n' not in g:
              g = g.replace(
                  'from valuation_engine.sotp import AggregationComponent\n',
                  'from valuation_engine.report_form import _valuation_sensitivity_lines\nfrom valuation_engine.sotp import AggregationComponent\n',
                  1,
              )
          appendix = dedent('''

              def test_non_dcf_execution_family_is_not_perturbed():
                  bad_diagnostics = replace(
                      _diagnostics((Decimal("10"), Decimal("11"), Decimal("12"))),
                      execution_family="normalized_multiple",
                  )
                  bad = _dcf_component("BAD", bad_diagnostics)
                  good = _dcf_component(
                      "GOOD",
                      _diagnostics((Decimal("30"), Decimal("35"), Decimal("40"))),
                  )
                  report = build_valuation_sensitivity_report(valuation=_valuation((bad, good)))
                  assert tuple(item.asset_id for item in report.scenarios[0].segments) == ("GOOD",)


              def test_segment_variables_are_exposed_to_the_user_facing_renderer():
                  first = _dcf_component(
                      "FIRST",
                      _diagnostics((Decimal("30"), Decimal("35"), Decimal("40"))),
                  )
                  second = _dcf_component(
                      "SECOND",
                      _diagnostics((Decimal("20"), Decimal("24"), Decimal("28"))),
                  )
                  report = build_valuation_sensitivity_report(
                      valuation=_valuation((first, second))
                  )
                  lines = _valuation_sensitivity_lines(
                      {"valuation_sensitivity_report": report}
                  )
                  detail = next(line for line in lines if line.startswith("- Core 기준"))
                  assert "FIRST 가중평균자본비용" in detail
                  assert "SECOND 가중평균자본비용" in detail
                  assert not detail.rstrip().endswith("—")
          ''')
          if 'test_non_dcf_execution_family_is_not_perturbed' not in g:
              g = g.rstrip() + appendix + '\n'
          guards.write_text(g, encoding='utf-8')
          PY

          git fetch origin main
          git checkout origin/main -- \
            examples/report_forms/PRISM_ACTUAL_RUNTIME_REPORT.md \
            examples/report_forms/SANIL_062040_LATEST_REPORT.json \
            examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.html \
            examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md
          git rm -f --ignore-unmatch \
            examples/report_forms/PRISM_062040_01_summary_8040C5E4C0A8.svg \
            examples/report_forms/PRISM_062040_02_assumptions_8040C5E4C0A8.svg \
            examples/report_forms/SANIL_062040_20260827_TP242038_8040C5E4C0A8.html \
            examples/report_forms/SANIL_062040_20260827_TP242038_8040C5E4C0A8.md

      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate focused and full suite
        run: |
          pytest -q tests/test_sotp_segment_sensitivity.py tests/test_sotp_segment_sensitivity_guards.py tests/test_valuation_sensitivity.py tests/test_report_form.py
          pytest -q
          python scripts/validate_project_portfolio.py
      - name: Commit clean review fix
        shell: bash
        run: |
          git rm -f .github/workflows/fix-sotp-sensitivity-review-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix SOTP sensitivity review findings'
          git push origin HEAD:feat/sotp-segment-sensitivity
