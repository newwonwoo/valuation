name: harden-range-target-binding-once

on:
  push:
    branches:
      - feat/reviewed-assumption-range-rules

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reviewed-assumption-range-rules
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind range history to target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/valuation_engine/assumption_range_rules.py')
          text = path.read_text(encoding='utf-8')
          old = '''def apply_reviewed_assumption_ranges(\n    specs: tuple[AssumptionSpec, ...],\n    *,\n    ledger: EvidenceLedger,\n    registry: AssumptionRangeRuleRegistry,\n    llm_bounds: tuple[tuple[str, str, str | None, str | None], ...] = (),\n) -> RangeApplicationResult:\n'''
          new = '''def apply_reviewed_assumption_ranges(\n    specs: tuple[AssumptionSpec, ...],\n    *,\n    ledger: EvidenceLedger,\n    target_id: str,\n    registry: AssumptionRangeRuleRegistry,\n    llm_bounds: tuple[tuple[str, str, str | None, str | None], ...] = (),\n) -> RangeApplicationResult:\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('range function signature marker missing')
          old = '''    registry.validate()\n    active = tuple(ledger.active())\n'''
          new = '''    registry.validate()\n    if not target_id:\n        raise AssumptionRangeRuleError("range application requires target_id")\n    active = tuple(\n        item for item in ledger.active() if item.target == target_id\n    )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'item.target == target_id' not in text:
              raise SystemExit('active evidence marker missing')
          path.write_text(text, encoding='utf-8')

          path = Path('src/valuation_engine/assumption_compiler.py')
          text = path.read_text(encoding='utf-8')
          old = '''        range_application = apply_reviewed_assumption_ranges(\n            specs,\n            ledger=ledger,\n            registry=range_registry,\n            llm_bounds=llm_bounds,\n        )\n'''
          new = '''        range_application = apply_reviewed_assumption_ranges(\n            specs,\n            ledger=ledger,\n            target_id=target_id,\n            registry=range_registry,\n            llm_bounds=llm_bounds,\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'target_id=target_id' not in text:
              raise SystemExit('compiler range call marker missing')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_assumption_range_rules.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    layer: EvidenceSourceLayer = EvidenceSourceLayer.REALIZED_OR_FILING,\n) -> EvidenceRecord:',
              '    layer: EvidenceSourceLayer = EvidenceSourceLayer.REALIZED_OR_FILING,\n    target: str = "T",\n) -> EvidenceRecord:',
              1,
          )
          text = text.replace('        target="T",\n        metric=metric,', '        target=target,\n        metric=metric,', 1)
          text = text.replace('        ledger=ledger,\n        registry=registry,', '        ledger=ledger,\n        target_id="T",\n        registry=registry,')
          marker = '''\ndef test_compiler_ignores_unreviewed_llm_bounds_but_enforces_reviewed_rule(tmp_path):\n'''
          added = '''\ndef test_range_rule_never_uses_another_targets_filing_history(tmp_path):\n    registry = load_assumption_range_rule_registry(_rule_file(tmp_path))\n    ledger = EvidenceLedger(\n        (\n            _evidence("U1", "utilization_history", "0.70", effective_date="2023-12-31", target="U"),\n            _evidence("U2", "utilization_history", "0.80", effective_date="2024-12-31", target="U"),\n            _evidence("U3", "utilization_history", "0.90", effective_date="2025-12-31", target="U"),\n        )\n    )\n    with pytest.raises(AssumptionRangeRuleError, match="found 0"):\n        apply_reviewed_assumption_ranges(\n            (\n                AssumptionSpec(\n                    "utilization",\n                    "Base",\n                    "B1",\n                    "ratio",\n                    "identity_observation",\n                ),\n            ),\n            ledger=ledger,\n            target_id="T",\n            registry=registry,\n        )\n\n'''
          if 'test_range_rule_never_uses_another_targets_filing_history' not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker missing')
              text = text.replace(marker, added + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate
        run: |
          pytest -q tests/test_assumption_range_rules.py tests/test_assumption_compiler.py tests/test_generic_cold_start.py tests/test_multi_segment_cold_start.py
          pytest -q
          python scripts/validate_project_portfolio.py
      - name: Commit clean change set
        shell: bash
        run: |
          rm .github/workflows/harden-range-target-binding-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/valuation_engine/assumption_range_rules.py src/valuation_engine/assumption_compiler.py tests/test_assumption_range_rules.py .github/workflows/harden-range-target-binding-once.yml
          git diff --cached --check
          git commit -m 'Bind reviewed range history to current target'
          git push origin HEAD:feat/reviewed-assumption-range-rules
