name: harden-sotp-sensitivity-once

on:
  push:
    branches:
      - feat/sotp-segment-sensitivity

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sotp-segment-sensitivity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch guards
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/valuation_engine/valuation_sensitivity.py')
          text = path.read_text(encoding='utf-8')
          old = '''    diagnostics = component.diagnostics\n    ownership = component.ownership_ratio\n    if diagnostics is None or ownership is None or ownership <= _ZERO:\n        return None\n'''
          new = '''    diagnostics = component.diagnostics\n    ownership = component.ownership_ratio\n    if (\n        not isinstance(diagnostics, SegmentValuationDiagnostics)\n        or not isinstance(ownership, Decimal)\n        or not ownership.is_finite()\n        or ownership <= _ZERO\n    ):\n        return None\n'''
          if old not in text:
              raise SystemExit('SOTP input guard marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '                    if dominant in segment.variables\n',
              '                    if any(dominant is item for item in segment.variables)\n',
              1,
          )
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate
        run: |
          pytest -q tests/test_valuation_sensitivity.py tests/test_sotp_segment_sensitivity.py tests/test_sotp_segment_sensitivity_guards.py tests/test_generic_audit_freeze_e2e.py tests/test_generic_evaluator_sotp.py
          pytest -q
          python scripts/validate_project_portfolio.py
      - name: Commit clean change set
        run: |
          rm .github/workflows/harden-sotp-sensitivity-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden SOTP sensitivity input guards'
          git push origin HEAD:feat/sotp-segment-sensitivity
