name: live-company-acceptance-agent

on:
  push:
    branches: [feat/live-company-acceptance-fixtures]
    paths:
      - 'config/live_company_fixture_specs.yaml'
      - 'src/valuation_engine/required_company_live.py'
      - 'scripts/generate_required_live_company_fixtures.py'
      - 'scripts/apply_live_company_acceptance_registry.py'
      - '.github/workflows/live-company-acceptance-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-company-acceptance-fixtures
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source and market dependencies
        run: python -m pip install finance-datareader PyYAML
      - name: Integrate source, sector and unit registries
        run: python scripts/apply_live_company_acceptance_registry.py
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Generate actual success and blocked artifacts
        run: PYTHONPATH=src python scripts/generate_required_live_company_fixtures.py
      - name: Validate full acceptance contract
        run: |
          PYTHONPATH=src python scripts/validate_live_company_acceptance.py
          pytest -q tests/test_live_company_acceptance_manifest.py tests/test_live_company_capture.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Remove one-shot integration scaffolding
        run: >-
          git rm
          .github/workflows/live-company-acceptance-agent.yml
          scripts/apply_live_company_acceptance_registry.py
      - name: Commit accepted real-company fixtures
        run: |
          git config user.name "live-company-acceptance-agent"
          git config user.email "live-company-acceptance-agent@users.noreply.github.com"
          git add -A
          git commit -m "Commit required real-company LIVE_PRIMARY acceptance artifacts"
          git push origin HEAD:feat/live-company-acceptance-fixtures
