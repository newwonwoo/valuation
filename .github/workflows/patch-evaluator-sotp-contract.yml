name: patch-evaluator-sotp-contract

on:
  push:
    branches: [feature/generic-evaluator-sotp]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-evaluator-sotp
      - name: Patch evaluator contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config/unit_contract_registry.yaml')
          text = p.read_text(encoding='utf-8')
          replacements = {
            '''  - unit_id: DETERMINISTIC_VALUATION\n    unit_type: valuation_engine\n    implementation_status: partial_live_legacy_generic_design\n''':
            '''  - unit_id: DETERMINISTIC_VALUATION\n    unit_type: valuation_engine\n    implementation_status: registry_core_with_initial_evaluator\n''',
            '''  - unit_id: SOTP_AGGREGATOR\n    unit_type: aggregator\n    implementation_status: design_ready_partial\n''':
            '''  - unit_id: SOTP_AGGREGATOR\n    unit_type: aggregator\n    implementation_status: implemented_core\n''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'status pattern not found: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)
          anchor = text.index('  - unit_id: DETERMINISTIC_VALUATION')
          tail = text[anchor:]
          old_ref = '    canonical_refs: [src/valuation_engine/engine.py, docs/GENERIC_ENGINE_DESIGN.md]\n'
          new_ref = '    canonical_refs: [src/valuation_engine/evaluator_registry.py, src/valuation_engine/engine.py, docs/GENERIC_ENGINE_DESIGN.md]\n'
          if old_ref not in tail:
              raise SystemExit('DETERMINISTIC_VALUATION refs not found')
          tail = tail.replace(old_ref, new_ref, 1)
          text = text[:anchor] + tail
          anchor = text.index('  - unit_id: SOTP_AGGREGATOR')
          tail = text[anchor:]
          old_ref = '    canonical_refs: [docs/GENERIC_ENGINE_DESIGN.md, src/valuation_engine/engine.py]\n'
          new_ref = '    canonical_refs: [src/valuation_engine/sotp.py, docs/GENERIC_ENGINE_DESIGN.md, src/valuation_engine/engine.py]\n'
          if old_ref not in tail:
              raise SystemExit('SOTP_AGGREGATOR refs not found')
          tail = tail.replace(old_ref, new_ref, 1)
          text = text[:anchor] + tail
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit contract sync
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/unit_contract_registry.yaml
          git commit -m 'docs: sync evaluator and SOTP implementation status'
          git push origin HEAD:feature/generic-evaluator-sotp
