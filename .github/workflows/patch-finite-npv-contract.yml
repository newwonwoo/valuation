name: patch-finite-npv-contract

on:
  push:
    branches: [feature/finite-life-npv-evaluators]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finite-life-npv-evaluators
      - name: Patch readiness and unit contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config/live_primary_readiness.yaml')
          text = p.read_text(encoding='utf-8')
          old = '    reason: exact registry/SOTP runtime now supports normalized multiples and same-run-WACC explicit FCFF DCF registrations for driver-based methods; finite-life project/rNPV/NAV/residual-income and other archetype-specific evaluator coverage remains incomplete.\n'
          new = '    reason: exact registry/SOTP runtime supports normalized multiples, same-run-WACC explicit FCFF DCF, and exact finite-life project_npv/reserve_npv/cohort_npv registrations; probability-weighted rNPV, NAV/residual-income and other archetype-specific evaluator coverage remains incomplete.\n'
          if old not in text:
              raise SystemExit('DETERMINISTIC_VALUATION readiness pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('config/unit_contract_registry.yaml')
          text = p.read_text(encoding='utf-8')
          old = 'canonical_refs: [src/valuation_engine/evaluator_registry.py, src/valuation_engine/dcf_evaluators.py, src/valuation_engine/valuation_execution.py, src/valuation_engine/valuation_adapter.py, src/valuation_engine/risk_impact.py, src/valuation_engine/engine.py, docs/GENERIC_ENGINE_DESIGN.md]'
          new = 'canonical_refs: [src/valuation_engine/evaluator_registry.py, src/valuation_engine/dcf_evaluators.py, src/valuation_engine/finite_life_evaluators.py, src/valuation_engine/valuation_execution.py, src/valuation_engine/valuation_adapter.py, src/valuation_engine/risk_impact.py, src/valuation_engine/engine.py, docs/GENERIC_ENGINE_DESIGN.md, docs/FINITE_LIFE_NPV_EVALUATORS.md]'
          if old not in text:
              raise SystemExit('DETERMINISTIC_VALUATION contract refs pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit contract sync
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/live_primary_readiness.yaml config/unit_contract_registry.yaml
          git commit -m 'docs: record exact finite-life NPV evaluator coverage'
          git push origin HEAD:feature/finite-life-npv-evaluators
