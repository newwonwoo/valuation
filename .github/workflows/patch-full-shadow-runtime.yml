name: patch-full-shadow-runtime

on:
  push:
    branches: [feature/full-primary-shadow-runtime-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/full-primary-shadow-runtime-v2
      - name: Patch append-only runtime and Unit Contract refs
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/valuation_engine/primary_shadow_runtime.py')
          text = runtime.read_text(encoding='utf-8')
          line = '            "selected_methods": config.selected_methods,\n'
          if line not in text:
              raise SystemExit('selected_methods initial-data line not found')
          runtime.write_text(text.replace(line, '', 1), encoding='utf-8')

          registry = Path('config/unit_contract_registry.yaml')
          text = registry.read_text(encoding='utf-8')
          old = '    canonical_refs: [src/valuation_engine/control_plane.py, src/valuation_engine/orchestrator.py, config/control_plane_stage_registry.yaml, docs/CONTROL_PLANE_ARCHITECTURE.md]\n'
          new = '    canonical_refs: [src/valuation_engine/control_plane.py, src/valuation_engine/orchestrator.py, src/valuation_engine/primary_shadow_runtime.py, config/control_plane_stage_registry.yaml, docs/CONTROL_PLANE_ARCHITECTURE.md, docs/PRIMARY_SHADOW_RUNTIME.md]\n'
          if old not in text:
              raise SystemExit('Control Plane canonical refs not found')
          registry.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit synchronized runtime
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/valuation_engine/primary_shadow_runtime.py config/unit_contract_registry.yaml
          git commit -m 'fix: preserve append-only valuation identity in full shadow runtime'
          git push origin HEAD:feature/full-primary-shadow-runtime-v2
