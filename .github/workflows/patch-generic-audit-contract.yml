name: patch-generic-audit-contract

on:
  push:
    branches: [feature/generic-audit-freeze]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generic-audit-freeze
      - name: Patch audit contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config/unit_contract_registry.yaml')
          text = p.read_text(encoding='utf-8')
          old = '''  - unit_id: AUDIT_GATE\n    unit_type: audit\n    implementation_status: implemented\n'''
          new = '''  - unit_id: AUDIT_GATE\n    unit_type: audit\n    implementation_status: implemented_generic_and_legacy\n'''
          if old not in text:
              raise SystemExit('AUDIT_GATE status pattern not found')
          text = text.replace(old, new, 1)
          anchor = text.index('  - unit_id: AUDIT_GATE')
          tail = text[anchor:]
          old_ref = '    canonical_refs: [src/valuation_engine/audit.py, SKILL.md]\n'
          new_ref = '    canonical_refs: [src/valuation_engine/generic_audit.py, src/valuation_engine/audit_adapter.py, src/valuation_engine/audit.py, SKILL.md]\n'
          if old_ref not in tail:
              raise SystemExit('AUDIT_GATE refs not found')
          tail = tail.replace(old_ref, new_ref, 1)
          p.write_text(text[:anchor] + tail, encoding='utf-8')
          PY
      - name: Commit contract sync
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/unit_contract_registry.yaml
          git commit -m 'docs: sync generic audit implementation status'
          git push origin HEAD:feature/generic-audit-freeze
