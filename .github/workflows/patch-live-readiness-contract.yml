name: patch-live-readiness-contract

on:
  push:
    branches: [feature/live-primary-dart-readiness-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-primary-dart-readiness-v2
      - name: Patch Unit Contract references
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config/unit_contract_registry.yaml')
          text = p.read_text(encoding='utf-8')
          replacements = {
            'canonical_refs: [src/valuation_engine/control_plane.py, src/valuation_engine/orchestrator.py, config/control_plane_stage_registry.yaml, docs/CONTROL_PLANE_ARCHITECTURE.md]':
            'canonical_refs: [src/valuation_engine/control_plane.py, src/valuation_engine/orchestrator.py, src/valuation_engine/live_readiness.py, config/control_plane_stage_registry.yaml, config/live_primary_readiness.yaml, docs/CONTROL_PLANE_ARCHITECTURE.md, docs/LIVE_PRIMARY_READINESS.md]',
            'canonical_refs: [src/valuation_engine/evidence_collection.py, src/valuation_engine/evidence_adapter.py, src/valuation_engine/live_indexers.py, src/valuation_engine/source_index.py, config/industry_source_registry.yaml, config/foundation_source_registry.yaml]':
            'canonical_refs: [src/valuation_engine/evidence_collection.py, src/valuation_engine/evidence_adapter.py, src/valuation_engine/dart_facts.py, src/valuation_engine/live_indexers.py, src/valuation_engine/source_index.py, config/industry_source_registry.yaml, config/foundation_source_registry.yaml, docs/LIVE_PRIMARY_READINESS.md]',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'pattern not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit contract refs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/unit_contract_registry.yaml
          git commit -m 'docs: link LIVE_PRIMARY readiness and DART fact adapter'
          git push origin HEAD:feature/live-primary-dart-readiness-v2
