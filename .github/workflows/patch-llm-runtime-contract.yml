name: patch-llm-runtime-contract

on:
  push:
    branches: [feature/llm-staff-bridge-runtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/llm-staff-bridge-runtime
      - name: Patch LLM contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config/unit_contract_registry.yaml')
          text = p.read_text(encoding='utf-8')
          replacements = {
            '''  - unit_id: LLM_STAFF\n    unit_type: llm_role\n    implementation_status: contract_only\n''':
            '''  - unit_id: LLM_STAFF\n    unit_type: llm_role\n    implementation_status: implemented_typed_runtime_contract\n''',
            '''  - unit_id: EVIDENCE_TO_ASSUMPTION_BRIDGE\n    unit_type: bridge\n    implementation_status: implemented_contract\n''':
            '''  - unit_id: EVIDENCE_TO_ASSUMPTION_BRIDGE\n    unit_type: bridge\n    implementation_status: implemented_typed_runtime_adapter\n''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'contract status not found: {old.splitlines()[0]}')
              text = text.replace(old, new, 1)
          anchor = text.index('  - unit_id: LLM_STAFF')
          tail = text[anchor:]
          old_ref = '    canonical_refs: [docs/CONTROL_PLANE_ARCHITECTURE.md, config/control_plane_stage_registry.yaml, src/valuation_engine/research.py]\n'
          new_ref = '    canonical_refs: [src/valuation_engine/llm_staff.py, src/valuation_engine/llm_adapters.py, docs/CONTROL_PLANE_ARCHITECTURE.md, config/control_plane_stage_registry.yaml, src/valuation_engine/research.py]\n'
          if old_ref not in tail:
              raise SystemExit('LLM_STAFF refs not found')
          tail = tail.replace(old_ref, new_ref, 1)
          text = text[:anchor] + tail
          anchor = text.index('  - unit_id: EVIDENCE_TO_ASSUMPTION_BRIDGE')
          tail = text[anchor:]
          old_ref = '    canonical_refs: [src/valuation_engine/records.py, src/valuation_engine/ledger.py, docs/GENERIC_ENGINE_DESIGN.md]\n'
          new_ref = '    canonical_refs: [src/valuation_engine/llm_staff.py, src/valuation_engine/llm_adapters.py, src/valuation_engine/records.py, src/valuation_engine/ledger.py, docs/GENERIC_ENGINE_DESIGN.md]\n'
          if old_ref not in tail:
              raise SystemExit('Bridge refs not found')
          tail = tail.replace(old_ref, new_ref, 1)
          p.write_text(text[:anchor] + tail, encoding='utf-8')
          PY
      - name: Commit contract sync
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/unit_contract_registry.yaml
          git commit -m 'docs: sync LLM staff runtime contract status'
          git push origin HEAD:feature/llm-staff-bridge-runtime
