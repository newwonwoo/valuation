name: patch-module-plan-contract

on:
  push:
    branches: [feature/module-requirement-plan]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/module-requirement-plan
      - name: Patch canonical Unit Contract Registry
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config/unit_contract_registry.yaml')
          text = p.read_text(encoding='utf-8')
          old = '''  - unit_id: MODULE_REQUIREMENT_PLAN\n    unit_type: controller\n    implementation_status: contract_only\n'''
          new = '''  - unit_id: MODULE_REQUIREMENT_PLAN\n    unit_type: controller\n    implementation_status: implemented\n'''
          if old not in text:
              raise SystemExit('MODULE_REQUIREMENT_PLAN contract status pattern not found')
          text = text.replace(old, new, 1)
          old_ref = '    canonical_refs: [config/archetype_module_registry.yaml, docs/INDUSTRY_DNA_ROUTER_V1.md]\n'
          new_ref = '    canonical_refs: [src/valuation_engine/module_plan.py, src/valuation_engine/shadow_adapters.py, config/archetype_module_registry.yaml, docs/INDUSTRY_DNA_ROUTER_V1.md]\n'
          if old_ref not in text:
              raise SystemExit('MODULE_REQUIREMENT_PLAN canonical_refs pattern not found')
          p.write_text(text.replace(old_ref, new_ref, 1), encoding='utf-8')
          PY
      - name: Commit contract sync
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/unit_contract_registry.yaml
          git commit -m 'docs: mark module requirement plan implemented'
          git push origin HEAD:feature/module-requirement-plan
