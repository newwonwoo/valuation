name: patch-risk-consumption-contract

on:
  push:
    branches: [feature/risk-input-enforced-valuations]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/risk-input-enforced-valuations
      - name: Patch risk-consumption implementation refs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config/unit_contract_registry.yaml')
          text = p.read_text(encoding='utf-8')
          replacements = {
            'canonical_refs: [src/valuation_engine/risk.py, docs/V04_ROCKETSLA_EXTENSION.md]':
            'canonical_refs: [src/valuation_engine/risk.py, src/valuation_engine/risk_adapters.py, src/valuation_engine/risk_impact.py, docs/V04_ROCKETSLA_EXTENSION.md]',
            'canonical_refs: [src/valuation_engine/wacc.py, docs/V04_ROCKETSLA_EXTENSION.md]':
            'canonical_refs: [src/valuation_engine/wacc.py, src/valuation_engine/risk_adapters.py, src/valuation_engine/risk_impact.py, docs/V04_ROCKETSLA_EXTENSION.md]',
            'canonical_refs: [src/valuation_engine/evaluator_registry.py, src/valuation_engine/valuation_execution.py, src/valuation_engine/valuation_adapter.py, src/valuation_engine/engine.py, docs/GENERIC_ENGINE_DESIGN.md]':
            'canonical_refs: [src/valuation_engine/evaluator_registry.py, src/valuation_engine/dcf_evaluators.py, src/valuation_engine/valuation_execution.py, src/valuation_engine/valuation_adapter.py, src/valuation_engine/risk_impact.py, src/valuation_engine/engine.py, docs/GENERIC_ENGINE_DESIGN.md]',
            'canonical_refs: [src/valuation_engine/generic_audit.py, src/valuation_engine/audit_adapter.py, src/valuation_engine/audit.py, SKILL.md]':
            'canonical_refs: [src/valuation_engine/generic_audit.py, src/valuation_engine/audit_adapter.py, src/valuation_engine/risk_impact.py, src/valuation_engine/audit.py, SKILL.md]',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'pattern not found: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit contract refs
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/unit_contract_registry.yaml
          git commit -m 'docs: map Beta and WACC consumption into valuation paths'
          git push origin HEAD:feature/risk-input-enforced-valuations
