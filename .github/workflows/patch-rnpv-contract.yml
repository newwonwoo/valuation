name: patch-rnpv-contract

on:
  push:
    branches: [feature/calibrated-rnpv-evaluator]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/calibrated-rnpv-evaluator
      - name: Patch readiness and contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config/live_primary_readiness.yaml')
          text = p.read_text(encoding='utf-8')
          old = '    reason: exact registry/SOTP runtime supports normalized multiples, same-run-WACC explicit FCFF DCF, and exact finite-life project_npv/reserve_npv/cohort_npv registrations; probability-weighted rNPV, NAV/residual-income and other archetype-specific evaluator coverage remains incomplete.\n'
          new = '    reason: exact registry/SOTP runtime supports normalized multiples, explicit FCFF DCF, finite-life project_npv/reserve_npv/cohort_npv, and certificate-bound single-event rNPV; multi-stage event trees, NAV/residual-income and other archetype-specific evaluator coverage remain incomplete.\n'
          if old not in text:
              raise SystemExit('readiness pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('config/unit_contract_registry.yaml')
          text = p.read_text(encoding='utf-8')
          old = 'src/valuation_engine/finite_life_evaluators.py, src/valuation_engine/valuation_execution.py'
          new = 'src/valuation_engine/finite_life_evaluators.py, src/valuation_engine/rnpv_evaluator.py, src/valuation_engine/valuation_execution.py'
          if old not in text:
              raise SystemExit('evaluator refs pattern not found')
          text = text.replace(old, new, 1)
          old = 'docs/GENERIC_ENGINE_DESIGN.md, docs/FINITE_LIFE_NPV_EVALUATORS.md]'
          new = 'docs/GENERIC_ENGINE_DESIGN.md, docs/FINITE_LIFE_NPV_EVALUATORS.md, docs/CALIBRATED_RNPV_EVALUATOR.md]'
          if old not in text:
              raise SystemExit('evaluator docs refs pattern not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit contract sync
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/live_primary_readiness.yaml config/unit_contract_registry.yaml
          git commit -m 'docs: record calibrated single-event rNPV coverage'
          git push origin HEAD:feature/calibrated-rnpv-evaluator
