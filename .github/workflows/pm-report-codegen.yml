name: pm-report-codegen

on:
  push:
    branches: [agent/execution-attestation-report]
    paths:
      - scripts/pm_report_codegen_v2.py
      - .github/workflows/pm-report-codegen.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply deterministic reporting patch
        run: python scripts/pm_report_codegen_v2.py
      - name: Attestation regressions
        run: pytest -q tests/test_execution_attestation.py
      - name: Compile report runtime
        run: python -m py_compile src/valuation_engine/generic_reporting.py src/valuation_engine/execution_attestation.py
      - name: Commit generated reporting integration
        run: |
          git config user.name "prism-pm-bot"
          git config user.email "prism-pm-bot@users.noreply.github.com"
          git add src/valuation_engine/generic_reporting.py
          git diff --cached --quiet && exit 0
          git commit -m "Require attested LIVE_PRIMARY report persistence"
          git push origin HEAD:agent/execution-attestation-report
