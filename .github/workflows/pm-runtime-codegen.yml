name: pm-runtime-codegen

on:
  push:
    branches: [agent/runtime-orchestration-hardening]
    paths:
      - scripts/pm_runtime_codegen.py
      - scripts/pm_runtime_testfix_codegen.py
      - .github/workflows/pm-runtime-codegen.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply deterministic integration patch
        run: |
          python scripts/pm_runtime_codegen.py
          python scripts/pm_runtime_testfix_codegen.py
      - name: Runtime and full regression
        run: pytest -q
      - name: Commit generated integration
        run: |
          git config user.name "prism-pm-bot"
          git config user.email "prism-pm-bot@users.noreply.github.com"
          git add config/archetype_module_registry.yaml \
            src/valuation_engine/capacity_consumption.py \
            src/valuation_engine/live_runtime.py \
            src/valuation_engine/generic_audit.py \
            src/valuation_engine/audit_adapter.py \
            tests/test_live_runtime_assembly.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire capacity obligations through LIVE_PRIMARY"
          git push origin HEAD:agent/runtime-orchestration-hardening
