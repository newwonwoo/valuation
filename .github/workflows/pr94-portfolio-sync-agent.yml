name: pr94-portfolio-sync-agent

on:
  push:
    branches:
      - feat/sanil-live-primary
    paths:
      - scripts/apply_pr94_portfolio_sync.py
      - .github/workflows/pr94-portfolio-sync-agent.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sanil-live-primary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Synchronize portfolio
        run: |
          python scripts/apply_pr94_portfolio_sync.py
          PYTHONPATH=src python scripts/render_project_status.py --write
      - name: Validate PM contract
        run: |
          PYTHONPATH=src python scripts/validate_project_portfolio.py
          PYTHONPATH=src python scripts/render_project_status.py --check
      - name: Full regression
        run: pytest -q
      - name: Remove bootstrap files
        run: >-
          git rm
          .github/workflows/pr94-portfolio-sync-agent.yml
          scripts/apply_pr94_portfolio_sync.py
      - name: Commit synchronized PM state
        run: |
          git config user.name "prism-pm-sync-agent"
          git config user.email "prism-pm-sync-agent@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize merged context-strength milestone state"
          git push origin HEAD:feat/sanil-live-primary
