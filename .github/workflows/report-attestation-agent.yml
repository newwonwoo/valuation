name: report-attestation-agent

on:
  push:
    branches:
      - fix/capacity-live-primary-e2e

permissions:
  contents: write

jobs:
  attest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/capacity-live-primary-e2e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Add execution attestation
        run: python scripts/apply_report_execution_attestation.py
      - name: Regenerate report template
        run: PYTHONPATH=src python scripts/render_verified_report_form.py
      - name: Regenerate actual LIVE_PRIMARY report
        env:
          PRISM_REPORT_EXPORT_PATH: examples/report_forms/PRISM_ACTUAL_RUNTIME_REPORT.md
        run: pytest -q tests/test_full_live_primary_runtime.py
      - name: Report regressions
        run: pytest -q tests/test_report_form.py tests/test_capacity_runtime_integrity.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Remove bootstrap files
        run: git rm .github/workflows/report-attestation-agent.yml scripts/apply_report_execution_attestation.py
      - name: Commit attested reports
        run: |
          git config user.name "report-attestation-agent"
          git config user.email "report-attestation-agent@users.noreply.github.com"
          git add -A
          git commit -m "Require execution proof before report verification [report-agent]"
          git push origin HEAD:fix/capacity-live-primary-e2e
