name: sanil-context-linkage-agent

on:
  push:
    branches:
      - feat/sanil-live-primary
    paths:
      - scripts/apply_sanil_context_strength_linkage.py
      - .github/workflows/sanil-context-linkage-agent.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sanil-live-primary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Add auditable Sanil linkage decision
        run: python scripts/apply_sanil_context_strength_linkage.py
      - name: Sanil integration regression
        run: pytest -q tests/test_sanil_live_primary.py
      - name: Full regression
        run: pytest -q
      - name: Remove bootstrap files
        run: >-
          git rm
          .github/workflows/sanil-context-linkage-agent.yml
          scripts/apply_sanil_context_strength_linkage.py
      - name: Commit verified linkage integration
        run: |
          git config user.name "sanil-linkage-agent"
          git config user.email "sanil-linkage-agent@users.noreply.github.com"
          git add -A
          git commit -m "Connect Sanil power bottleneck to pre-invested capacity"
          git push origin HEAD:feat/sanil-live-primary
