name: sanil-finalization-agent

on:
  push:
    branches:
      - feat/sanil-live-primary
    paths:
      - scripts/finalize_sanil_live_primary.py
      - .github/workflows/sanil-finalization-agent.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sanil-live-primary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply final integration fixes
        run: python scripts/finalize_sanil_live_primary.py
      - name: Generate actual Sanil report
        run: >-
          PYTHONPATH=src
          python scripts/run_sanil_live_primary.py
          --output examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md
      - name: Focused regressions
        run: >-
          pytest -q
          tests/test_sanil_live_primary.py
          tests/test_module_plan_evidence_extension.py
          tests/test_evidence_source_layer_contract.py
          tests/test_dcf_evaluators.py
          tests/test_live_runtime_assembly.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Installed-wheel resources
        run: |
          rm -rf /tmp/valuation-wheelhouse /tmp/valuation-wheel-venv
          python -m pip wheel . --no-deps -w /tmp/valuation-wheelhouse
          python -m venv /tmp/valuation-wheel-venv
          /tmp/valuation-wheel-venv/bin/python -m pip install /tmp/valuation-wheelhouse/*.whl
          (cd /tmp && /tmp/valuation-wheel-venv/bin/python "$GITHUB_WORKSPACE/scripts/validate_installed_wheel.py")
      - name: Remove bootstrap agent files
        run: >-
          git rm
          .github/workflows/sanil-finalization-agent.yml
          scripts/finalize_sanil_live_primary.py
      - name: Commit verified final integration
        run: |
          git config user.name "sanil-finalization-agent"
          git config user.email "sanil-finalization-agent@users.noreply.github.com"
          git add -A
          git commit -m "Complete Sanil LIVE_PRIMARY providers and verified report"
          git push origin HEAD:feat/sanil-live-primary
