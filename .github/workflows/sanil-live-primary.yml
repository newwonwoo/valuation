name: sanil-live-primary

on:
  push:
    branches: [main]
    paths:
      - 'src/valuation_engine/**'
      - 'config/**'
      - 'data/**'
      - 'docs/SANIL_RISK_SOURCE_REGISTER.md'
      - 'scripts/refresh_sanil_krx_beta.py'
      - 'scripts/run_sanil_live_primary.py'
      - 'scripts/validate_broker_research_layer.py'
      - 'scripts/validate_workflow_source_injection.py'
      - 'tests/test_broker_runtime.py'
      - 'tests/test_sanil_live_primary.py'
      - 'tests/test_incremental_capacity_dcf.py'
      - 'tests/test_module_plan_evidence_extension.py'
      - 'tests/test_evidence_source_layer_contract.py'
      - 'tests/test_primary_evidence_collection.py'
      - 'tests/test_report_form.py'
      - 'examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.html'
      - 'examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md'
      - 'examples/report_forms/SANIL_062040_20260827_TP*.html'
      - 'examples/report_forms/SANIL_062040_20260827_TP*.md'
      - 'examples/report_forms/SANIL_062040_LATEST_REPORT.json'
      - 'examples/report_forms/PRISM_VERIFIED_REPORT_FORM.md'
      - 'pyproject.toml'
      - '.github/workflows/sanil-live-primary.yml'
  pull_request:
    paths:
      - 'src/valuation_engine/**'
      - 'config/**'
      - 'data/**'
      - 'docs/SANIL_RISK_SOURCE_REGISTER.md'
      - 'scripts/refresh_sanil_krx_beta.py'
      - 'scripts/run_sanil_live_primary.py'
      - 'scripts/validate_broker_research_layer.py'
      - 'scripts/validate_workflow_source_injection.py'
      - 'tests/test_broker_runtime.py'
      - 'tests/test_sanil_live_primary.py'
      - 'tests/test_incremental_capacity_dcf.py'
      - 'tests/test_module_plan_evidence_extension.py'
      - 'tests/test_evidence_source_layer_contract.py'
      - 'tests/test_primary_evidence_collection.py'
      - 'tests/test_report_form.py'
      - 'examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.html'
      - 'examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md'
      - 'examples/report_forms/SANIL_062040_20260827_TP*.html'
      - 'examples/report_forms/SANIL_062040_20260827_TP*.md'
      - 'examples/report_forms/SANIL_062040_LATEST_REPORT.json'
      - 'examples/report_forms/PRISM_VERIFIED_REPORT_FORM.md'
      - 'pyproject.toml'
      - '.github/workflows/sanil-live-primary.yml'
  workflow_dispatch:

jobs:
  sanil-live-primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Execute Sanil LIVE_PRIMARY
        run: >-
          PYTHONPATH=src
          python scripts/run_sanil_live_primary.py
          --output /tmp/SANIL_062040_LIVE_PRIMARY_REPORT.html
          --markdown-output /tmp/SANIL_062040_LIVE_PRIMARY_REPORT.md
      - name: Upload verified Sanil report
        uses: actions/upload-artifact@v4
        with:
          name: SANIL_062040_LIVE_PRIMARY_REPORT
          path: |
            /tmp/SANIL_062040_LIVE_PRIMARY_REPORT.html
            /tmp/SANIL_062040_LIVE_PRIMARY_REPORT.md
            /tmp/SANIL_062040_20260827_TP*.html
            /tmp/SANIL_062040_20260827_TP*.md
            /tmp/SANIL_062040_LATEST_REPORT.json
            /tmp/PRISM_062040_*_*.svg
      - name: Verify tracked Sanil LIVE_PRIMARY report
        run: |
          cmp \
            /tmp/SANIL_062040_LIVE_PRIMARY_REPORT.html \
            examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.html
          cmp \
            /tmp/SANIL_062040_LIVE_PRIMARY_REPORT.md \
            examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md
          PYTHONPATH=src python scripts/run_sanil_live_primary.py --check
      - name: Sanil integration regressions
        run: >-
          pytest -q
          tests/test_broker_runtime.py
          tests/test_sanil_live_primary.py
          tests/test_incremental_capacity_dcf.py
          tests/test_report_form.py
      - name: Broker layer validations
        run: |
          PYTHONPATH=src python scripts/validate_broker_research_layer.py
          PYTHONPATH=src python scripts/validate_workflow_source_injection.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
