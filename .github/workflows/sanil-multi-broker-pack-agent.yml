name: sanil-multi-broker-pack-agent

on:
  push:
    branches:
      - fix/sanil-multi-broker-pack

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sanil-multi-broker-pack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply multi-broker pack
        run: python scripts/apply_sanil_multi_broker_pack.py
      - name: Broker and Sanil focused regressions
        run: >-
          pytest -q
          tests/test_broker_research.py
          tests/test_broker_runtime.py
          tests/test_sanil_live_primary.py
          tests/test_full_live_primary_runtime.py
          tests/test_report_form.py
      - name: Broker policy validators
        run: |
          python scripts/validate_broker_research_layer.py
          python scripts/validate_workflow_source_injection.py
      - name: Regenerate actual Sanil report
        run: >-
          PYTHONPATH=src python scripts/run_sanil_live_primary.py
          --output examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Remove one-time agent
        run: git rm .github/workflows/sanil-multi-broker-pack-agent.yml scripts/apply_sanil_multi_broker_pack.py
      - name: Commit verified multi-broker pack
        run: |
          git config user.name "sanil-broker-agent"
          git config user.email "sanil-broker-agent@users.noreply.github.com"
          git add -A
          git commit -m "Broaden Sanil Broker Research to three firms [broker-agent]"
          git push origin HEAD:fix/sanil-multi-broker-pack
