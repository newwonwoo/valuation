name: sanil-multi-broker-report-sync

on:
  push:
    branches:
      - fix/sanil-multi-broker-pack

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sanil-multi-broker-pack
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Regenerate Sanil report
        run: >-
          PYTHONPATH=src python scripts/run_sanil_live_primary.py
          --output examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md
      - name: Verify report and Broker runtime
        run: |
          PYTHONPATH=src python scripts/run_sanil_live_primary.py --check
          pytest -q tests/test_sanil_live_primary.py tests/test_broker_runtime.py tests/test_report_form.py
      - name: Remove one-time workflow
        run: git rm .github/workflows/sanil-multi-broker-report-sync.yml
      - name: Commit synchronized report
        run: |
          git config user.name "sanil-report-agent"
          git config user.email "sanil-report-agent@users.noreply.github.com"
          git add -A
          git commit -m "Expose all Sanil Street sources in verified report [report-agent]"
          git push origin HEAD:fix/sanil-multi-broker-pack
