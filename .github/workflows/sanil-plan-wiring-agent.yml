name: sanil-plan-wiring-agent

on:
  push:
    branches:
      - feat/sanil-live-primary
    paths:
      - scripts/apply_live_plan_evidence_extension.py
      - .github/workflows/sanil-plan-wiring-agent.yml

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sanil-live-primary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply typed Evidence-plan wiring
        run: python scripts/apply_live_plan_evidence_extension.py
      - name: Focused regressions
        run: >-
          pytest -q
          tests/test_module_plan_evidence_extension.py
          tests/test_sanil_live_primary.py
          tests/test_live_runtime_assembly.py
      - name: Full regression
        run: pytest -q
      - name: Remove bootstrap files
        run: >-
          git rm
          .github/workflows/sanil-plan-wiring-agent.yml
          scripts/apply_live_plan_evidence_extension.py
      - name: Commit verified wiring
        run: |
          git config user.name "sanil-plan-agent"
          git config user.email "sanil-plan-agent@users.noreply.github.com"
          git add -A
          git commit -m "Authorize Sanil model and risk Evidence through the Module Plan"
          git push origin HEAD:feat/sanil-live-primary
