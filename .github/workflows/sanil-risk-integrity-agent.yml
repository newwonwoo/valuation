name: sanil-risk-integrity-agent

on:
  push:
    branches:
      - feat/sanil-live-primary
    paths:
      - scripts/apply_sanil_risk_integrity.py
      - config/sanil_live_snapshot.yaml
      - docs/SANIL_RISK_SOURCE_REGISTER.md
      - .github/workflows/sanil-risk-integrity-agent.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sanil-live-primary
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Apply risk-source integrity patch
        run: python scripts/apply_sanil_risk_integrity.py
      - name: Sanil integration regression
        run: pytest -q tests/test_sanil_live_primary.py
      - name: Full regression
        run: pytest -q
      - name: Remove bootstrap files
        run: >-
          git rm
          .github/workflows/sanil-risk-integrity-agent.yml
          scripts/apply_sanil_risk_integrity.py
      - name: Commit verified real-peer risk wiring
        run: |
          git config user.name "sanil-risk-agent"
          git config user.email "sanil-risk-agent@users.noreply.github.com"
          git add -A
          git commit -m "Use sourced real-company Beta observations for Sanil"
          git push origin HEAD:feat/sanil-live-primary
