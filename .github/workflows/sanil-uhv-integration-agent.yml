name: sanil-uhv-integration-agent

on:
  push:
    branches: [fix/sanil-provider-integrity-v2]
    paths:
      - 'scripts/apply_sanil_uhv_capacity.py'
      - 'src/valuation_engine/dcf_evaluators.py'
      - 'tests/test_incremental_capacity_dcf.py'
      - '.github/workflows/sanil-uhv-integration-agent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sanil-provider-integrity-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-refresh dependencies
        run: python -m pip install finance-datareader pandas numpy PyYAML
      - name: Apply UHV property capacity integration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_sanil_uhv_capacity.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if count != 1:', 'if count < 1:', 1)
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/apply_sanil_uhv_capacity.py
      - name: Install repository
        run: python -m pip install -e '.[dev]'
      - name: Focused valuation and Sanil regressions
        run: >-
          pytest -q
          tests/test_explicit_fcff_dcf_evaluators.py
          tests/test_incremental_capacity_dcf.py
          tests/test_capacity_commitment_gate.py
          tests/test_capacity_consumption.py
          tests/test_capacity_runtime.py
          tests/test_sanil_live_primary.py
      - name: Generate verified Sanil report
        run: PYTHONPATH=src python scripts/run_sanil_live_primary.py
      - name: Full regression
        run: pytest -q
      - name: OCI regression
        run: valuation-engine examples/oci/company.yaml
      - name: Commit integrated source-backed run
        run: |
          git config user.name "sanil-live-primary-agent"
          git config user.email "sanil-live-primary-agent@users.noreply.github.com"
          git add \
            config/sanil_live_snapshot.yaml \
            config/sanil_market_snapshot.yaml \
            docs/SANIL_RISK_SOURCE_REGISTER.md \
            scripts/refresh_sanil_krx_beta.py \
            scripts/run_sanil_live_primary.py \
            src/valuation_engine/sanil_live_primary.py \
            tests/test_sanil_live_primary.py \
            examples/report_forms/SANIL_062040_LIVE_PRIMARY_REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "Integrate signed UHV property capacity into Sanil Core"
          git push origin HEAD:fix/sanil-provider-integrity-v2
