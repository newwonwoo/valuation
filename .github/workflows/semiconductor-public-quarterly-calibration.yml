name: semiconductor-public-quarterly-calibration

on:
  push:
    branches:
      - work/semiconductor-large-sample-calibration-20260828
    paths:
      - scripts/calibration_chunks/stockanalysis_regime_*.part
      - .github/workflows/semiconductor-public-quarterly-calibration.yml
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests lxml scikit-learn
      - name: Assemble runner
        run: |
          cat scripts/calibration_chunks/stockanalysis_regime_*.part > scripts/run_semiconductor_public_quarterly_calibration.py
          python -m py_compile scripts/run_semiconductor_public_quarterly_calibration.py
      - name: Run historical regime calibration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/calibration
          python scripts/run_semiconductor_public_quarterly_calibration.py 2>&1 | tee artifacts/calibration/public_quarterly_run.log
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: semiconductor-public-quarterly-calibration
          path: artifacts/calibration/
          if-no-files-found: error
