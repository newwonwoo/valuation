name: skhynix-calibration-data-diagnostic

on:
  push:
    branches:
      - work/skhynix-calibration-redo-20260828
    paths:
      - scripts/diagnose_skhynix_calibration_data.py
      - .github/workflows/skhynix-calibration-data-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check pandas pykrx

      - name: Inspect public DART cache and historical KRX index members
        run: python scripts/diagnose_skhynix_calibration_data.py

      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skhynix-calibration-data-diagnostic
          path: artifacts/skhynix_calibration_diagnostic
          if-no-files-found: error
          retention-days: 7
