name: skhynix-calibration-data-diagnostic

on:
  push:
    branches:
      - work/skhynix-calibration-redo-20260828
    paths:
      - scripts/diagnose_skhynix_calibration_data.py
      - scripts/collect_krx_semiconductor_cohort.py
      - scripts/inspect_samsungfund_kodex_pdf.py
      - scripts/collect_kodex_semiconductor_cohort.py
      - .github/workflows/skhynix-calibration-data-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check pandas pykrx requests

      - name: Inspect public DART cache
        run: python scripts/diagnose_skhynix_calibration_data.py

      - name: Inspect KODEX historical PDF endpoints
        run: python scripts/inspect_samsungfund_kodex_pdf.py

      - name: Reconstruct point-in-time semiconductor cohort from KODEX PDF
        run: python scripts/collect_kodex_semiconductor_cohort.py

      - name: Probe direct KRX historical constituents
        continue-on-error: true
        run: python scripts/collect_krx_semiconductor_cohort.py

      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skhynix-calibration-data-diagnostic
          path: |
            artifacts/skhynix_calibration_diagnostic
            artifacts/skhynix_calibration_cohort
            artifacts/kodex_pdf_diagnostic
            artifacts/kodex_semiconductor_cohort
          if-no-files-found: error
          retention-days: 7
