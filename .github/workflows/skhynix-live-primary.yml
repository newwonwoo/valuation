name: skhynix-live-primary

on:
  push:
    branches: [main, feat/skhynix-canonical-live-20260829, feat/skhynix-continuous-probability-20260829]
    paths:
      - 'config/skhynix_live_snapshot.yaml'
      - 'config/skhynix_continuous_calibration_artifact.json'
      - 'config/skhynix_continuous_calibration_provenance.json'
      - 'src/valuation_engine/skhynix_live_primary.py'
      - 'src/valuation_engine/skhynix_continuous_live_primary.py'
      - 'src/valuation_engine/skhynix_continuous_probability.py'
      - 'src/valuation_engine/skhynix_public_report.py'
      - 'src/valuation_engine/skhynix_brokerage_html.py'
      - 'src/valuation_engine/continuous_probability_snapshot.py'
      - 'src/valuation_engine/probability_adapter.py'
      - 'src/valuation_engine/scenario_binding.py'
      - 'src/valuation_engine/shadow_adapters.py'
      - 'src/valuation_engine/street.py'
      - 'scripts/run_skhynix_live_primary.py'
      - 'tests/test_skhynix_live_primary.py'
      - 'tests/test_skhynix_public_report.py'
      - 'src/valuation_engine/strict_live_runtime.py'
      - 'src/valuation_engine/live_runtime.py'
      - 'src/valuation_engine/assumption_compiler.py'
      - 'src/valuation_engine/valuation_execution.py'
      - 'src/valuation_engine/generic_audit.py'
      - 'examples/report_forms/SKHYNIX_000660_*'
      - 'examples/report_forms/PRISM_000660_*'
      - 'pyproject.toml'
      - '.github/workflows/skhynix-live-primary.yml'
  pull_request:
    paths:
      - 'config/skhynix_live_snapshot.yaml'
      - 'config/skhynix_continuous_calibration_artifact.json'
      - 'config/skhynix_continuous_calibration_provenance.json'
      - 'src/valuation_engine/skhynix_live_primary.py'
      - 'src/valuation_engine/skhynix_continuous_live_primary.py'
      - 'src/valuation_engine/skhynix_continuous_probability.py'
      - 'src/valuation_engine/skhynix_public_report.py'
      - 'src/valuation_engine/skhynix_brokerage_html.py'
      - 'src/valuation_engine/continuous_probability_snapshot.py'
      - 'src/valuation_engine/probability_adapter.py'
      - 'src/valuation_engine/scenario_binding.py'
      - 'src/valuation_engine/shadow_adapters.py'
      - 'src/valuation_engine/street.py'
      - 'scripts/run_skhynix_live_primary.py'
      - 'tests/test_skhynix_live_primary.py'
      - 'tests/test_skhynix_public_report.py'
      - 'src/valuation_engine/strict_live_runtime.py'
      - 'src/valuation_engine/live_runtime.py'
      - 'src/valuation_engine/assumption_compiler.py'
      - 'src/valuation_engine/valuation_execution.py'
      - 'src/valuation_engine/generic_audit.py'
      - 'examples/report_forms/SKHYNIX_000660_*'
      - 'examples/report_forms/PRISM_000660_*'
      - 'pyproject.toml'
      - '.github/workflows/skhynix-live-primary.yml'
  workflow_dispatch:

jobs:
  skhynix-live-primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify tracked Korean HTML report bundle
        run: PYTHONPATH=src python scripts/run_skhynix_live_primary.py --check
      - name: Verify immutable report bundle
        run: |
          test -f examples/report_forms/SKHYNIX_000660_LIVE_PRIMARY_REPORT.html
          test -f examples/report_forms/SKHYNIX_000660_LIVE_PRIMARY_REPORT.md
          test -f examples/report_forms/SKHYNIX_000660_LATEST_REPORT.json
          test "$(find examples/report_forms -maxdepth 1 -name 'SKHYNIX_000660_20260828_TP*.html' | wc -l)" -eq 1
          test "$(find examples/report_forms -maxdepth 1 -name 'SKHYNIX_000660_20260828_TP*.md' | wc -l)" -eq 1
          test "$(find examples/report_forms -maxdepth 1 -name 'PRISM_000660_*.svg' | wc -l)" -eq 4
      - name: Upload canonical report
        uses: actions/upload-artifact@v4
        with:
          name: SKHYNIX_000660_LIVE_PRIMARY_${{ github.sha }}
          path: |
            examples/report_forms/SKHYNIX_000660_LIVE_PRIMARY_REPORT.html
            examples/report_forms/SKHYNIX_000660_LIVE_PRIMARY_REPORT.md
            examples/report_forms/SKHYNIX_000660_20260828_TP*.html
            examples/report_forms/SKHYNIX_000660_20260828_TP*.md
            examples/report_forms/SKHYNIX_000660_LATEST_REPORT.json
            examples/report_forms/PRISM_000660_*.svg
      - name: SK hynix canonical regressions
        run: >-
          pytest -q
          tests/test_skhynix_live_primary.py
          tests/test_skhynix_public_report.py
      - name: Full regression
        run: pytest -q
