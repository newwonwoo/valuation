name: valuation-tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Harvest exact Korea Zinc H1 public DART sections
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          import json, re

          rcp = '20260814003958'
          dcm = '11539212'
          base_headers = {
              'User-Agent': 'Mozilla/5.0 PRISM research runner',
              'Accept-Language': 'ko-KR,ko;q=0.9,en;q=0.8',
              'Referer': f'https://dart.fss.or.kr/dsaf001/main.do?rcpNo={rcp}',
          }
          def fetch(url):
              req = Request(url, headers=base_headers)
              with urlopen(req, timeout=40) as resp:
                  return resp.read()

          out = Path('/tmp/koreazinc_dart')
          out.mkdir(parents=True, exist_ok=True)
          main_url = f'https://dart.fss.or.kr/dsaf001/main.do?rcpNo={rcp}'
          raw = fetch(main_url)
          text = raw.decode('utf-8', errors='replace')
          (out / 'main.html').write_bytes(raw)

          lines = text.splitlines()
          nodes = []
          current = None
          for line in lines:
              m = re.search(r"(node\d+)\['text'\]\s*=\s*\"(.*?)\";", line)
              if m:
                  if current and current.get('text'):
                      nodes.append(current)
                  current = {'node': m.group(1), 'text': m.group(2)}
                  continue
              if current:
                  for key in ('id','rcpNo','dcmNo','eleId','offset','length','dtd','tocNo','atocId'):
                      m = re.search(rf"\['{key}'\]\s*=\s*\"?([^\";]+)\"?;", line)
                      if m:
                          current[key] = m.group(1).strip().strip('"')
                          break
          if current and current.get('text'):
              nodes.append(current)

          wanted_ids = {'9','11','12','13','18','19','20','21','23','24','58','66'}
          selected = [n for n in nodes if n.get('id') in wanted_ids]
          receipts = []
          for node in selected:
              params = {
                  'rcpNo': node['rcpNo'],
                  'dcmNo': node['dcmNo'],
                  'eleId': node['eleId'],
                  'offset': node['offset'],
                  'length': node['length'],
                  'dtd': node.get('dtd','dart4.xsd'),
              }
              url = 'https://dart.fss.or.kr/report/viewer.do?' + urlencode(params)
              body = fetch(url)
              path = out / f"{rcp}_{node['eleId']}.html"
              path.write_bytes(body)
              receipts.append({**node, 'url': url, 'bytes': len(body), 'filename': path.name})
              print(node['id'], node['text'], len(body))
          (out / 'sections.json').write_text(json.dumps(receipts, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Upload exact public DART sections
        uses: actions/upload-artifact@v4
        with:
          name: KOREAZINC_010130_DART_H1_SECTIONS
          path: /tmp/koreazinc_dart/
          if-no-files-found: error
