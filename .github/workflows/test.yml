name: valuation-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit contract registry
        run: PYTHONPATH=src python scripts/validate_unit_contract_registry.py
      - name: Module requirement plans
        run: PYTHONPATH=src python scripts/validate_module_requirement_plans.py
      - name: LIVE_PRIMARY readiness registry
        run: PYTHONPATH=src python scripts/validate_live_primary_readiness.py
      - name: Tests
        run: pytest -q
      - name: OCI regression output
        run: valuation-engine examples/oci/company.yaml
