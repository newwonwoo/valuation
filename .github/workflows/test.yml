name: valuation-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit contract registry
        run: PYTHONPATH=src python scripts/validate_unit_contract_registry.py
      - name: Module registries and method capabilities
        run: PYTHONPATH=src python scripts/validate_module_registries.py
      - name: Module requirement plans
        run: PYTHONPATH=src python scripts/validate_module_requirement_plans.py
      - name: LIVE_PRIMARY readiness registry
        run: PYTHONPATH=src python scripts/validate_live_primary_readiness.py
      - name: Validate stage capability receipts
        run: PYTHONPATH=src python scripts/validate_stage_capability.py
      - name: Probability calibration policy
        run: PYTHONPATH=src python scripts/validate_probability_calibration_policy.py
      - name: Hierarchical calibration registry
        run: PYTHONPATH=src python scripts/validate_calibration_hierarchy.py
      - name: Probability engine v3 policy
        run: PYTHONPATH=src python scripts/validate_probability_engine_v3_policy.py
      - name: Execution authority policy
        run: PYTHONPATH=src python scripts/validate_execution_authority_policy.py
      - name: Semiconductor calibration migration seed
        run: PYTHONPATH=src python scripts/validate_semiconductor_calibration_seed.py
      - name: PM project portfolio integrity
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: PYTHONPATH=src python scripts/validate_project_portfolio.py --github
      - name: PM project status sync
        run: PYTHONPATH=src python scripts/render_project_status.py --check
      - name: Canonical runtime performance budget
        run: PYTHONPATH=src python scripts/check_runtime_performance_budget.py
      - name: Tests
        run: pytest -q
      - name: OCI regression output
        run: valuation-engine examples/oci/company.yaml
      - name: Installed wheel runtime resources
        run: |
          rm -rf /tmp/valuation-wheelhouse /tmp/valuation-wheel-venv
          python -m pip wheel . --no-deps -w /tmp/valuation-wheelhouse
          python -m venv /tmp/valuation-wheel-venv
          /tmp/valuation-wheel-venv/bin/python -m pip install /tmp/valuation-wheelhouse/*.whl
          (cd /tmp && /tmp/valuation-wheel-venv/bin/python "$GITHUB_WORKSPACE/scripts/validate_installed_wheel.py")
          (cd /tmp && /tmp/valuation-wheel-venv/bin/valuation-engine --help >/dev/null)
          (cd /tmp && /tmp/valuation-wheel-venv/bin/prism-tunnel --help >/dev/null)

  patch-final-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compare-runs-variance-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Patch underwriting header comparison
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/compare_runs.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'def _underwriting_payload(run_dir: Path) -> dict:\n    return _load_yaml_mapping(run_dir / "declarations" / "underwriting.yaml")\n\n\ndef _flatten_underwriting(payload: Mapping) -> dict[str, dict]:\n',
                  'def _underwriting_payload(run_dir: Path) -> dict:\n    return _load_yaml_mapping(run_dir / "declarations" / "underwriting.yaml")\n\n\ndef _underwriting_header_contract(run_dir: Path) -> dict:\n    payload = _underwriting_payload(run_dir)\n    return {\n        "target_id": str(payload.get("target_id") or ""),\n        "as_of": str(payload.get("as_of") or ""),\n    }\n\n\ndef _flatten_underwriting(payload: Mapping) -> dict[str, dict]:\n',
              ),
              (
                  '        "raw_source_hash": _tree_digest(run_dir / "raw"),\n        "underwriting_contract": _underwriting_contract(run_dir),\n',
                  '        "raw_source_hash": _tree_digest(run_dir / "raw"),\n        "underwriting_header_contract": _underwriting_header_contract(run_dir),\n        "underwriting_contract": _underwriting_contract(run_dir),\n',
              ),
              (
                  '        "raw_source_hash": "PRIMARY_SOURCE_SNAPSHOT_MISMATCH",\n        "underwriting_contract": "UNDERWRITING_CONTRACT_MISMATCH",\n',
                  '        "raw_source_hash": "PRIMARY_SOURCE_SNAPSHOT_MISMATCH",\n        "underwriting_header_contract": "UNDERWRITING_HEADER_CONTRACT_MISMATCH",\n        "underwriting_contract": "UNDERWRITING_CONTRACT_MISMATCH",\n',
              ),
              (
                  'def _declaration_differences(run_a: Path, run_b: Path) -> list[dict]:\n    a = _flatten_underwriting(_underwriting_payload(run_a))\n    b = _flatten_underwriting(_underwriting_payload(run_b))\n    if set(a) != set(b):\n        raise RunComparisonError("underwriting contract changed after structural validation")\n    differences = []\n    for identity in sorted(a):\n',
                  'def _declaration_differences(run_a: Path, run_b: Path) -> list[dict]:\n    payload_a = _underwriting_payload(run_a)\n    payload_b = _underwriting_payload(run_b)\n    a = _flatten_underwriting(payload_a)\n    b = _flatten_underwriting(payload_b)\n    if set(a) != set(b):\n        raise RunComparisonError("underwriting contract changed after structural validation")\n    differences = []\n    source_a = str(payload_a.get("source_ref") or "")\n    source_b = str(payload_b.get("source_ref") or "")\n    if source_a != source_b:\n        differences.append(\n            {\n                "identity": "__underwriting_header__.source_ref",\n                "metric": "__underwriting_header__",\n                "segment": "header",\n                "multi": False,\n                "header_field": "source_ref",\n                "a_value": source_a,\n                "b_value": source_b,\n                "unit": "provenance_ref",\n                "metadata_only": True,\n            }\n        )\n    for identity in sorted(a):\n',
              ),
              (
                  'def _replace_underwriting_row(payload: dict, difference: Mapping) -> None:\n    declarations = payload.get("declarations")\n',
                  'def _replace_underwriting_row(payload: dict, difference: Mapping) -> None:\n    header_field = difference.get("header_field")\n    if header_field:\n        payload[str(header_field)] = deepcopy(difference.get("b_value"))\n        return\n    declarations = payload.get("declarations")\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'patch anchor not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Focused regressions
        run: pytest -q tests/test_compare_runs.py tests/test_compare_runs_review_regressions.py tests/test_compare_runs_underwriting_header.py
      - name: Full regression
        run: pytest -q
      - name: PM validation
        run: PYTHONPATH=src python scripts/validate_project_portfolio.py
      - name: Commit clean fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout origin/main -- .github/workflows/test.yml
          git add scripts/compare_runs.py tests/test_compare_runs_underwriting_header.py .github/workflows/test.yml
          git diff --cached --check
          git commit -m 'Track underwriting header provenance in run comparison'
          git push origin HEAD:feat/compare-runs-variance-gate
