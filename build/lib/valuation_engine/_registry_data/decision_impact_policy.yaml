version: 1.0
principle: Research must justify its place through an auditable path to value, timing, route, method, status, conclusion, or guardrail protection.
counterfactual_policy:
  baseline: canonical_run_with_module
  comparison: neutralize_one_module_or_gate_at_a_time
  current_price_or_target_price_may_not_tune_counterfactual: true
  same_evidence_snapshot_preferred: true
impact_dimensions:
  - value
  - timing
  - route
  - method
  - assumption
  - conclusion
  - status
  - guardrail
materiality:
  value_delta_pct: 0.01
  timing_delta_days: 30
research_intensity:
  min_applicable_observations_for_downrank: 6
  always_material_rate: 0.50
  high_effort_documents_per_run: 2.0
  mandatory_guardrails_never_retire_from_low_numeric_impact: true
active_module_trace:
  require_one_of:
    - affected_assumptions
    - affected_decisions
    - economic_path_ids
    - final_output_refs
    - guardrail_only
  silent_context_only_research_forbidden: true
sensitivity_methods:
  evidence_or_scanner:
    preferred: [ablation, numeric_perturbation, timing_shift]
  routing_module:
    preferred: [route_counterfactual, ablation]
  gate:
    preferred: [gate_counterfactual]
  numeric_driver:
    preferred: [numeric_perturbation]
adaptive_deployment:
  always: repeated material impact
  conditional: intermittent material impact
  sample_only: insufficient history or cheap low-impact context
  retire_candidate: repeated applicable zero-material-impact plus high research effort
  keep_guardrail: mandatory guardrail regardless ordinary numeric delta
