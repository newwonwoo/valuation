version: 1.0
principle: Industry DNA determines the minimum research loadout. LLM may propose reinforcement but may not remove mandatory units.
common_units:
  - SOURCE_FRESHNESS_PRECHECK
  - KNOWLEDGE_PLACEMENT_GATE
  - EVIDENCE_LEDGER
  - BLIND_RED_TEAM_B
  - CROSS_METHOD_DOUBLE_COUNT_AUDIT
  - AUDIT_GATE
  - INTRINSIC_FREEZE

archetype_scanners:
  contracted_backlog:
    interaction_group: demand_visibility
    scanners:
      - {scanner_id: BACKLOG_QUALITY, mandatory: true}
      - {scanner_id: CUSTOMER_ADVANCE, mandatory: true}
      - {scanner_id: LEAD_TIME_SLOT, mandatory: true}
      - {scanner_id: CANCELLATION_TERMS, mandatory: true}
    kill_conditions:
      - backlog fails to convert within the evidenced recognition window
      - cancellation or contract-liability deterioration breaks demand visibility
  capacity_manufacturing:
    interaction_group: capacity_execution
    scanners:
      - {scanner_id: CAPACITY_UTILIZATION, mandatory: true}
      - {scanner_id: YIELD_RAMP, mandatory: true}
      - {scanner_id: CAPEX_FUNDING, mandatory: true}
      - {scanner_id: QUALIFICATION, mandatory: false}
    kill_conditions:
      - effective capacity or qualification lags the modeled ramp
      - utilization or yield fails to support the margin path
  recurring_subscription:
    interaction_group: retention_economics
    scanners:
      - {scanner_id: RETENTION_CHURN, mandatory: true}
      - {scanner_id: RPO_CONVERSION, mandatory: true}
      - {scanner_id: SALES_EFFICIENCY, mandatory: true}
    kill_conditions:
      - retention and monetization deteriorate below the modeled cohort path
  transaction_marketplace:
    interaction_group: market_network
    scanners:
      - {scanner_id: GMV_TAKE_RATE, mandatory: true}
      - {scanner_id: NETWORK_DENSITY, mandatory: true}
      - {scanner_id: CONTRIBUTION_MARGIN, mandatory: true}
    kill_conditions:
      - transaction frequency or contribution margin breaks the network thesis
  commodity_price_taker:
    interaction_group: cycle_normalization
    scanners:
      - {scanner_id: MID_CYCLE_PRICE, mandatory: true}
      - {scanner_id: COST_CURVE_SUPPLY, mandatory: true}
      - {scanner_id: INVENTORY_UTILIZATION, mandatory: true}
    kill_conditions:
      - realized price or supply response invalidates the mid-cycle deck
  process_spread:
    interaction_group: cycle_normalization
    scanners:
      - {scanner_id: FEEDSTOCK_SPREAD, mandatory: true}
      - {scanner_id: MID_CYCLE_PRICE, mandatory: true}
      - {scanner_id: CAPACITY_UTILIZATION, mandatory: true}
    kill_conditions:
      - feedstock-product spread normalizes below the modeled range
  regulated_rate_base:
    interaction_group: regulation_financing
    scanners:
      - {scanner_id: REGULATORY_RATE_CASE, mandatory: true}
      - {scanner_id: RATE_BASE_CAPITAL, mandatory: true}
      - {scanner_id: FUNDING_CAPITAL_STRUCTURE, mandatory: true}
    kill_conditions:
      - allowed return or cost recovery is denied or materially delayed
  asset_yield_nav:
    interaction_group: asset_nav
    scanners:
      - {scanner_id: NAV_CAP_RATE, mandatory: true}
      - {scanner_id: OCCUPANCY_RENT, mandatory: true}
      - {scanner_id: LEASE_DEBT_MATURITY, mandatory: true}
    kill_conditions:
      - cap-rate expansion, occupancy decline, or refinancing breaks NAV support
  financial_balance_sheet:
    interaction_group: financial_risk
    scanners:
      - {scanner_id: CREDIT_COST_CAPITAL, mandatory: true}
      - {scanner_id: FUNDING_DEPOSIT_MIX, mandatory: true}
      - {scanner_id: DISTRIBUTABLE_CAPITAL, mandatory: true}
    kill_conditions:
      - regulatory capital or asset quality blocks sustainable distributions
  probabilistic_pipeline:
    interaction_group: clinical_option
    scanners:
      - {scanner_id: CLINICAL_EVIDENCE, mandatory: true}
      - {scanner_id: CASH_RUNWAY, mandatory: true}
      - {scanner_id: PIPELINE_OWNERSHIP, mandatory: true}
    kill_conditions:
      - clinical evidence fails, enrollment stalls, or runway expires
  reserve_depletion:
    interaction_group: reserve_depletion
    scanners:
      - {scanner_id: RESERVE_REPLACEMENT, mandatory: true}
      - {scanner_id: PRODUCTION_DECLINE, mandatory: true}
      - {scanner_id: DEVELOPMENT_CAPEX, mandatory: true}
    kill_conditions:
      - reserve replacement or development economics fall below sustaining needs
  consumer_unit_economics:
    interaction_group: consumer_demand
    scanners:
      - {scanner_id: UNIT_ECONOMICS, mandatory: true}
      - {scanner_id: CHANNEL_INVENTORY, mandatory: true}
      - {scanner_id: PRICE_VOLUME_MIX, mandatory: true}
    kill_conditions:
      - volume, pricing, or channel inventory invalidates unit economics
  project_finance:
    interaction_group: project_execution
    scanners:
      - {scanner_id: PROJECT_REALIZATION, mandatory: true}
      - {scanner_id: PERMIT_INTERCONNECTION, mandatory: true}
      - {scanner_id: OFFTAKE_FINANCING, mandatory: true}
      - {scanner_id: TIME_TO_POWER, mandatory: true}
    kill_conditions:
      - permit, grid, offtake, financing, construction, or commissioning gate fails
  metered_usage_network:
    interaction_group: usage_infrastructure
    scanners:
      - {scanner_id: USAGE_COMMITMENT, mandatory: true}
      - {scanner_id: INFRASTRUCTURE_COST, mandatory: true}
      - {scanner_id: UNIT_ECONOMICS, mandatory: true}
    kill_conditions:
      - usage growth fails to cover infrastructure commitments and reinvestment
  ip_royalty_licensing:
    interaction_group: ip_duration
    scanners:
      - {scanner_id: DESIGN_WIN, mandatory: true}
      - {scanner_id: ROYALTY_DURATION, mandatory: true}
      - {scanner_id: INSTALLED_BASE, mandatory: true}
    kill_conditions:
      - design wins, royalty duration, or architecture relevance deteriorates
  hit_driven_content:
    interaction_group: content_pipeline
    scanners:
      - {scanner_id: CONTENT_COHORT, mandatory: true}
      - {scanner_id: PIPELINE_SLATE, mandatory: true}
      - {scanner_id: DEVELOPMENT_COST, mandatory: true}
    kill_conditions:
      - title cohort decay or development slippage breaks pipeline economics
  advertising_attention:
    interaction_group: ad_monetization
    scanners:
      - {scanner_id: ATTENTION_MONETIZATION, mandatory: true}
      - {scanner_id: AD_LOAD_CPM, mandatory: true}
      - {scanner_id: TRAFFIC_ACQUISITION, mandatory: true}
    kill_conditions:
      - engagement or monetization falls while traffic acquisition cost rises
  design_led_product:
    interaction_group: design_product
    scanners:
      - {scanner_id: DESIGN_WIN, mandatory: true}
      - {scanner_id: PRODUCT_MIX, mandatory: true}
      - {scanner_id: QUALIFICATION, mandatory: true}
    kill_conditions:
      - design wins fail to convert or product life shortens materially
  aum_fee_economics:
    interaction_group: aum_fee
    scanners:
      - {scanner_id: AUM_FLOW, mandatory: true}
      - {scanner_id: FEE_RATE, mandatory: true}
      - {scanner_id: PERFORMANCE_FEE, mandatory: false}
    kill_conditions:
      - net outflows or fee compression impair recurring earnings

risk_scanner_aliases:
  export_controls: REGULATORY_POLICY
  qualification: QUALIFICATION
  inventory_cycle: CHANNEL_INVENTORY
  node_execution: TECHNOLOGY_EXECUTION
  customer_concentration: CUSTOMER_CONCENTRATION
  advanced_packaging_constraint: BOTTLENECK_MIGRATION
  regulatory_lag: REGULATORY_RATE_CASE
  interconnection: PERMIT_INTERCONNECTION
  financing_close: OFFTAKE_FINANCING
  patent_life: IP_EXPIRY
  refinancing: LEASE_DEBT_MATURITY
