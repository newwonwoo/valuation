version: 1.0
principle: Common Core always runs first. Archetype modules add operating economics;
  they may narrow but never bypass evidence, risk, audit, or blind-value gates.
modules:
  contracted_backlog:
    required_evidence:
    - orders
    - backlog
    - revenue_recognition
    - cancellation_terms
    - contract_liabilities
    - lead_time
    normalization:
    - separate_orders_backlog_revenue
    - backlog_age
    - contract_asset_vs_liability
    beta_peer_features:
    - end_demand_cyclicality
    - backlog_duration
    - customer_concentration
    - operating_leverage
    per_peer_features:
    - backlog_visibility
    - conversion_duration
    - aftermarket_mix
    - incremental_roic
    - fcf_conversion
    scenario_variables:
    - book_to_bill
    - backlog_conversion
    - asp
    - cancellation
    - margin
    - capacity
    funding_scan: customer_advances_and_buyer_finance
    terminal_policy: normalize_backlog_and_margin; do_not_capitalize_one_time_peak_orderbook
    double_count_traps:
    - backlog_plus_same_future_revenue_option
    - customer_advance_fcff_plus_unproven_wacc_cut
    forbidden_methods:
    - raw_backlog_multiple_without_margin_or_conversion
    allowed_valuation_methods:
    - backlog_burn_dcf
    - normalized_dcf
    - normalized_ebitda
    - warranted_per
  capacity_manufacturing:
    required_evidence:
    - nameplate_capacity
    - effective_capacity
    - utilization
    - yield
    - asp
    - mix
    - unit_cost
    - expansion_capex
    - expansion_land_control
    - expansion_baseline_inclusion
    - expansion_capacity_committed
    - expansion_site_area
    - expansion_capex_committed
    - expansion_ramp_date
    - expansion_equipment_commitment
    - expansion_cancelled
    - no_active_capacity_expansion
    normalization:
    - nameplate_vs_effective_capacity
    - utilization_definition
    - recognized_asp_vs_order_asp
    beta_peer_features:
    - fixed_cost_intensity
    - demand_cyclicality
    - customer_concentration
    - technology_life
    per_peer_features:
    - incremental_roic
    - utilization_duration
    - mix
    - pricing_power
    - reinvestment_need
    scenario_variables:
    - capacity
    - utilization
    - yield
    - asp
    - mix
    - variable_cost
    - capex
    terminal_policy: terminal utilization and margin must be normalized; growth requires
      reinvestment
    double_count_traps:
    - capacity_option_plus_expansion_ebitda
    - growth_without_capex
    forbidden_methods:
    - peak_margin_perpetuity
    allowed_valuation_methods:
    - driver_dcf
    - warranted_per
  recurring_subscription:
    required_evidence:
    - arr
    - revenue
    - nrr
    - gross_retention
    - churn
    - gross_margin
    - rpo
    - sales_efficiency
    normalization:
    - arr_vs_revenue
    - gross_vs_net_retention
    - rpo_vs_crpo
    beta_peer_features:
    - customer_mission_criticality
    - churn
    - seat_or_usage_cyclicality
    - concentration
    per_peer_features:
    - nrr
    - growth_duration
    - gross_margin
    - fcf_margin
    - sales_efficiency
    - reinvestment
    scenario_variables:
    - new_arr
    - expansion
    - churn
    - gross_margin
    - opex
    - fcf_margin
    terminal_policy: converge growth, retention and sales efficiency to economically
      consistent steady state
    double_count_traps:
    - arr_and_revenue_as_separate_value
    - sbc_ignored_in_both_eps_and_dilution
    forbidden_methods:
    - revenue_multiple_without_retention_or_margin_bridge
    allowed_valuation_methods:
    - arr_fcf_dcf
    - warranted_per
  metered_usage_network:
    required_evidence:
    - active_customers
    - usage_volume
    - unit_price
    - committed_spend
    - infrastructure_cost
    - gross_margin
    normalization:
    - usage_vs_revenue
    - reserved_vs_on_demand
    - gross_vs_net_cloud_revenue
    beta_peer_features:
    - workload_cyclicality
    - customer_concentration
    - infrastructure_commitments
    per_peer_features:
    - usage_growth
    - unit_economics
    - incremental_margin
    - capital_intensity
    - fcf_conversion
    scenario_variables:
    - customers
    - usage_per_customer
    - price_per_unit
    - infrastructure_cost
    - capex
    terminal_policy: usage growth and infrastructure reinvestment must converge together
    double_count_traps:
    - committed_spend_plus_same_usage_forecast
    - capex_omission
    forbidden_methods:
    - saas_rule_of_40_without_usage_infrastructure_adjustment
    allowed_valuation_methods:
    - usage_driver_dcf
    - warranted_per
  transaction_marketplace:
    required_evidence:
    - gmv
    - transactions
    - active_buyers
    - active_sellers
    - take_rate
    - contribution_margin
    normalization:
    - gmv_vs_revenue
    - gross_vs_net_revenue
    - payments_pass_through
    beta_peer_features:
    - discretionary_exposure
    - network_density
    - geographic_mix
    - concentration
    per_peer_features:
    - frequency
    - take_rate
    - contribution_margin
    - network_effects
    - reinvestment
    scenario_variables:
    - users
    - frequency
    - gmv_per_transaction
    - take_rate
    - contribution_margin
    terminal_policy: mature take rate and contribution margin; avoid perpetual share
      gains
    double_count_traps:
    - gmv_and_revenue_value_overlap
    forbidden_methods:
    - gmv_multiple_without_take_rate_and_margin
    allowed_valuation_methods:
    - gmv_take_rate_dcf
    - warranted_per
  advertising_attention:
    required_evidence:
    - active_users
    - engagement
    - impressions
    - ad_load
    - cpm
    - fill_rate
    - traffic_acquisition_cost
    normalization:
    - users_vs_sessions
    - gross_vs_net_ad_revenue
    - geography_mix
    beta_peer_features:
    - ad_cycle_exposure
    - platform_dependence
    - user_concentration
    per_peer_features:
    - engagement
    - monetization_headroom
    - incremental_margin
    - traffic_cost
    scenario_variables:
    - users
    - time_spent
    - ad_load
    - cpm
    - fill_rate
    - tac
    terminal_policy: user growth, ad load and cpm cannot all remain supernormal indefinitely
    double_count_traps:
    - engagement_and_impressions_double_count
    forbidden_methods:
    - user_multiple_without_monetization_bridge
    allowed_valuation_methods:
    - attention_monetization_dcf
    - warranted_per
  ip_royalty_licensing:
    required_evidence:
    - design_wins
    - licensed_units
    - royalty_rate
    - license_fees
    - installed_base
    - contract_duration
    normalization:
    - license_fee_vs_royalty
    - shipment_vs_installed_base
    beta_peer_features:
    - end_market_mix
    - architecture_substitutability
    - customer_concentration
    per_peer_features:
    - royalty_duration
    - incremental_margin
    - ecosystem_lock_in
    - reinvestment_intensity
    scenario_variables:
    - licensed_units
    - royalty_rate
    - design_win_conversion
    - opex
    terminal_policy: fade architecture share and royalty economics unless durable
      evidence supports persistence
    double_count_traps:
    - upfront_license_plus_same_contract_royalty_overlap
    forbidden_methods:
    - hardware_peer_multiple_without_business_model_adjustment
    allowed_valuation_methods:
    - royalty_dcf
    - warranted_per
  hit_driven_content:
    required_evidence:
    - title_pipeline
    - release_schedule
    - bookings
    - engagement
    - cohort_decay
    - development_cost
    normalization:
    - bookings_vs_revenue
    - deferred_revenue
    - gross_vs_net_publishing
    beta_peer_features:
    - title_concentration
    - franchise_depth
    - release_volatility
    per_peer_features:
    - franchise_durability
    - cohort_lifetime
    - pipeline_diversification
    - cash_conversion
    scenario_variables:
    - release_probability
    - peak_bookings
    - decay_curve
    - margin
    - development_cost
    terminal_policy: no generic perpetual growth for finite-life titles; value cohorts
      and pipeline separately
    double_count_traps:
    - existing_title_dcf_plus_pipeline_option_overlap
    forbidden_methods:
    - single_forward_per_on_peak_hit_earnings
    allowed_valuation_methods:
    - cohort_npv
    - pipeline_option_sotp
  commodity_price_taker:
    required_evidence:
    - realized_price
    - benchmark_price
    - production
    - inventory
    - cash_cost
    - capacity
    - utilization
    normalization:
    - benchmark_vs_realized_price
    - grade_mix
    - contract_lag
    beta_peer_features:
    - cost_curve_position
    - commodity_mix
    - operating_leverage
    - jurisdiction
    per_peer_features:
    - midcycle_margin
    - cost_advantage_duration
    - balance_sheet_resilience
    scenario_variables:
    - normalized_price
    - volume
    - cash_cost
    - utilization
    - fx
    terminal_policy: use normalized/midcycle economics; no spot-price perpetuity
    double_count_traps:
    - policy_floor_as_realized_asp
    - spot_price_plus_cycle_multiple
    forbidden_methods:
    - spot_eps_per
    allowed_valuation_methods:
    - midcycle_price_volume_dcf
    - normalized_multiple
  process_spread:
    required_evidence:
    - input_price
    - output_price
    - product_yield
    - plant_runs
    - turnaround
    - inventory
    normalization:
    - crack_or_product_spread_definition
    - feedstock_mix
    - inventory_effect
    beta_peer_features:
    - spread_cyclicality
    - feedstock_flexibility
    - utilization
    per_peer_features:
    - midcycle_spread
    - asset_complexity
    - cost_advantage
    - reinvestment
    scenario_variables:
    - input_price
    - output_price
    - spread
    - utilization
    - yield
    - turnaround
    terminal_policy: normalize spread and utilization across cycle
    double_count_traps:
    - inventory_gain_plus_normal_margin
    forbidden_methods:
    - current_spread_perpetuity
    allowed_valuation_methods:
    - midcycle_spread_dcf
    - normalized_multiple
  regulated_rate_base:
    required_evidence:
    - rate_base
    - allowed_roe
    - capital_structure
    - capex_plan
    - regulatory_lag
    - load_growth
    normalization:
    - rate_base_definition
    - allowed_vs_earned_roe
    - rider_vs_base_rate
    beta_peer_features:
    - regulatory_quality
    - jurisdiction
    - allowed_capital_structure
    - load_mix
    per_peer_features:
    - rate_base_growth
    - earned_roe_gap
    - payout
    - financing_need
    scenario_variables:
    - rate_base
    - allowed_roe
    - capex
    - lag
    - load
    - financing
    terminal_policy: rate-base growth must be funded and consistent with regulator-allowed
      returns
    double_count_traps:
    - capex_growth_plus_unfunded_rate_base
    - allowed_roe_treated_as_guaranteed_earned_roe
    forbidden_methods:
    - generic_industrial_ev_ebitda_without_regulatory_bridge
    allowed_valuation_methods:
    - ddm
    - rate_base_roe
    - regulated_dcf
  asset_yield_nav:
    required_evidence:
    - asset_value
    - noi_or_ffo
    - occupancy
    - rent
    - cap_rate
    - debt
    - maturities
    normalization:
    - ffo_vs_affo_vs_net_income
    - gross_asset_value_vs_nav
    beta_peer_features:
    - asset_type
    - lease_duration
    - tenant_concentration
    - leverage
    per_peer_features:
    - same_store_noi
    - rent_growth
    - cap_rate
    - leverage
    - payout
    scenario_variables:
    - noi
    - occupancy
    - rent
    - cap_rate
    - refinancing_cost
    - leverage
    terminal_policy: cap rate/rent growth/maintenance capex must be jointly consistent
    double_count_traps:
    - nav_plus_same_property_ffo_value
    - depreciation_added_twice
    forbidden_methods:
    - industrial_net_debt_bridge_without_reit_adjustment
    allowed_valuation_methods:
    - ddm
    - ffo_multiple
    - nav
  financial_balance_sheet:
    required_evidence:
    - equity
    - roe
    - capital_ratio
    - spread_or_margin
    - credit_cost
    - payout
    - asset_quality
    normalization:
    - regulatory_capital
    - credit_cost
    - csm_for_insurance
    - trading_vs_recurring
    beta_peer_features:
    - business_mix
    - funding_mix
    - asset_quality
    - regulatory_capital
    per_peer_features:
    - sustainable_roe
    - payout
    - capital_generation
    - credit_cost
    scenario_variables:
    - roe
    - spread
    - credit_cost
    - growth
    - capital_ratio
    - payout
    terminal_policy: sustainable roe/payout/growth under regulatory capital constraints
    double_count_traps:
    - deducting_operating_debt_as_net_debt
    - capital_return_beyond_regulatory_capacity
    forbidden_methods:
    - generic_fcff_ev
    allowed_valuation_methods:
    - ddm
    - pb_roe
    - residual_income
  probabilistic_pipeline:
    # A KSIC prefix says what an issuer manufactures, never how it earns. This
    # premise is the discriminator the required_evidence below already implies
    # — cash_runway and stage are pre-revenue concepts — stated where a router
    # can check it against the company's own audited statements rather than
    # against its industry code. Refuted here means "this is not this
    # company's economics", not "this company is uninteresting": the run stops
    # and names the archetypes whose premise its filing does support.
    premise:
      description: >-
        Value is carried by unapproved assets whose cashflows are contingent,
        so the company is not yet earning an operating profit from products.
      refuted_when_positive:
        - ifrs-full_Revenue
        - dart_OperatingIncomeLoss
    required_evidence:
    - trial_registry
    - patient_evidence
    - stage
    - development_cost
    - ownership_economics
    - cash_runway
    normalization:
    - company_phase_label_to_evidence_stage
    - asset_npv_to_equity_attribution
    beta_peer_features:
    - cash_runway
    - portfolio_diversification
    - commercial_business_mix
    per_peer_features:
    - not_default_for_pre_revenue_pipeline
    scenario_variables:
    - probability_of_success
    - peak_sales
    - net_price
    - margin
    - timing
    - development_cost
    terminal_policy: pipeline assets use finite patent/commercial life; no generic
      per for pre-revenue pipeline
    double_count_traps:
    - pipeline_in_core_and_option
    - gross_asset_npv_without_economic_attribution
    forbidden_methods:
    - pipeline_per
    - company_phase_label_probability
    allowed_valuation_methods:
    - rnpv
  reserve_depletion:
    required_evidence:
