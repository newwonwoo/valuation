    allowed_valuation_methods:
    - project_npv
    - sotp
  design_led_product:
    required_evidence:
    - design_wins
    - units
    - asp
    - product_mix
    - gross_margin
    - rd
    - supplier_commitments
    - inventory
    normalization:
