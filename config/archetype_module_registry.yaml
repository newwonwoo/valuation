    - production
    - decline
    - capex
    - reserves
    - cost
    terminal_policy: depletion and replacement must be explicit; do not perpetuate
      finite reserves
    double_count_traps:
    - reserve_nav_plus_same_production_dcf
    forbidden_methods:
    - spot_eps_per
    allowed_valuation_methods:
