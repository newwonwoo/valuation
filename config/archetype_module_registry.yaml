    - sell_in_vs_sell_through
    - gross_vs_net_channel_revenue
    beta_peer_features:
    - discretionary_mix
    - channel_concentration
    - inventory_risk
    - brand_power
    per_peer_features:
    - sssg
    - gross_margin
    - inventory_turn
    - store_economics
    - reinvestment
    scenario_variables:
    - traffic
    - ticket
    - units
    - price
    - margin
    - inventory
    - openings
    terminal_policy: new-store/customer growth requires reinvestment and saturation
      constraints
    double_count_traps:
