version: 1.0
principles:
  - Broker research is a discovery/corroboration layer, not primary evidence.
  - Target-company Street forecasts, target prices, ratings, target multiples and consensus remain blind-locked until INTRINSIC_VALUE_FREEZE.
  - Industry-wide forecasts may enter pre-freeze only as FORWARD_HYPOTHESIS and require independent verification before assumption compilation.
  - Two brokers citing the same underlying dataset do not count as two independent confirmations.
  - Channel checks and proprietary alternative data create verification requests; they do not become realized evidence by themselves.
  - Licensed/client research raw text is never committed to the public repository.
report_types:
  industry_primer:
    best_for: [industry_definition, value_chain, kpi_definition, accounting_conventions, valuation_method_candidates]
    pre_freeze_posture: candidate_knowledge
  industry_deep_dive:
    best_for: [mechanism_candidate, bottleneck, economics, supply_chain, leading_indicator_candidate]
    pre_freeze_posture: candidate_knowledge
  industry_outlook:
    best_for: [industry_forecast, scenario_ranges, cycle_state, catalyst_calendar]
    pre_freeze_posture: forward_hypothesis
  earnings_preview:
    best_for: [near_term_expectation, kpi_watchlist, debate]
    pre_freeze_posture: target_company_fields_quarantined
  earnings_review:
    best_for: [estimate_revision_reason, kpi_delta, thesis_delta]
    pre_freeze_posture: target_company_fields_quarantined
  channel_check:
    best_for: [lead_signal, supply_demand_tightness, pricing, customer_behavior]
    pre_freeze_posture: verification_request_only
  conference_field_trip:
    best_for: [qualitative_change, management_or_channel_context, capacity_timing]
    pre_freeze_posture: verification_request_only
  quant_alt_data:
    best_for: [proprietary_leading_indicator, survey, traffic, jobs, transactions, web_or_app_data]
    pre_freeze_posture: candidate_or_verification_request
  thematic:
    best_for: [cross_sector_mechanism, value_chain_expansion, regime_shift]
    pre_freeze_posture: candidate_knowledge
  initiation:
    best_for: [business_model, peer_map, accounting_bridge, valuation_method, risk_map]
    pre_freeze_posture: company_forecast_and_valuation_fields_quarantined
  company_update:
    best_for: [estimate_delta, event_interpretation]
    pre_freeze_posture: quarantined
  valuation_change:
    best_for: [street_model_delta, target_method_change]
    pre_freeze_posture: post_freeze_only
  strategy:
    best_for: [sector_rotation, macro_link, positioning, revisions]
    pre_freeze_posture: context_only
