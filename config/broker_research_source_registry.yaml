version: 1.0
rules:
- Store report metadata and derived claims; do not mirror copyrighted sell-side PDFs
  into the public repository.
- Honor explicit anti-bulk-download terms and client-entitlement restrictions.
- Target-company Street forecasts/targets/ratings/multiples/consensus are unavailable
  to intrinsic valuation before INTRINSIC_VALUE_FREEZE.
- Track broker_family separately from underlying_data_family to prevent Street echo
  double counting.
- Broker-only corroboration cannot canonize an industry mechanism without at least
  one independent non-broker evidence family.
