version: 1.0
purpose: Coverage universe for sell-side research discovery. Presence does not imply
  entitlement or raw-content permission.
rules:
- Direct access and licensing must be verified before ingestion.
- Aggregator discovery does not convert an originating broker into an independent
  source family.
- Restricted/client-only houses remain metadata/watchlist entries until the user has
  legitimate entitlement.
