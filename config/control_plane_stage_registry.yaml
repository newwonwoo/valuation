version: 1.0
principle: Control Plane commands; LLM advises; Compiler commits assumptions; deterministic engines calculate; Audit alone authorizes intrinsic freeze.
llm_contract:
  allowed_actions: [observe, reason, propose, recover, design, ask]
  forbidden_actions:
    - commit_assumption
    - perform_valuation_math
    - authorize_stage
    - issue_freeze_token
    - mutate_canonical_system_without_user_approval
recovery_ladder:
  - research
  - reconcile
  - derive
  - proxy
  - alternate_model
  - bounded_estimate
  - partial_valuation
  - capability_design
  - valuation_blocked
capability_build_gate:
  require_all:
    - existing_capability_exhausted
    - material_to_current_analysis
    - reusable_beyond_current_case
    - input_output_contract_defined
  user_decision_required_before_build: true
coverage_rule:
  silent_skip_forbidden: true
  terminal_statuses:
    - pass
    - warning
    - blocked
    - skipped_not_applicable
    - not_implemented
    - recovered
    - awaiting_user_decision
reporting_contract:
  contract_id: prism_major_gate_reporting/v1
  major_gates:
    - gate_id: G1_EVIDENCE_ROUTING
      title: 증거 수집·산업 라우팅
      terminal_stage: EVIDENCE_LEDGER
    - gate_id: G2_INSIGHT_CHALLENGE
      title: 인사이트 도출·반증 검토
      terminal_stage: RESEARCH_LOOP
    - gate_id: G3_ASSUMPTIONS_METHOD_RISK
      title: 가정·평가방법·위험
      terminal_stage: WACC_VALIDATION
    - gate_id: G4_VALUATION_AUDIT_FREEZE
      title: 가치평가·감사·내재가치 고정
      terminal_stage: INTRINSIC_VALUE_FREEZE
    - gate_id: G5_POST_FREEZE_PERSISTENCE
      title: 고정 후 비교·영구 저장
      terminal_stage: FINAL_REPORT
  summary_fields:
    - status
    - decisive_result
    - residual_risk
    - next_action
  final_report_page_policy:
    main_body_target_pages: [3, 4]
    audit_appendix_target_pages: [1, 2]
    total_page_cap: 6
    visual_pages_included_in_main_body: 2
  typography_policy:
    body_min_pt: 13
    primary_heading_min_pt: 22
    section_heading_min_pt: 18
    dense_wide_tables_forbidden: true
  source_link_policy:
    direct_http_links_required: true
    claim_source_mapping_required: true
    non_http_source_refs_forbidden_in_live_reports: true
  llm_insight_policy:
    separate_section_required: true
    max_chars: 1000
    deterministic_outputs_separated: true
phases:
  I_OPENING:
    - COMPANY_RESOLUTION
    - LOAD_COMPANY_STATE
    - LOAD_INDUSTRY_KNOWLEDGE_SNAPSHOT
    - SOURCE_FRESHNESS_PRECHECK
  II_BATTLEFIELD_MAPPING:
    - SEGMENT_DECOMPOSITION
    - INDUSTRY_DNA_ROUTE
    - MODULE_REQUIREMENT_PLAN
  III_INTELLIGENCE:
    - PRIMARY_EVIDENCE_COLLECTION
    - EVIDENCE_LEDGER
    - ROCKET_INSIGHT_SCAN
    - UPSTREAM_FUNDING_SCAN
  IV_WAR_COUNCIL:
    - RESEARCHER_A
    - BLIND_RED_TEAM_B
    - RESEARCH_LOOP
  V_ORDER_COMPILATION:
    - EVIDENCE_TO_ASSUMPTION_BRIDGE
    - SCENARIO_BUILD
  VI_VALUATION_FIREPOWER:
    - VALUATION_METHOD_INTENT
    - HIERARCHICAL_BETA_ESTIMATION
    - WACC_VALIDATION
    - DETERMINISTIC_VALUATION
    - HIERARCHICAL_WARRANTED_PER
    - DCF_PER_ASSUMPTION_CONSISTENCY_GATE
    - CROSS_METHOD_DOUBLE_COUNT_AUDIT
    - PROBABILITY_DISTRIBUTION_ANALYSIS
  VII_FINAL_INSPECTION:
    - AUDIT_GATE
    - INTRINSIC_VALUE_FREEZE
  VIII_POST_FREEZE:
    - STREET_REFERENCE_LOAD
    - STREET_GAP_ANALYZER
    - MARKET_PRICE_LOAD
    - MARKET_COMPARE
    - THESIS_DELTA
    - SAVE_STATE
    - FINAL_REPORT
post_freeze_authorization:
  requires:
    - audit_pass
    - doctrine_coverage_complete
    - intrinsic_freeze_token
  prohibited_before_token:
    - target_company_consensus
    - target_price
    - target_multiple
    - rating
    - current_market_price
