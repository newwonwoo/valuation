version: 1.0
purpose: Cross-industry foundation sources used to classify industries, normalize metrics, build structural priors, calibrate sector sanity checks, and govern provenance. They do not directly set target-company valuation assumptions unless explicitly permitted by the knowledge placement policy.
sources:
  - id: IFRS_SASB_STANDARDS
    family: IFRS_ISSB_SASB
    layer: metric_standard
    authority: standard_setter
    access: public_or_registered
    cadence: maintained
    use_for: [industry_kpi_template, risk_topic_template, module_requirement_plan]
    never_for: [direct_company_forecast, direct_per_assignment, direct_wacc_adjustment]
    url: https://www.ifrs.org/issued-standards/sasb-standards/
    notes: Industry-specific investor decision-useful topics/metrics across 77 SICS industries. Treat as a requirements ontology, not realized operating evidence.

  - id: UN_ISIC_REV5
    family: UNSD_ISIC
    layer: classification_standard
    authority: official_statistics_standard
    access: public_file
    cadence: revision_cycle
    use_for: [international_industry_classification, taxonomy_crosswalk]
    never_for: [economic_archetype_finalization, valuation_assumption]
    url: https://unstats.un.org/unsd/classifications/Econ/isic/4

  - id: KR_KSIC_REV11
    family: KOSTAT_KSIC
    layer: classification_standard
    authority: official_statistics_standard
    access: public_reference
    cadence: revision_cycle
    use_for: [korea_industry_classification, taxonomy_crosswalk]
    never_for: [economic_archetype_finalization, valuation_assumption]
    url: https://lib1.kostat.go.kr/search/detail/CATCAZ000000102655
    notes: 11th revision index published by Statistics Korea in 2024.

  - id: US_NAICS_2022
    family: US_CENSUS_NAICS
    layer: classification_standard
    authority: official_statistics_standard
    access: public_file
    cadence: revision_cycle
    use_for: [us_industry_classification, taxonomy_crosswalk]
    never_for: [economic_archetype_finalization, valuation_assumption]
    url: https://www.census.gov/naics/
    notes: Watch the 2027 revision process separately; classification changes are definition changes, not operating signals.

  - id: OECD_ICIO_2025
    family: OECD_ICIO
    layer: structural_supply_chain_prior
    authority: multilateral
    access: public_file
    cadence: edition_revision
    use_for: [cross_country_input_output, supply_chain_topology, import_dependency_prior]
    never_for: [real_time_demand_signal, direct_company_revenue_forecast]
    url: https://www.oecd.org/en/data/datasets/inter-country-input-output-tables.html
    notes: Current 2025 edition was revised twice, with the second revision released in January 2026. Preserve vintage.

  - id: KR_BOK_INPUT_OUTPUT
    family: BOK_IO
    layer: structural_supply_chain_prior
    authority: central_bank_statistics
    access: api_or_public_table
    cadence: periodic
    use_for: [korea_input_output, domestic_supply_chain_topology, structural_input_share]
    never_for: [real_time_demand_signal, direct_company_revenue_forecast]
    url: https://ecos.bok.or.kr/

  - id: US_BEA_INPUT_OUTPUT
    family: BEA_IO
    layer: structural_supply_chain_prior
    authority: official_statistics
    access: public_table
    cadence: annual_benchmark
    use_for: [us_make_use_tables, direct_requirements, total_requirements, structural_input_share]
    never_for: [real_time_demand_signal, direct_company_revenue_forecast]
    url: https://www.bea.gov/industry/input-output-accounts-data

  - id: IFRS_ACCOUNTING_TAXONOMY_CURRENT
    family: IFRS_ACCOUNTING_TAXONOMY
    layer: metric_standard
    authority: standard_setter
    access: public_file
    cadence: taxonomy_release
    use_for: [accounting_metric_ontology, tag_definition, taxonomy_version_watch]
    never_for: [economic_assumption_without_filing, direct_company_forecast]
    url: https://www.ifrs.org/issued-standards/ifrs-taxonomy/
    notes: In 2026 the 2025 IFRS Accounting Taxonomy remains the current annual taxonomy until the 2027 release; track architecture guidance separately from taxonomy version.

  - id: US_SEC_XBRL_FINANCIAL_DATASETS
    family: SEC_XBRL
    layer: primary_observed
    authority: regulator_primary
    access: public_file
    cadence: quarterly
    use_for: [reported_financials, tag_mapping_validation, metric_ontology_training]
    never_for: [substitute_for_full_filing_when_critical, broker_consensus]
    url: https://www.sec.gov/dera/data/financial-statement-data-sets

  - id: W3C_DCAT3
    family: W3C_DCAT
    layer: provenance_standard
    authority: technical_standard
    access: public_spec
    cadence: standard_revision
    use_for: [dataset_series_model, version_lineage, distribution_metadata]
    never_for: [industry_fact, valuation_assumption]
    url: https://www.w3.org/TR/vocab-dcat-3/

  - id: W3C_PROV_O
    family: W3C_PROV
    layer: provenance_standard
    authority: technical_standard
    access: public_spec
    cadence: standard_revision
    use_for: [claim_provenance, extraction_activity_lineage, derivation_graph]
    never_for: [industry_fact, valuation_assumption]
    url: https://www.w3.org/TR/prov-o/

  - id: W3C_DQV
    family: W3C_DQV
    layer: provenance_standard
    authority: technical_standard
    access: public_spec
    cadence: standard_revision
    use_for: [data_quality_measurement, update_quality, conformance_metadata]
    never_for: [industry_fact, valuation_assumption]
    url: https://www.w3.org/TR/vocab-dqv/

  - id: NYU_DAMODARAN_SECTOR_DATA
    family: NYU_DAMODARAN
    layer: calibration_reference
    authority: practitioner_academic
    access: public_file
    cadence: periodic
    use_for: [beta_l1_sanity_check, sector_margin_roic_sanity_check, multiple_sanity_check]
    never_for: [copy_target_beta, copy_target_wacc, copy_target_per]
    url: https://pages.stern.nyu.edu/~adamodar/New_Home_Page/data.html
