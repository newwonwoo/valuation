version: 1.0
rules:
- Forecasts are FORWARD_HYPOTHESIS, never OBSERVED_STATE.
- Policy intent and realized transmission are separate claims.
- Licensed reports store metadata/derived facts only in public repositories.
- Canonical industry rules require independent-source corroboration, definition normalization,
  falsifiability and explicit approval.
- Same source family repeated over many documents does not count as independent corroboration.
