version: 1.0
principle: Source authority and source placement are separate. A high-authority source can still be forbidden from a valuation stage if its semantic role does not belong there.
layers:
  classification_standard:
    stages: [foundation_load, industry_dna_route]
    uses: [taxonomy, crosswalk, segment_label_candidate]
    disposition: canonical_definition
    direct_assumption: false
  metric_standard:
    stages: [foundation_load, module_requirement_plan, evidence_normalization]
    uses: [metric_definition, kpi_template, accounting_tag_ontology, risk_topic_template]
    disposition: canonical_definition
    direct_assumption: false
  provenance_standard:
    stages: [source_registration, source_freshness_precheck, audit_gate]
    uses: [version_lineage, provenance, quality_metadata, schema_change_policy]
    disposition: governance_only
    direct_assumption: false
  structural_supply_chain_prior:
    stages: [industry_dna_route, mechanism_validation, upstream_funding_scan]
    uses: [structural_edge_prior, import_dependency, upstream_downstream_topology]
    disposition: structural_prior
    direct_assumption: false
    max_freshness_use: structural
  primary_observed:
    stages: [primary_evidence_collection, mechanism_validation, evidence_to_assumption_bridge]
    uses: [observed_fact, realized_state, benchmark_if_definition_matched]
    disposition: observed_evidence
    direct_assumption: bridge_required
  public_industry_research:
    stages: [industry_dna_route, module_requirement_plan, mechanism_validation, scenario_build]
    uses: [industry_structure, definition_candidate, mechanism_candidate, forward_hypothesis, benchmark_candidate]
    disposition: candidate_or_corroboration
    direct_assumption: false
  broker_research:
    stages: [industry_dna_route, module_requirement_plan, mechanism_validation, street_gap]
    uses_pre_freeze: [value_chain_candidate, kpi_candidate, mechanism_candidate, leading_indicator_candidate, investor_debate, underlying_data_discovery]
    uses_post_freeze: [target_company_forecast, target_price, rating, target_multiple, consensus, model_reproduction]
    disposition: secondary_discovery
    direct_assumption: false
  alternative_data:
    stages: [mechanism_validation, monitoring]
    uses: [leading_indicator_candidate, verification_request, nowcast_candidate]
    disposition: candidate_only
    direct_assumption: false
  company_primary:
    stages: [primary_evidence_collection, mechanism_validation, evidence_to_assumption_bridge]
    uses: [reported_company_fact, contract_fact, segment_fact, company_plan_as_plan]
    disposition: company_evidence
    direct_assumption: bridge_required
  calibration_reference:
    stages: [hierarchical_beta_estimation, wacc_validation, hierarchical_warranted_per, audit_gate]
    uses: [l1_prior_sanity_check, sector_distribution_sanity_check]
    disposition: reference_only
    direct_assumption: false
  market_reference:
    stages: [intrinsic_value_freeze, street_gap, market_compare]
    uses: [peer_market_reference, target_market_price]
    disposition: post_freeze_only
    direct_assumption: false

cross_layer_rules:
  - id: BROKER_TO_CANONICAL
    rule: Broker research may discover a metric/mechanism but canonical promotion requires at least one independent non-broker family plus the ordinary mechanism promotion gates.
  - id: IO_TO_COMPANY
    rule: Input-output tables establish structural exposure priors only; current company demand requires fresh industry/company evidence.
  - id: SASB_TO_VALUATION
    rule: SASB/ISSB metrics populate module requirements and risk/kill-condition candidates; they never directly change WACC, PER, revenue, margin or probability.
  - id: TAXONOMY_TO_FACT
    rule: XBRL/accounting taxonomies define tags and concepts. Realized values come from filings/datasets referencing those tags.
  - id: ALTDATA_TO_FACT
    rule: Alternative data creates a verification request unless methodology, representativeness and independent realized validation pass.
  - id: STREET_ECHO
    rule: Distinct brokers sharing one underlying data family count as one underlying corroboration family.
  - id: BLIND_VALUE
    rule: Target-company Street forecasts, target prices, ratings, target multiples, consensus and current market price remain quarantined until INTRINSIC_VALUE_FREEZE.
