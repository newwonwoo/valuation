version: 1
purpose: >-
  Deterministic extraction patterns for the semi-standard operating tables of
  Korean statutory periodic filings (사업보고서/분기·반기보고서 "II. 사업의 내용"):
  수주총액, 수주잔고, 생산능력, 생산실적, 가동률. These are facts about the
  FILING FORMAT, not about any company. A pattern that does not match a given
  company's filing yields no Evidence for that metric, and the collection stage
  reports the gap by name - extraction never guesses and never averages.
  Ambiguous matches (two locations) fail closed per dart_kpi's exactly-one rule.
  Capacity/production patterns currently read money-denominated tables only
  (백만원/억원/천원): a physical-unit disclosure (MW, 대, 톤) needs its own
  dimension-specific metric entry because one extraction spec cannot mix unit
  dimensions - that is a declared limitation, not an accident.
  anchor_terms gate the LLM locator path: a proposed quote must contain one of
  the metric's anchor terms, so the model can only point at spans that carry
  the metric's own disclosure vocabulary.
  require_current_period (optional, default false) is the wrong-column guard:
  when true, an LLM-proposed quote for that metric must carry an explicit
  current-period affirmation (당기/당분기/보고기간말…) or the filing's fiscal
  year, else it becomes a named gap. Leave it off for scalar disclosures that
  never state a period word; enable it only for metrics whose tables reliably
  label the current column, so a legitimate figure is never turned into a gap.
patterns:
  orders:
    # 수주상황 statutory tables label the current column (당기/당기말/보고기간말),
    # so the LLM locator path demands the marker: a bare unlabelled cell in a
    # multi-period 수주 table must not be assumed current.
    require_current_period: true
    anchor_terms: [수주총액, 신규수주]
    locator_label: 수주총액 (사업의 내용 수주상황 표)
    value_pattern: '수주총액[^0-9%]{0,60}?(?P<value>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>백만원|억원|천원|원)'
    canonical_unit: KRW_million
    source_unit_map:
      백만원: KRW_million
      억원: KRW_hundred_million
      천원: KRW_thousand
      원: KRW
    critical: false
  backlog:
    # 수주상황 statutory tables label the current column (당기/당기말/보고기간말),
    # so the LLM locator path demands the marker: a bare unlabelled cell in a
    # multi-period 수주 table must not be assumed current.
    require_current_period: true
    anchor_terms: [수주잔고, 수주잔액]
    locator_label: 수주잔고 (사업의 내용 수주상황 표)
    value_pattern: '수주잔고[^0-9%]{0,60}?(?P<value>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>백만원|억원|천원|원)'
    canonical_unit: KRW_million
    source_unit_map:
      백만원: KRW_million
      억원: KRW_hundred_million
      천원: KRW_thousand
      원: KRW
    critical: false
  nameplate_capacity:
    anchor_terms: [생산능력]
    locator_label: 생산능력 (사업의 내용 생산설비 표)
    value_pattern: '생산능력[^0-9%]{0,60}?(?P<value>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>백만원|억원|천원)'
    canonical_unit: KRW_million
    source_unit_map:
      백만원: KRW_million
      억원: KRW_hundred_million
      천원: KRW_thousand
    critical: false
  capacity:
    anchor_terms: [생산능력]
    locator_label: 생산능력 (사업의 내용 생산설비 표)
    value_pattern: '생산능력[^0-9%]{0,60}?(?P<value>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>백만원|억원|천원)'
    canonical_unit: KRW_million
    source_unit_map:
      백만원: KRW_million
      억원: KRW_hundred_million
      천원: KRW_thousand
    critical: false
  production:
    anchor_terms: [생산실적]
    locator_label: 생산실적 (사업의 내용 생산실적 표)
    value_pattern: '생산실적[^0-9%]{0,60}?(?P<value>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>백만원|억원|천원)'
    canonical_unit: KRW_million
    source_unit_map:
      백만원: KRW_million
      억원: KRW_hundred_million
      천원: KRW_thousand
    critical: false
  utilization:
    anchor_terms: [가동률]
    locator_label: 가동률 (사업의 내용 생산설비 가동률 표)
    value_pattern: '(?:평균)?가동률[^0-9]{0,40}?(?P<value>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>%)'
    canonical_unit: ratio
    source_unit_map:
      '%': '%'
    critical: false
  realized_price:
    anchor_terms: [판매단가, 판매가격, 평균판매단가]
    locator_label: 판매단가 (사업의 내용 주요 제품 가격변동추이 표)
    value_pattern: '(?:평균)?판매단가[^0-9%]{0,60}?(?P<value>[0-9][0-9,]*(?:\.[0-9]+)?)\s*(?P<unit>원/톤|천원/톤|원/kg)'
    canonical_unit: KRW_per_ton
    source_unit_map:
      원/톤: KRW_per_ton
      천원/톤: KRW_thousand_per_ton
      원/kg: KRW_per_kg
    critical: false
