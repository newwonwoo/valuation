    sector_adapter: recycling.materials
    archetypes: [process_spread]
    structure:
      revenue_recognition: processed_material_delivery
      price_formation: recovered-metal benchmark less feedstock and processing cost
      asset_ownership: owned processing and recovery assets
      capital_intensity: medium-high
      regulation_intensity: high
      customer_structure: waste suppliers and commodity or material buyers
      reinvestment_model: recovery capacity and environmental compliance capex
      cashflow_duration: commodity-and-feedstock cycle
  - ksic_prefix: "24"
    label: 1차 금속 제조업
    sector_adapter: metals.steel
    archetypes: [commodity_price_taker, process_spread]
