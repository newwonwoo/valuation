      revenue_recognition: shipment
      price_formation: benchmark metal prices and raw-material spreads
      asset_ownership: owned mills
      capital_intensity: very-high
      regulation_intensity: medium-high
      customer_structure: construction, auto and shipbuilding buyers
      reinvestment_model: maintenance and low-carbon transition capex
      cashflow_duration: commodity-cycle driven
