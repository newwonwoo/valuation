version: 1
purpose: >-
  Operator-verified industry data series that the generic industry-series
  collector may turn into Evidence. Three structural rules, enforced at load:
  (1) a series may only serve an industry-observable metric - company-realized
  quantities (realized_price, cash_cost, production, utilization, ...) are
  refused, because an industry average wearing a company metric's name is the
  exact conflation the definition-normalization gate forbids; (2) every row
  carries a definition_id and a real definition that rides into the Evidence
  notes; (3) a row collects only after an operator has checked the source
  catalog and persisted the timestamp-enriched snapshot created by
  scripts/verify_industry_series.py - a guessed table identity is a fabricated
  source, so this file ships with ZERO verified rows and the cold run's coverage
  gap stays truthful until real series are verified. Runtime collection never
  fetches the mutable credentialed endpoint; Evidence uses verification_url,
  which must be a credential-free public source link.
series: []
