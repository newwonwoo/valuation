version: "3.2-legacy"
runtime_scope: frozen_replay_and_non_actionable_diagnostics_only
purpose: >-
  Historical v3.2 scenario-quantization contract retained only to reproduce
  immutable prior outputs. It estimates continuous financial-driver paths and
  assigns them to the nearest predeclared economic scenario; that assignment is
  a discretization artifact, not a calibrated outcome probability, and cannot
  authorize a new target, entry price, or success-probability claim.

probability_value_isolation:
  probability_contract: evidence_only
  forbidden_input_domains:
    - current_market_price
    - target_price
    - scenario_intrinsic_value
    - expected_value
    - valuation_gap
    - return_target
    - entry_price
  valuation_binding_stage: post_probability_freeze_only
  probability_hash_depends_on_valuation_inputs: false

hard_integrity_gates:
  first_seen_at: required
  publication_timestamp_cutoff: required
  duplicate_event_identity: forbidden
  outcome_leakage: forbidden
  source_traceability: required
  period_unit_consistency: required

continuous_predictive_weight:
  minimum_weight: 0.05
  skill_temperature: 0.08
  target_resolved_events: 100
  target_companies: 20
  target_quarters: 8
  target_oos_windows: 4
  ece_soft_scale: 0.10
  uncertainty_inflation_max: 3.0
  brier_skill_zero_action: neutral_not_blocked
  confidence_interval_crosses_zero_action: reduce_weight_not_block
  missing_oos_action: low_positive_weight_not_block

hierarchical_calibration:
  hierarchy:
    - GLOBAL
    - ECONOMIC_ARCHETYPE
    - INDUSTRY_FAMILY
    - SUB_INDUSTRY
    - COMPANY_CONDITIONING
  binary_event_posteriors_role: diagnostics_and_tail_risk_only
  scenario_probability_source: continuous_driver_posterior_predictive
  sparse_leaf_action: inherit_parent_with_wide_interval
  local_evidence_action: partial_pool_continuous_distribution
  default_credible_level: 0.90

continuous_financial_path_model:
  required_driver_families:
    - revenue_growth
    - operating_margin
    - cash_conversion
    - capex_intensity
  optional_driver_families:
    - utilization
    - selling_price
    - working_capital
    - fcff_index
  predictive_distribution: hierarchical_posterior_predictive
  tail_model: student_t
  cross_driver_dependence: explicit_versioned_correlation_or_copula
  current_company_conditioning: allowed_without_market_price

scenario_assembly:
  legacy_method: continuous_financial_path_monte_carlo
  direct_historical_down_core_bull_frequency: forbidden
  binary_event_state_to_scenario_mapping: forbidden
  bull_requires_all_risk_events_inactive: forbidden
  naive_independent_factor_multiplication: forbidden
  path_assignment: nearest_predeclared_economic_scenario_path
  path_distance: predictive_scale_normalized_weighted_distance
  scenario_intrinsic_value_in_assignment: forbidden
  current_market_price_in_assignment: forbidden
  each_simulated_path_maps_to_exactly_one_scenario: required
  emit_probability_credible_intervals: required

valuation_binding:
  numeric_weighting_allowed_when: frozen_pre_migration_replay_receipt_only
  new_target_or_entry_price_authorization: forbidden
  success_probability_claim_authorization: forbidden
  weak_predictive_skill_action: reduce_weight_and_widen_interval
  no_minimum_leaf_sample_for_probability_existence: true
  target_price_or_market_price_tuning: forbidden
  intrinsic_value_consumption: after_probability_snapshot_hash_is_frozen

legacy_compatibility:
  v1_probability_calibration: preserved
  v2_hierarchical_promotion_gate: preserved_for_replay
  v3_boolean_event_scenario_assembly: legacy_replay_only
  v3_default_for_new_investment_probability_work: false

successor_live_route:
  policy_contract: distribution_route_authorization/v1
  authorization_module: src/valuation_engine/distribution_route_policy.py
  calibrated_distribution: continuous_driver_paths_valued_path_by_path
  uncalibrated_event_distribution: source_bound_probability_ambiguity_set
  uncalibrated_entry_contract: two_layer_dated_payoff_ambiguity_entry/v1
  uncalibrated_entry_module: src/valuation_engine/payoff_model_ambiguity.py
  uncalibrated_entry_rule: minimum_expected_present_value_across_complete_probability_and_payoff_model_vertices
  lowest_individual_probability_entry_rule: forbidden
  branchwise_model_case_cherry_pick: forbidden
  undated_cumulative_payoff_discounting: forbidden
  scenario_role: post_valuation_summary_only
  path_assignment_before_valuation: forbidden
  report_time_equity_floor: forbidden
  current_market_price_in_probability_or_entry: forbidden
