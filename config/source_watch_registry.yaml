as_of: '2026-08-21'
rules:
  states:
  - clean
  - new_release
  - revision
  - definition_change
  - schema_change
  - expected_release_missed
  - source_failure
  - updated_not_reviewed
  - revalidation_required
  - material_change
  hashes:
  - document_hash
  - fact_hash
  - definition_hash
  - schema_hash
  grace_policy: Do not mark a release missed until expected date + grace_days; live
    refetch is required before blocking valuation.
