version: 1.0
purpose: Canonical static contract map for PRISM units. Defines what each unit consumes, emits, who consumes it, and which decision/value paths it may affect.
principles:
  - this_registry_is_static_design_truth
  - ModuleImpactTrace_is_run_specific_actual_truth
  - expected_vs_actual_diff_is_audit_signal
  - no_unit_may_be_activated_without_an_output_or_guardrail_path
  - direct_effects_outside_declared_effect_types_are_forbidden
unit_types:
  - doctrine
  - controller
  - source_adapter
  - normalizer
  - router
  - scanner
  - gate
  - llm_role
  - bridge
  - compiler
  - scenario_engine
  - risk_engine
  - valuation_engine
  - aggregator
  - audit
  - market_layer
  - monitor
  - learning
  - reporter
  - governance

effect_types:
  - evidence_effect
  - hypothesis_effect
  - routing_effect
  - assumption_effect
  - timing_effect
  - probability_effect
  - method_effect
  - value_effect
  - guardrail_effect
  - reporting_effect

units:
  - unit_id: DOCTRINE_CONSTITUTION
    unit_type: doctrine
    implementation_status: implemented
    stages: [GLOBAL]
    purpose: Define authority, invariants, forbidden paths, and source-of-truth precedence.
    inputs: [SKILL.md, AGENTS.md, V04/V05 contracts, policy registries]
    outputs: [doctrine_rules, authority_boundaries, forbidden_paths]
    consumers: [VALUATION_CONTROL_PLANE, AUDIT_GATE, MODULE_PROMOTION]
    effect_types: [guardrail_effect, routing_effect]
    final_outputs: [run_validity]
    canonical_refs: [SKILL.md, AGENTS.md, docs/V04_ROCKETSLA_EXTENSION.md, docs/V05_WORKFLOW_CONTRACT.md]
    forbidden_effects: [direct_assumption_value, direct_intrinsic_value]

  - unit_id: VALUATION_CONTROL_PLANE
    unit_type: controller
    implementation_status: implemented
    stages: [GLOBAL]
    purpose: Choose mission, authorize stage transitions, deploy required units, run recovery, and control pre/post-freeze access.
    inputs: [doctrine_rules, company_state, stage_statuses, doctrine_coverage, recovery_results]
    outputs: [mission_plan, stage_authorization, scanner_loadout, recovery_directive, freeze_authorization_request]
    consumers: [INDUSTRY_DNA_ROUTER, MODULE_REQUIREMENT_PLAN, PRIMARY_EVIDENCE_COLLECTION, LLM_STAFF, AUDIT_GATE]
    effect_types: [routing_effect, method_effect, guardrail_effect]
    final_outputs: [run_status, doctrine_coverage]
    canonical_refs: [src/valuation_engine/control_plane.py, src/valuation_engine/orchestrator.py, src/valuation_engine/live_readiness.py, config/control_plane_stage_registry.yaml, config/live_primary_readiness.yaml, docs/CONTROL_PLANE_ARCHITECTURE.md, docs/LIVE_PRIMARY_READINESS.md]
    forbidden_effects: [perform_valuation_math, commit_assumption, bypass_audit]

  - unit_id: INDUSTRY_DNA_ROUTER
    unit_type: router
    implementation_status: implemented
    stages: [SEGMENT_DECOMPOSITION, INDUSTRY_DNA_ROUTE]
    purpose: Resolve segment economic structure into Sector Adapters and Economic Archetypes.
    inputs: [company_business_description, segment_evidence, industry_taxonomy, sector_adapter_registry, archetype_registry]
    outputs: [segment_routes, economic_archetypes, routing_rationale]
    consumers: [MODULE_REQUIREMENT_PLAN, ECONOMIC_TWIN_SELECTION, DETERMINISTIC_VALUATION]
    effect_types: [routing_effect, method_effect]
    final_outputs: [selected_valuation_methods, required_evidence_plan]
    canonical_refs: [src/valuation_engine/industry_dna.py, config/industry_taxonomy.yaml, config/sector_adapter_registry.yaml, config/archetype_module_registry.yaml]
    forbidden_effects: [keyword_only_live_routing, direct_value_effect]

  - unit_id: MODULE_REQUIREMENT_PLAN
    unit_type: controller
    implementation_status: implemented
    stages: [MODULE_REQUIREMENT_PLAN]
    purpose: Convert Industry DNA into mandatory evidence, KPIs, scanners, risk checks, methods, and kill conditions.
    inputs: [segment_routes, economic_archetypes, metric_standards, archetype_module_registry]
    outputs: [required_evidence, required_kpis, mandatory_scanners, permitted_methods, kill_conditions, forbidden_methods]
    consumers: [PRIMARY_EVIDENCE_COLLECTION, ROCKET_INSIGHT_SCAN, UPSTREAM_FUNDING_SCAN, ASSUMPTION_COMPILER, AUDIT_GATE]
    effect_types: [evidence_effect, routing_effect, method_effect, guardrail_effect]
    final_outputs: [research_scope, doctrine_coverage]
    canonical_refs: [src/valuation_engine/module_plan.py, src/valuation_engine/shadow_adapters.py, config/archetype_module_registry.yaml, config/archetype_control_requirements.yaml, docs/INDUSTRY_DNA_ROUTER_V1.md]
    forbidden_effects: [direct_assumption_value]

  - unit_id: KNOWLEDGE_PLACEMENT_GATE
    unit_type: gate
    implementation_status: implemented
    stages: [MODULE_REQUIREMENT_PLAN, PRIMARY_EVIDENCE_COLLECTION, EVIDENCE_TO_ASSUMPTION_BRIDGE, HIERARCHICAL_BETA_ESTIMATION, WACC_VALIDATION, HIERARCHICAL_WARRANTED_PER, SCENARIO_BUILD, INTRINSIC_VALUE_FREEZE, STREET_GAP_ANALYZER, MARKET_COMPARE]
    purpose: Decide whether a knowledge layer may be used at a workflow stage and whether a Bridge is required.
    inputs: [knowledge_layer, workflow_stage, field_class, target_company_specific]
    outputs: [placement_decision, bridge_requirement, disposition]
    consumers: [EVIDENCE_LEDGER, ASSUMPTION_COMPILER, STREET_GAP_ANALYZER, MARKET_COMPARE]
    effect_types: [guardrail_effect, evidence_effect]
    final_outputs: [run_validity]
    canonical_refs: [src/valuation_engine/knowledge_placement.py, config/knowledge_placement_policy.yaml, config/workflow_source_injection_map.yaml]
    forbidden_effects: [direct_value_effect]

  - unit_id: SOURCE_WATCH
    unit_type: monitor
    implementation_status: implemented
    stages: [SOURCE_FRESHNESS_PRECHECK, SAVE_STATE]
    purpose: Detect new releases, revisions, definition/schema changes, missed releases, and source failures.
    inputs: [source_registry, source_fingerprints, endpoint_observations]
    outputs: [source_status, dirty_nodes, revalidation_requests]
    consumers: [VALUATION_CONTROL_PLANE, IMPACT_PROPAGATION, PRIMARY_EVIDENCE_COLLECTION]
    effect_types: [evidence_effect, timing_effect, guardrail_effect]
    final_outputs: [revalidation_start_point]
    canonical_refs: [src/valuation_engine/source_watch.py, config/source_watch_registry.yaml, docs/SOURCE_FRESHNESS_OPERATION.md]
    forbidden_effects: [direct_assumption_value]

  - unit_id: PRIMARY_EVIDENCE_COLLECTION
    unit_type: source_adapter
    implementation_status: implemented_collection_core_partial_live_sources
    stages: [PRIMARY_EVIDENCE_COLLECTION]
    purpose: Acquire and index primary/company evidence with provenance, timestamps, hashes, and locators.
    inputs: [company_identity, required_evidence, source_registry, credentials]
    outputs: [raw_source_documents, evidence_candidates, source_fingerprints]
    consumers: [EVIDENCE_LEDGER, INDUSTRY_KNOWLEDGE, SOURCE_WATCH]
    effect_types: [evidence_effect]
    final_outputs: [evidence_coverage]
    canonical_refs: [src/valuation_engine/evidence_collection.py, src/valuation_engine/evidence_adapter.py, src/valuation_engine/dart_facts.py, src/valuation_engine/live_indexers.py, src/valuation_engine/source_index.py, config/industry_source_registry.yaml, config/foundation_source_registry.yaml, docs/LIVE_PRIMARY_READINESS.md]
    forbidden_effects: [interpret_as_assumption, direct_value_effect]

  - unit_id: INDUSTRY_KNOWLEDGE
    unit_type: normalizer
    implementation_status: implemented
    stages: [LOAD_INDUSTRY_KNOWLEDGE_SNAPSHOT, PRIMARY_EVIDENCE_COLLECTION, ROCKET_INSIGHT_SCAN]
    purpose: Store industry facts, definitions, forecasts, mechanisms, leading indicators, and kill conditions without conflating roles.
    inputs: [source_specs, structured_claims, definitions, periods]
    outputs: [validated_claims, mechanism_assessments, definition_conflicts]
    consumers: [INDUSTRY_DNA_ROUTER, MODULE_REQUIREMENT_PLAN, ROCKET_INSIGHT_SCAN, MODULE_PROMOTION]
    effect_types: [evidence_effect, hypothesis_effect]
    final_outputs: [industry_snapshot]
    canonical_refs: [src/valuation_engine/industry_knowledge.py, config/industry_source_registry.yaml, data/industry_seed_claims.yaml]
    forbidden_effects: [direct_company_forecast, direct_assumption_value]

  - unit_id: BROKER_RESEARCH
    unit_type: scanner
    implementation_status: implemented
    stages: [MODULE_REQUIREMENT_PLAN, ROCKET_INSIGHT_SCAN, STREET_REFERENCE_LOAD]
    purpose: Pre-freeze discover industry mechanisms/KPIs/data sources and post-freeze load target-company Street references.
    inputs: [broker_reports, report_types, entitlement, underlying_data_lineage]
    outputs: [mechanism_candidates, kpi_candidates, investor_debates, street_fields_post_freeze]
    consumers: [ROCKET_INSIGHT_SCAN, PRIMARY_EVIDENCE_COLLECTION, STREET_GAP_ANALYZER]
    effect_types: [hypothesis_effect, evidence_effect, reporting_effect]
    final_outputs: [research_questions, street_gap]
    canonical_refs: [src/valuation_engine/broker_research.py, config/broker_research_source_registry.yaml, config/broker_report_type_registry.yaml]
    forbidden_effects: [target_company_forecast_to_intrinsic, target_price_to_assumption]

  - unit_id: SIGNAL_INTELLIGENCE
    unit_type: scanner
    implementation_status: implemented
    stages: [PRIMARY_EVIDENCE_COLLECTION, ROCKET_INSIGHT_SCAN, UPSTREAM_FUNDING_SCAN, SAVE_STATE]
    purpose: Detect leading physical, regulatory, procurement, hiring, patent, credit, logistics, clinical, and remote-sensing signals.
    inputs: [signal_sources, signal_use_policy, industry_dna]
    outputs: [signal_records, verification_requests, project_realization_evidence, timing_candidates]
    consumers: [ROCKET_INSIGHT_SCAN, UPSTREAM_FUNDING_SCAN, EVIDENCE_TO_ASSUMPTION_BRIDGE, SOURCE_WATCH]
    effect_types: [evidence_effect, hypothesis_effect, timing_effect, probability_effect]
    final_outputs: [leading_indicator_state, next_verification_events]
    canonical_refs: [src/valuation_engine/signal_intelligence.py, config/signal_intelligence_registry.yaml, config/signal_use_policy.yaml, docs/SIGNAL_INTELLIGENCE_LAYER_V1.md]
    forbidden_effects: [unverified_signal_to_direct_assumption, positioning_signal_to_intrinsic]

  - unit_id: EVIDENCE_LEDGER
    unit_type: normalizer
    implementation_status: implemented
    stages: [EVIDENCE_LEDGER, EVIDENCE_TO_ASSUMPTION_BRIDGE]
    purpose: Preserve append-only evidence lineage, supersession, freshness, traceability, and conflicts.
    inputs: [evidence_records, source_metadata, supersession_links]
    outputs: [active_evidence_snapshot, traceability_status, stale_findings]
    consumers: [LLM_STAFF, EVIDENCE_TO_ASSUMPTION_BRIDGE, ASSUMPTION_COMPILER, AUDIT_GATE]
    effect_types: [evidence_effect, guardrail_effect]
    final_outputs: [ledger_snapshot_hash, run_validity]
    canonical_refs: [src/valuation_engine/ledger.py, src/valuation_engine/evidence_adapter.py, src/valuation_engine/records.py]
    forbidden_effects: [silent_conflict_deletion]

  - unit_id: ROCKET_INSIGHT_SCAN
    unit_type: scanner
    implementation_status: doctrine_driven
    stages: [ROCKET_INSIGHT_SCAN]
    purpose: Infer money flow, bottlenecks, bottleneck migration, action sequence, chain proof, policy transmission, and P×Q×Mix×Yield implications.
    inputs: [industry_snapshot, evidence_snapshot, signal_records, module_requirement_plan]
    outputs: [hypothesis_candidates, missing_evidence_requests, economic_path_candidates, scanner_reinforcement_requests]
    consumers: [LLM_STAFF, BLIND_RED_TEAM_B, EVIDENCE_TO_ASSUMPTION_BRIDGE]
    effect_types: [hypothesis_effect, evidence_effect]
    final_outputs: [thesis_candidates]
    canonical_refs: [SKILL.md, 01_Rocketesla_Insight_Valuation_Framework.md]
    forbidden_effects: [direct_assumption_commit, direct_value_effect]

  - unit_id: UPSTREAM_FUNDING_SCAN
    unit_type: scanner
    implementation_status: implemented
    stages: [UPSTREAM_FUNDING_SCAN, WACC_VALIDATION]
    purpose: Trace desired demand through buyer cash flow, financing, collateral, terms, spreads, benchmarks, plumbing, and policy backstops.
    inputs: [customer_advances, capex, nwc, debt_terms, credit_spreads, collateral_evidence]
    outputs: [funded_demand_assessment, funding_gap, credit_improvement_candidate, financing_constraints]
    consumers: [EVIDENCE_TO_ASSUMPTION_BRIDGE, WACC_ENGINE, SCENARIO_ENGINE]
    effect_types: [assumption_effect, probability_effect, value_effect, guardrail_effect]
    final_outputs: [funding_risk, intrinsic_value]
    canonical_refs: [src/valuation_engine/funding.py, src/valuation_engine/funding_runtime.py, src/valuation_engine/funding_adapter.py, src/valuation_engine/wacc.py, docs/V04_ROCKETSLA_EXTENSION.md, docs/LIVE_PRIMARY_READINESS.md]
    forbidden_effects: [automatic_wacc_reduction_from_advances]

  - unit_id: LLM_STAFF
    unit_type: llm_role
    implementation_status: implemented_typed_runtime_contract
    stages: [INDUSTRY_DNA_ROUTE, MODULE_REQUIREMENT_PLAN, ROCKET_INSIGHT_SCAN, RESEARCHER_A, BLIND_RED_TEAM_B, EVIDENCE_TO_ASSUMPTION_BRIDGE]
    purpose: Observe, reason, propose, recover, design, and ask; never commit assumptions or authorize stages.
    inputs: [evidence_snapshot, industry_dna, module_requirement_plan, prior_thesis, recovery_context]
    outputs: [routing_proposals, hypotheses, counter_theses, bridge_proposals, recovery_proposals, capability_build_proposals]
    consumers: [VALUATION_CONTROL_PLANE, BLIND_RED_TEAM_B, EVIDENCE_TO_ASSUMPTION_BRIDGE, ASSUMPTION_COMPILER]
    effect_types: [hypothesis_effect, routing_effect, evidence_effect]
    final_outputs: [research_reasoning, build_proposal_ready]
    canonical_refs: [src/valuation_engine/llm_staff.py, src/valuation_engine/llm_adapters.py, docs/CONTROL_PLANE_ARCHITECTURE.md, config/control_plane_stage_registry.yaml, src/valuation_engine/research.py]
    forbidden_effects: [commit_assumption, perform_valuation_math, authorize_stage, issue_freeze_token, mutate_canonical_without_user_approval]

  - unit_id: BLIND_RED_TEAM_B
    unit_type: llm_role
    implementation_status: implemented_contract
    stages: [BLIND_RED_TEAM_B, RESEARCH_LOOP]
    purpose: Attack the leading thesis without Street, market, or intrinsic-value leakage.
    inputs: [evidence_snapshot_without_market, hypotheses]
    outputs: [critical_issues, counter_thesis, missing_evidence]
    consumers: [VALUATION_CONTROL_PLANE, LLM_STAFF, EVIDENCE_TO_ASSUMPTION_BRIDGE, MODULE_PROMOTION]
    effect_types: [hypothesis_effect, guardrail_effect, evidence_effect]
    final_outputs: [thesis_quality, blocked_reasons]
    canonical_refs: [src/valuation_engine/research.py, SKILL.md]
    forbidden_effects: [market_anchoring, direct_assumption_commit]

  - unit_id: EVIDENCE_TO_ASSUMPTION_BRIDGE
    unit_type: bridge
    implementation_status: implemented_typed_runtime_adapter
    stages: [EVIDENCE_TO_ASSUMPTION_BRIDGE]
    purpose: Translate validated evidence and hypotheses into explicit affected-variable proposals with economic-path IDs and kill conditions.
    inputs: [validated_evidence, approved_hypothesis, affected_variable, transform_candidate]
    outputs: [bridge_proposals, economic_path_ids, kill_conditions, verification_events]
    consumers: [ASSUMPTION_COMPILER]
    effect_types: [assumption_effect, probability_effect, timing_effect]
    final_outputs: [assumption_candidates]
    canonical_refs: [src/valuation_engine/llm_staff.py, src/valuation_engine/llm_adapters.py, src/valuation_engine/records.py, src/valuation_engine/ledger.py, docs/GENERIC_ENGINE_DESIGN.md]
    forbidden_effects: [raw_llm_number_as_assumption, policy_price_as_company_asp]

  - unit_id: ASSUMPTION_COMPILER
    unit_type: compiler
    implementation_status: implemented_core
    stages: [EVIDENCE_TO_ASSUMPTION_BRIDGE, SCENARIO_BUILD]
    purpose: Deterministically validate provenance, conflict, unit, period, scope, transforms, scenario completeness, and economic-path uniqueness before committing assumptions.
    inputs: [ledger_snapshot, bridge_proposals, routing_decision, model_specs, prior_assumptions]
    outputs: [compiled_assumption_set, compilation_manifest, blocking_findings]
    consumers: [SCENARIO_ENGINE, HIERARCHICAL_BETA_ENGINE, WACC_ENGINE, DETERMINISTIC_VALUATION, WARRANTED_PER_ENGINE, AUDIT_GATE]
    effect_types: [assumption_effect, guardrail_effect]
    final_outputs: [assumption_set_hash, valuation_blocked]
    canonical_refs: [src/valuation_engine/actual_units.py, src/valuation_engine/assumption_compiler.py, docs/GENERIC_ENGINE_DESIGN.md]
    forbidden_effects: [target_market_price_input, uncontrolled_transform, silent_last_good_reuse]

  - unit_id: SCENARIO_ENGINE
    unit_type: scenario_engine
    implementation_status: implemented_binding_core
    stages: [SCENARIO_BUILD, PROBABILITY_DISTRIBUTION_ANALYSIS]
    purpose: Bind compiled assumptions into coherent scenarios and calibrated distributions without current-price anchoring.
    inputs: [compiled_assumption_set, event_probabilities, correlation_policy]
    outputs: [scenario_set, probability_distribution, scenario_hash]
    consumers: [DETERMINISTIC_VALUATION, DECISION_IMPACT, AUDIT_GATE]
    effect_types: [probability_effect, assumption_effect, value_effect]
    final_outputs: [value_distribution]
    canonical_refs: [src/valuation_engine/scenario_binding.py, src/valuation_engine/shadow_adapters.py, src/valuation_engine/engine.py, docs/LIVE_COMPANY_VALIDATION_AND_CALIBRATION.md]
    forbidden_effects: [price_implied_probability, uncalibrated_precision_as_fact]

  - unit_id: HIERARCHICAL_BETA_ENGINE
    unit_type: risk_engine
    implementation_status: implemented
    stages: [HIERARCHICAL_BETA_ESTIMATION]
    purpose: Estimate target beta from hierarchical broad-sector→industry→risk-driver→economic-twin evidence.
    inputs: [peer_returns, capital_structure, economic_twin_set, calibration_reference]
    outputs: [bottom_up_beta, beta_uncertainty, peer_pool_trace]
    consumers: [WACC_ENGINE]
    effect_types: [assumption_effect, value_effect]
    final_outputs: [cost_of_equity_input, intrinsic_value]
    canonical_refs: [src/valuation_engine/risk.py, docs/V04_ROCKETSLA_EXTENSION.md]
    forbidden_effects: [copy_sector_beta, price_target_tuned_beta]

  - unit_id: WACC_ENGINE
    unit_type: risk_engine
    implementation_status: implemented
    stages: [WACC_VALIDATION]
    purpose: Compute currency-consistent cost of equity/debt and WACC with structural-credit evidence gates.
    inputs: [risk_free_rate, beta, equity_risk_premium, marginal_cost_of_debt, tax_rate, target_capital_structure, customer_advance_credit_evidence]
    outputs: [cost_of_equity, after_tax_cost_of_debt, wacc, terminal_consistency]
    consumers: [DETERMINISTIC_VALUATION, WARRANTED_PER_ENGINE, AUDIT_GATE]
    effect_types: [assumption_effect, value_effect, guardrail_effect]
    final_outputs: [intrinsic_value]
    canonical_refs: [src/valuation_engine/wacc.py, docs/V04_ROCKETSLA_EXTENSION.md]
    forbidden_effects: [generic_size_premium, historical_interest_expense_as_marginal_debt_cost]

  - unit_id: DETERMINISTIC_VALUATION
    unit_type: valuation_engine
    implementation_status: implemented_shadow_stage_with_initial_evaluator
    stages: [DETERMINISTIC_VALUATION]
    purpose: Apply exact industry/evaluator formulas to compiled assumptions only.
    inputs: [compiled_assumption_set, evaluator_key, valuation_context]
    outputs: [segment_valuations, enterprise_or_equity_values, component_traces]
    consumers: [SOTP_AGGREGATOR, AUDIT_GATE, DECISION_IMPACT]
    effect_types: [value_effect]
    final_outputs: [intrinsic_value_components]
    canonical_refs: [src/valuation_engine/evaluator_registry.py, src/valuation_engine/valuation_execution.py, src/valuation_engine/valuation_adapter.py, src/valuation_engine/engine.py, docs/GENERIC_ENGINE_DESIGN.md]
    forbidden_effects: [network_access, evidence_interpretation, current_price_access, unknown_model_generic_fallback]

  - unit_id: WARRANTED_PER_ENGINE
    unit_type: valuation_engine
    implementation_status: implemented
    stages: [HIERARCHICAL_WARRANTED_PER, DCF_PER_ASSUMPTION_CONSISTENCY_GATE]
    purpose: Compute Core Fundamental, Expansion-Adjusted, and Market-Realization warranted PER using the same economic assumptions as DCF.
    inputs: [normalized_forward_eps, growth_path, fcfe_conversion, cost_of_equity, terminal_growth, terminal_roe, peer_residuals]
    outputs: [core_fundamental_per, expansion_adjusted_per, market_realization_per, assumption_consistency_status]
    consumers: [AUDIT_GATE, FINAL_REPORT]
    effect_types: [value_effect, method_effect, guardrail_effect]
    final_outputs: [cross_method_value_reference]
    canonical_refs: [src/valuation_engine/per.py, docs/V04_ROCKETSLA_EXTENSION.md]
    forbidden_effects: [broker_eps_pre_freeze, average_multiple_blending, dcf_per_assumption_mismatch]

  - unit_id: SOTP_AGGREGATOR
    unit_type: aggregator
    implementation_status: implemented_core
    stages: [DETERMINISTIC_VALUATION]
    purpose: Combine segment values, ownership, parent assets/claims, and EV→Equity bridges once without overlap.
    inputs: [segment_valuations, ownership, segment_debt, parent_assets, parent_claims]
    outputs: [company_equity_value, aggregation_trace]
    consumers: [AUDIT_GATE, DECISION_IMPACT]
    effect_types: [value_effect, guardrail_effect]
    final_outputs: [intrinsic_value]
    canonical_refs: [src/valuation_engine/sotp.py, docs/GENERIC_ENGINE_DESIGN.md, src/valuation_engine/engine.py]
    forbidden_effects: [double_debt_deduction, duplicate_nci, duplicate_asset_id]

  - unit_id: DECISION_IMPACT
    unit_type: learning
    implementation_status: implemented
    stages: [AUDIT_GATE, SAVE_STATE]
    purpose: Compare baseline vs counterfactual module runs and measure value, decision, timing, method, assumption, and guardrail impact versus research effort.
    inputs: [baseline_outcome, counterfactual_outcome, module_impact_trace, research_effort]
    outputs: [module_impact_assessment, sensitivity_assessment, research_intensity_recommendation]
    consumers: [VALUATION_CONTROL_PLANE, STATE_LEARNING, MODULE_REQUIREMENT_PLAN]
    effect_types: [reporting_effect, routing_effect]
    final_outputs: [research_priority, retire_candidate, keep_guardrail]
    canonical_refs: [src/valuation_engine/decision_impact.py, src/valuation_engine/ablation.py, config/decision_impact_policy.yaml, docs/DECISION_IMPACT_SENSITIVITY.md]
    forbidden_effects: [automatic_canonical_deletion]

  - unit_id: IMPACT_PROPAGATION
    unit_type: learning
    implementation_status: implemented
    stages: [SOURCE_FRESHNESS_PRECHECK, SAVE_STATE]
    purpose: Propagate dirty source/definition/mechanism nodes to affected assumptions, segments, and revalidation start points.
    inputs: [dirty_nodes, impact_graph]
    outputs: [affected_nodes, revalidation_scope]
    consumers: [VALUATION_CONTROL_PLANE, SOURCE_WATCH]
    effect_types: [routing_effect, timing_effect]
    final_outputs: [delta_revalidation_plan]
    canonical_refs: [src/valuation_engine/impact_propagation.py, config/impact_graph_seed.yaml]
    forbidden_effects: [silent_intrinsic_mutation]

  - unit_id: AUDIT_GATE
    unit_type: audit
    implementation_status: implemented_generic_and_legacy
    stages: [DCF_PER_ASSUMPTION_CONSISTENCY_GATE, CROSS_METHOD_DOUBLE_COUNT_AUDIT, AUDIT_GATE]
    purpose: Independently validate price isolation, probability integrity, sensitivity direction, traceability, duplicate paths, and valuation consistency.
    inputs: [compiled_assumptions, valuation_outputs, method_outputs, traceability, doctrine_coverage]
    outputs: [audit_findings, audit_pass, blocking_reasons, audit_hash]
    consumers: [INTRINSIC_FREEZE, VALUATION_CONTROL_PLANE, DECISION_IMPACT]
    effect_types: [guardrail_effect, value_effect]
    final_outputs: [run_validity, freeze_eligibility]
    canonical_refs: [src/valuation_engine/generic_audit.py, src/valuation_engine/audit_adapter.py, src/valuation_engine/audit.py, SKILL.md]
    forbidden_effects: [override_failure_without_new_run]

  - unit_id: INTRINSIC_FREEZE
    unit_type: gate
    implementation_status: implemented_contract
    stages: [INTRINSIC_VALUE_FREEZE]
    purpose: Seal intrinsic value and all upstream hashes before any target-company Street or current-price access.
    inputs: [audit_pass, doctrine_coverage_complete, assumption_set_hash, valuation_hash, source_snapshot_hash, industry_snapshot_hash]
    outputs: [intrinsic_freeze_token, frozen_intrinsic_value]
    consumers: [STREET_REFERENCE_LOAD, STREET_GAP_ANALYZER, MARKET_PRICE_LOAD, MARKET_COMPARE]
    effect_types: [guardrail_effect, reporting_effect]
    final_outputs: [frozen_intrinsic_value]
    canonical_refs: [src/valuation_engine/control_plane.py, config/control_plane_stage_registry.yaml]
    forbidden_effects: [market_reference_at_freeze, mutate_frozen_intrinsic_same_run]

  - unit_id: STREET_GAP_ANALYZER
    unit_type: market_layer
    implementation_status: implemented_generic_post_freeze
    stages: [STREET_REFERENCE_LOAD, STREET_GAP_ANALYZER]
    purpose: Compare frozen intrinsic assumptions/value with broker forecasts, targets, and valuation policies only after freeze.
    inputs: [intrinsic_freeze_token, frozen_intrinsic_value, street_reports, gap_drivers]
    outputs: [street_consensus, gap_analysis, explained_gap, unexplained_gap]
    consumers: [FINAL_REPORT, STATE_LEARNING]
    effect_types: [reporting_effect]
    final_outputs: [street_gap]
    canonical_refs: [src/valuation_engine/post_freeze.py, src/valuation_engine/post_freeze_adapters.py, src/valuation_engine/street.py, src/valuation_engine/broker_research.py, docs/POST_FREEZE_RUNTIME.md]
    forbidden_effects: [same_run_intrinsic_mutation]

  - unit_id: MARKET_COMPARE
    unit_type: market_layer
    implementation_status: implemented_generic_and_legacy
    stages: [MARKET_PRICE_LOAD, MARKET_COMPARE]
    purpose: Compare frozen intrinsic value/distribution with current market price and derive post-freeze expectations.
    inputs: [intrinsic_freeze_token, frozen_intrinsic_value, current_market_price]
    outputs: [market_gap, expected_return, reverse_dcf_context]
    consumers: [FINAL_REPORT, STATE_LEARNING]
    effect_types: [reporting_effect]
    final_outputs: [market_comparison]
    canonical_refs: [src/valuation_engine/post_freeze.py, src/valuation_engine/post_freeze_adapters.py, src/valuation_engine/engine.py, references/methods/reverse-dcf.md, docs/POST_FREEZE_RUNTIME.md]
    forbidden_effects: [price_to_assumption, price_to_scenario_weight]

  - unit_id: STATE_LEARNING
    unit_type: learning
    implementation_status: implemented_generic_state_core
    stages: [THESIS_DELTA, SAVE_STATE]
    purpose: Persist immutable runs, thesis deltas, module impact histories, kill conditions, next verification events, and last-good state.
    inputs: [run_result, thesis_delta, impact_assessments, source_changes, probability_forecasts]
    outputs: [immutable_run_record, last_good_pointer, learning_history, next_verification_events]
    consumers: [VALUATION_CONTROL_PLANE, DECISION_IMPACT, SOURCE_WATCH, MODULE_PROMOTION]
    effect_types: [routing_effect, reporting_effect]
    final_outputs: [future_research_priority, delta_revalidation_context]
    canonical_refs: [src/valuation_engine/state.py, src/valuation_engine/generic_reporting.py, docs/LIVE_COMPANY_VALIDATION_AND_CALIBRATION.md, docs/POST_FREEZE_RUNTIME.md]
    forbidden_effects: [mutate_prior_run]

  - unit_id: MODULE_PROMOTION
    unit_type: governance
    implementation_status: implemented
    stages: [SAVE_STATE]
    purpose: Promote a mechanism or module to canonical status only after evidence, Red Team, regression, and explicit approval.
    inputs: [mechanism_assessment, approval_record, regression_status, red_team_status]
    outputs: [compiled_industry_rule]
    consumers: [DOCTRINE_CONSTITUTION, MODULE_REQUIREMENT_PLAN]
    effect_types: [routing_effect, guardrail_effect]
    final_outputs: [canonical_knowledge_update]
    canonical_refs: [src/valuation_engine/module_promotion.py, data/mechanism_candidates.yaml]
    forbidden_effects: [auto_promotion_from_ingestion, promotion_without_approval]

  - unit_id: FINAL_REPORT
    unit_type: reporter
    implementation_status: implemented_generic_reporter
    stages: [FINAL_REPORT]
    purpose: Present frozen intrinsic results, assumptions, uncertainty, Street/market comparison, unresolved gaps, and impact/efficiency notes without mixing layers.
    inputs: [frozen_intrinsic_value, valuation_components, doctrine_coverage, street_gap, market_comparison, impact_assessments]
    outputs: [final_report]
    consumers: [USER]
    effect_types: [reporting_effect]
    final_outputs: [user_decision_support]
    canonical_refs: [src/valuation_engine/generic_reporting.py, docs/POST_FREEZE_RUNTIME.md, SKILL.md]
    forbidden_effects: [temporary_number_as_final, unvalued_option_as_zero, hidden_blocker]
