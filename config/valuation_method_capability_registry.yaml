version: 1.0
purpose: Classify every valuation method exposed by Industry DNA by execution role and runtime family. Runtime status is derived from execution_family; it is not a manually editable readiness label.
method_kinds:
  - segment_evaluator
  - cross_method_engine
  - aggregator
execution_families:
  - normalized_multiple
  - explicit_fcff_dcf
  - finite_life_npv
  - calibrated_single_event_rnpv
  - warranted_per
  - sotp
  - not_implemented
methods:
