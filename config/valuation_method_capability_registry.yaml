version: 1.2
purpose: Classify each exact Industry DNA archetype/method binding by execution role and runtime family. Archetype permission remains authoritative in archetype_module_registry.yaml; this registry owns execution metadata only.
execution_families:
  normalized_multiple:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: false
    requires_wacc: false
    canonical_refs: [src/valuation_engine/evaluator_registry.py, src/valuation_engine/valuation_execution.py, tests/test_generic_evaluator_sotp.py]
  normalized_ebitda_multiple:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: false
    requires_wacc: false
    canonical_refs: [src/valuation_engine/equity_evaluators.py, tests/test_equity_evaluators.py]
  contracted_backlog_dcf:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: true
    requires_wacc: true
    canonical_refs:
    - src/valuation_engine/backlog_evaluators.py
    - docs/CONTRACTED_BACKLOG_DCF.md
    - tests/test_backlog_evaluators.py
  explicit_fcff_dcf:
    kind: segment_evaluator
    runtime_status: PARTIAL_RUNTIME
    requires_beta: true
    requires_wacc: true
    canonical_refs: [src/valuation_engine/dcf_evaluators.py, docs/EXPLICIT_FCFF_DCF_EVALUATORS.md, tests/test_explicit_fcff_dcf_evaluators.py]
  finite_life_npv:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: true
    requires_wacc: true
    canonical_refs: [src/valuation_engine/finite_life_evaluators.py, docs/FINITE_LIFE_NPV_EVALUATORS.md, tests/test_finite_life_npv_evaluators.py]
  calibrated_single_event_rnpv:
    kind: segment_evaluator
    runtime_status: PARTIAL_RUNTIME
    requires_beta: true
    requires_wacc: true
    canonical_refs: [src/valuation_engine/rnpv_evaluator.py, docs/CALIBRATED_RNPV_EVALUATOR.md, tests/test_calibrated_rnpv_evaluator.py]
  gordon_ddm:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: true
    requires_wacc: true
    canonical_refs: [src/valuation_engine/equity_evaluators.py, docs/GENERIC_ENGINE_DESIGN.md, tests/test_equity_evaluators.py]
  rate_base_roe:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: true
    requires_wacc: true
    canonical_refs: [src/valuation_engine/equity_evaluators.py, tests/test_equity_evaluators.py]
  ffo_multiple:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: false
    requires_wacc: false
    canonical_refs: [src/valuation_engine/equity_evaluators.py, tests/test_equity_evaluators.py]
  net_asset_value:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: false
    requires_wacc: false
    canonical_refs: [src/valuation_engine/equity_evaluators.py, tests/test_equity_evaluators.py]
  justified_pb_roe:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: true
    requires_wacc: true
    canonical_refs: [src/valuation_engine/equity_evaluators.py, tests/test_equity_evaluators.py]
  residual_income:
    kind: segment_evaluator
    runtime_status: RUNTIME_READY
    requires_beta: true
    requires_wacc: true
    canonical_refs: [src/valuation_engine/equity_evaluators.py, docs/GENERIC_ENGINE_DESIGN.md, tests/test_equity_evaluators.py]
  warranted_per:
    kind: cross_method_engine
    runtime_status: RUNTIME_READY
    requires_beta: true
    requires_wacc: true
    stage: HIERARCHICAL_WARRANTED_PER
    canonical_refs: [src/valuation_engine/per.py, src/valuation_engine/per_adapters.py, tests/test_live_warranted_per_adapter.py]
  sotp:
    kind: aggregator
    runtime_status: RUNTIME_READY
    requires_beta: false
    requires_wacc: false
    stage: DETERMINISTIC_VALUATION
    canonical_refs: [src/valuation_engine/sotp.py, src/valuation_engine/valuation_execution.py, tests/test_generic_evaluator_sotp.py]

bindings:
  contracted_backlog:
    backlog_burn_dcf:
      execution_family: contracted_backlog_dcf
      output_kind: enterprise_value
    normalized_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    normalized_ebitda: {execution_family: normalized_ebitda_multiple, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
  capacity_manufacturing:
    driver_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
  recurring_subscription:
    arr_fcf_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
  metered_usage_network:
    usage_driver_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
  transaction_marketplace:
    gmv_take_rate_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
  advertising_attention:
    attention_monetization_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
  ip_royalty_licensing:
    royalty_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
  hit_driven_content:
    cohort_npv: {execution_family: finite_life_npv, output_kind: enterprise_value}
    pipeline_option_sotp: {execution_family: sotp, output_kind: aggregation}
  commodity_price_taker:
    midcycle_price_volume_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    normalized_multiple: {execution_family: normalized_multiple, output_kind: enterprise_value}
  process_spread:
    midcycle_spread_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    normalized_multiple: {execution_family: normalized_multiple, output_kind: enterprise_value}
  regulated_rate_base:
    ddm: {execution_family: gordon_ddm, output_kind: equity_value}
    rate_base_roe: {execution_family: rate_base_roe, output_kind: equity_value}
    regulated_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
  asset_yield_nav:
    ddm: {execution_family: gordon_ddm, output_kind: equity_value}
    ffo_multiple: {execution_family: ffo_multiple, output_kind: equity_value}
    nav: {execution_family: net_asset_value, output_kind: equity_value}
  financial_balance_sheet:
    ddm: {execution_family: gordon_ddm, output_kind: equity_value}
    pb_roe: {execution_family: justified_pb_roe, output_kind: equity_value}
    residual_income: {execution_family: residual_income, output_kind: equity_value}
  probabilistic_pipeline:
    rnpv: {execution_family: calibrated_single_event_rnpv, output_kind: enterprise_value}
  reserve_depletion:
    nav: {execution_family: net_asset_value, output_kind: equity_value}
    reserve_npv: {execution_family: finite_life_npv, output_kind: enterprise_value}
  consumer_unit_economics:
    unit_economics_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
  project_finance:
    project_npv: {execution_family: finite_life_npv, output_kind: enterprise_value}
    sotp: {execution_family: sotp, output_kind: aggregation}
  design_led_product:
    product_driver_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
  aum_fee_economics:
    aum_fee_dcf: {execution_family: explicit_fcff_dcf, output_kind: enterprise_value}
    warranted_per: {execution_family: warranted_per, output_kind: cross_method_reference}
