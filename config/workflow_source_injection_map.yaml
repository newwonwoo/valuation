version: 1.0
stages:
  foundation_load:
    required_layers: [classification_standard, metric_standard, provenance_standard]
    support_layers: [structural_supply_chain_prior]
    prohibited_layers: [market_reference]
    outputs: [taxonomy_crosswalk, metric_ontology, provenance_policy, structural_topology_snapshot]

  industry_dna_route:
    required_layers: [classification_standard]
    support_layers: [structural_supply_chain_prior, public_industry_research, broker_research]
    prohibited_uses: [target_company_forecast, target_price, rating, target_multiple, consensus, current_market_price]
    outputs: [segment_labels, archetype_candidates, sector_adapter_candidates, routing_evidence_plan]

  module_requirement_plan:
    required_layers: [metric_standard]
    support_layers: [public_industry_research, broker_research]
    prohibited_uses: [target_company_forecast, target_price, rating, target_multiple, consensus]
    outputs: [required_kpis, leading_indicator_candidates, beta_twin_features, per_twin_features, kill_condition_candidates, forbidden_methods]

  primary_evidence_collection:
    required_layers: [primary_observed, company_primary]
    support_layers: []
    outputs: [realized_industry_state, target_company_facts, company_plans_as_plans]

  mechanism_validation:
    required_layers: [primary_observed]
    support_layers: [structural_supply_chain_prior, public_industry_research, broker_research, alternative_data, company_primary]
    outputs: [corroborated_mechanisms, contradictory_evidence, verification_requests, representativeness_assessments]

  upstream_funding_scan:
    required_layers: [primary_observed, company_primary]
    support_layers: [structural_supply_chain_prior, public_industry_research]
    prohibited_uses: [broker_target_price, target_multiple]
    outputs: [funding_ladder, collateral_state, financing_availability, quantity_timing_constraints]

  evidence_to_assumption_bridge:
    required_layers: [primary_observed, company_primary]
    support_layers: []
    prohibited_layers: [classification_standard, metric_standard, provenance_standard, structural_supply_chain_prior, broker_research, alternative_data, calibration_reference, market_reference]
    outputs: [compiled_assumption_candidates]

  hierarchical_beta_estimation:
    required_layers: [company_primary]
    support_layers: [calibration_reference]
    prohibited_uses: [copy_sector_beta_to_target, broker_target_beta]
    outputs: [hierarchical_bottom_up_beta, peer_stability_audit]

  wacc_validation:
    required_layers: [company_primary, primary_observed]
    support_layers: [calibration_reference]
    prohibited_uses: [generic_small_cap_plug, broker_target_wacc]
    outputs: [cost_of_equity, marginal_cost_of_debt, target_capital_structure, wacc_distribution]

  hierarchical_warranted_per:
    required_layers: [company_primary]
    support_layers: [calibration_reference]
    prohibited_uses: [broker_target_per_pre_freeze, current_market_price, target_price]
    outputs: [core_fundamental_per, expansion_adjusted_per, residual_peer_premium]

  scenario_build:
    required_layers: [primary_observed, company_primary]
    support_layers: [public_industry_research]
    prohibited_uses: [target_company_broker_forecast, target_price, rating, current_market_price]
    outputs: [scenario_worldviews, assumption_ranges, kill_conditions]

  probability_distribution_analysis:
    required_layers: [primary_observed, company_primary]
    support_layers: [public_industry_research, alternative_data]
    prohibited_uses: [target_price, current_market_price]
    outputs: [variable_distributions, correlations, event_probabilities]

  intrinsic_value_freeze:
    required_layers: []
    support_layers: []
    prohibited_layers: [market_reference]
    outputs: [frozen_intrinsic_value, run_hash]

  street_gap:
    required_layers: [broker_research, market_reference]
    support_layers: [company_primary]
    outputs: [street_model_reproduction, consensus_gap_bridge, consensus_lag_check]

  market_compare:
    required_layers: [market_reference]
    support_layers: []
    outputs: [price_vs_intrinsic, valuation_gap]

  monitoring:
    required_layers: [primary_observed]
    support_layers: [public_industry_research, broker_research, alternative_data, structural_supply_chain_prior]
    outputs: [dirty_nodes, update_diff, revalidation_requests]
