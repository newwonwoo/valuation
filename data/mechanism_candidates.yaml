  - CL_NERC_LTRA_03
  leading_indicators:
  - interconnection queue GW
  - transformer lead time
  - grid capex
  - equipment order backlog
  - qualified capacity
  valuation_links:
  - quantity/backlog conversion
  - ASP/pricing power
  - capacity expansion
  - customer advances
  - margin
  kill_conditions:
  - lead times normalize rapidly
  - queue reforms release capacity without new hardware demand
  - new manufacturing capacity outruns demand
