<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">고정 원자재 기업 투자 결론과 가치평가</title>
<desc id="desc">회사 강점, 시나리오 가치, 현재가 및 매수 검토 기준을 요약한 한국어 카드</desc>
<style>
text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
</style>
<rect x="0" y="0" width="1200" height="1500" rx="0" fill="#F3F0E8"/>
<rect x="0" y="0" width="1200" height="250" rx="0" fill="#102D3E"/>
<text x="70" y="70" font-size="24" font-weight="700" fill="#FFCB77" text-anchor="start">PRISM 최종보고서 · 1/2</text>
<text x="70" y="145" font-size="54" font-weight="800" fill="#FFFFFF" text-anchor="start">고정 원자재 기업</text>
<text x="70" y="202" font-size="30" font-weight="500" fill="#D9E7EC" text-anchor="start">회사 강점 · 투자 결론 · 가치평가</text>
<text x="70" y="295" font-size="24" font-weight="800" fill="#167C72" text-anchor="start">인공지능 연결 인사이트 · 가치평가 계산 비관여</text>
<text x="70" y="345" font-size="24" font-weight="800" fill="#E26643" text-anchor="start">연결 판단</text>
<text x="230" y="345" font-size="23" font-weight="400" fill="#344B5A" text-anchor="start">이번 실행에서는 환경 변화와 기업 강점의 별도 연결 인사이트가 적용되지 않았습니다.</text>
<text x="70" y="415" font-size="24" font-weight="800" fill="#E26643" text-anchor="start">검증 범위</text>
<text x="230" y="415" font-size="23" font-weight="400" fill="#344B5A" text-anchor="start">이 고정 인수시험 데이터는 결정론적 실행 무결성을 검증하며 외부 환경 변화에 관한 투자논지를</text>
<text x="230" y="450" font-size="23" font-weight="400" fill="#344B5A" text-anchor="start">주장하지 않습니다.</text>
<text x="70" y="650" font-size="32" font-weight="800" fill="#102D3E" text-anchor="start">결정론적 가치평가 결과</text>
<text x="1090" y="650" font-size="20" font-weight="400" fill="#607582" text-anchor="end">확률가중 전 개별 시나리오</text>
<rect x="70" y="685" width="320" height="150" rx="20" fill="#FFFFFF"/>
<text x="94" y="733" font-size="22" font-weight="700" fill="#607582" text-anchor="start">기준 (Base)</text>
<text x="94" y="793" font-size="34" font-weight="800" fill="#102D3E" text-anchor="start">70,000원</text>
<rect x="70" y="885" width="1060" height="170" rx="24" fill="#DDEAE7"/>
<text x="105" y="937" font-size="24" font-weight="800" fill="#167C72" text-anchor="start">현재가</text>
<text x="105" y="997" font-size="38" font-weight="800" fill="#102D3E" text-anchor="start">65,000원</text>
<text x="1095" y="997" font-size="21" font-weight="400" fill="#607582" text-anchor="end">기준일 2026-08-23</text>
<text x="70" y="1105" font-size="30" font-weight="800" fill="#102D3E" text-anchor="start">매수 검토 기준</text>
<rect x="70" y="1133" width="1060" height="145" rx="22" fill="#FFF4DE"/>
<text x="105" y="1183" font-size="24" font-weight="600" fill="#6D4B1F" text-anchor="start">실제 해결 이력 기반 확률 보정이 완료되지 않았습니다. 따라서 특정 매수가는 만들지 않고 현재가는</text>
<text x="105" y="1221" font-size="24" font-weight="600" fill="#6D4B1F" text-anchor="start">참고값으로만 표시합니다.</text>
<rect x="0" y="1370" width="1200" height="130" rx="0" fill="#102D3E"/>
<text x="70" y="1415" font-size="22" font-weight="700" fill="#D9E7EC" text-anchor="start">출처</text>
<text x="140" y="1415" font-size="20" font-weight="400" fill="#D9E7EC" text-anchor="start">모든 수치의 원문 주소는 보고서 본문 ‘정보 출처’에서 직접 검증할 수 있습니다.</text>
