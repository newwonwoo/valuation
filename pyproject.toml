[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-valuation-engine"
version = "0.3.0a1"
description = "Evidence-first, probability-weighted equity valuation engine for ChatGPT/Codex workflows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8.0", "setuptools>=70", "mcp>=2,<3"]

[project.scripts]
valuation-engine = "valuation_engine.cli:main"
prism-mcp = "valuation_engine.mcp_server:main"
prism-tunnel = "valuation_engine.tunnel_launcher:main"

[tool.setuptools]
packages = ["valuation_engine", "valuation_engine._registry_data"]
package-dir = {valuation_engine = "src/valuation_engine", "valuation_engine._registry_data" = "config"}

[tool.setuptools.package-data]
"valuation_engine._registry_data" = ["*.yaml", "industry_series_snapshots/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
