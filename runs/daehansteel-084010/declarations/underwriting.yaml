target_id: KR:DART:00113225
as_of: '2026-08-29'
source_ref: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260318000780
declarations:
  steel_fcff_year_1:
    value: 8
    unit: KRW_billion
    rationale: 'recovery-year FCFF: FY2025 consolidated operating loss -2.9bn turns
      as the filed H1-2026 rebar-scrap spread widens (ASP 823 vs scrap 480 thousand
      KRW/ton, against 793/407 in FY2025); capex held near depreciation, so FCFF
      tracks EBIT ramp off the trough.'
    segment: steel
  steel_fcff_year_2:
    value: 20
    unit: KRW_billion
    rationale: second-year normalization - annualized rolled volume ~1,412kt (filed
      H1-2026 production 706kt) at a mid-30s thousand-KRW/ton cash spread after
      conversion; YK Steel rolling utilization recovering from the filed 49%.
    segment: steel
  steel_fcff_year_3:
    value: 30
    unit: KRW_billion
    rationale: mid-cycle approach - volume steady near 1,400kt and spread at the
      midpoint of the filed 2024-H1/2026 range; FY2024 filed operating income 10.3bn
      marks the lower half of the path.
    segment: steel
  steel_fcff_year_4:
    value: 38
    unit: KRW_billion
    rationale: near mid-cycle FCFF for the combined 대한제강+YK 2,400kt/yr rolling footprint
      at the declared benchmark spread; working-capital drag assumed neutral across
      the cycle.
    segment: steel
  steel_fcff_year_5:
    value: 42
    unit: KRW_billion
    rationale: mid-cycle FCFF plateau - EBIT margin ~3.5% on ~1.25조 revenue (FY2025
      filed revenue 1,247.1bn), consistent with a through-cycle rebar mill and capex
      at maintenance level.
    segment: steel
  down_steel_fcff_year_1:
    value: -5
    unit: KRW_billion
    rationale: structural-downside first year - construction starts stay at trough,
      the FY2025 filed operating loss (-2.9bn) persists and working capital absorbs
      cash.
    segment: steel
  down_steel_fcff_year_2:
    value: 0
    unit: KRW_billion
    rationale: downside stabilization at breakeven; spread stays near the FY2025
      filed level (ASP 793 vs scrap 407) with no volume recovery.
    segment: steel
  down_steel_fcff_year_3:
    value: 5
    unit: KRW_billion
    rationale: shallow downside recovery - cost actions only; volume flat at the
      filed H1-2026 run-rate.
    segment: steel
  down_steel_fcff_year_4:
    value: 8
    unit: KRW_billion
    rationale: downside plateau - structurally lower domestic rebar demand caps
      FCFF near 1% of filed revenue.
    segment: steel
  down_steel_fcff_year_5:
    value: 10
    unit: KRW_billion
    rationale: downside terminal-entry FCFF - re-based demand, maintenance capex
      only; the downside terminal is priced at zero growth on this level.
    segment: steel
  bull_steel_fcff_year_1:
    value: 20
    unit: KRW_billion
    rationale: cycle-recovery first year - the filed H1-2026 spread (823-480 thousand
      KRW/ton) holds for the full year and YK rolling utilization lifts from the
      filed 49% toward 70%.
    segment: steel
  bull_steel_fcff_year_2:
    value: 38
    unit: KRW_billion
    rationale: recovery compounding - combined rolling utilization toward 75% on
      the filed 2,400kt/yr capacity with the H1-2026 spread sustained.
    segment: steel
  bull_steel_fcff_year_3:
    value: 52
    unit: KRW_billion
    rationale: upper-cycle FCFF - volume ~1,700kt and spread modestly above the
      H1-2026 filed level as construction demand normalizes.
    segment: steel
  bull_steel_fcff_year_4:
    value: 60
    unit: KRW_billion
    rationale: upper-cycle plateau approaching the FY2024 filed revenue base (1,224.5bn)
      with mid-single-digit EBIT margin.
    segment: steel
  bull_steel_fcff_year_5:
    value: 65
    unit: KRW_billion
    rationale: bull terminal-entry FCFF - ~5% EBIT margin on recovered volume, capex
      at maintenance; consistent with the bull terminal growth 0.5%.
    segment: steel
  steel_terminal_growth:
    value: 0.0
    unit: ratio
    rationale: flat long-run domestic rebar demand - housing starts structurally
      sideways; no real growth priced beyond the explicit path.
    segment: steel
  down_steel_terminal_growth:
    value: 0.0
    unit: ratio
    rationale: structural downside carried entirely in the lower FCFF plateau (10bn);
      terminal growth held at zero because the evaluator prices reinvestment as
      g/ROIC and refuses a negative rate - shrinkage is expressed as level, not
      drift.
    segment: steel
  bull_steel_terminal_growth:
    value: 0.005
    unit: ratio
    rationale: mild positive terminal drift if rebuilding/remodeling demand offsets
      new-start weakness.
    segment: steel
  steel_terminal_roic:
    value: 0.06
    unit: ratio
    rationale: through-cycle ROIC judgment for a two-company EAF rebar group near
      its cost of capital; reinvestment at terminal is priced at this return.
    segment: steel
  steel_ownership:
    value: 0.8603
    unit: ratio
    rationale: owners' share of consolidated equity per the FY2025 CFS - 지배기업 소유지분
      800,329,287,154 / 자본총계 930,326,319,901 = 0.8603 (비지배지분 129,997,032,747, 와이케이스틸
      소수주주); consolidated FCFF attributed proportionally - a declared simplification.
    segment: steel
  steel_ev_adjustment:
    value: 119
    unit: KRW_billion
    rationale: 'net cash added back to EV: FY2025 CFS cash and equivalents 161,316,171,568
      less total borrowings and bonds 42,284,251,597 (단기차입 20.4bn + 유동성 사채·장기차입
      2.6bn + 비유동 사채·장기차입 19.3bn) = +119.0bn.'
    segment: steel
  diluted_shares:
    value: 34371596
    unit: shares
    rationale: issued shares from the H1-2026 filing's 주식의 총수 table as of 2026-06-30
      (36,103,933 issued less 1,732,337 retired); treasury 5,537,674 not deducted
      - conservative per-share basis.
    segment: steel
  cash_cost:
    value: 740000
    unit: KRW_per_ton
    rationale: implied scrap-plus-conversion cash cost consistent with the filed
      H1-2026 scrap purchase price 480 thousand KRW/ton (대한제강 표) plus EAF conversion
      judgment ~260 thousand KRW/ton.
    segment: steel
  benchmark_price:
    value: 820000
    unit: KRW_per_ton
    rationale: domestic rebar distribution price level consistent with the company's
      own filed realized-price series 863 (2024) / 793 (2025) / 823 (H1-26) thousand
      KRW/ton; benchmark held near the filed trajectory pending a verified industry
      series.
    segment: steel
  inventory:
  - value: 197
    unit: KRW_billion
    rationale: FY2025 consolidated inventories 197,470,153,951 KRW (ifrs-full_Inventories)
      from the filed full financial statement.
    segment: steel
  - value: 0.5
    unit: KRW_billion
    segment: transport
    rationale: 운송업 특성상 재고는 소모품·연료 수준 - 부문 자산 50.5십억(주석) 대비 미미하다는 판단.
  capacity:
    value: 2400000
    unit: tons_per_year
    rationale: 'annualized rolling capacity from the H1-2026 filing''s own capacity
      table: 대한제강 775kt + 와이케이스틸 425kt per half-year, x2.'
    segment: steel
  production:
    value: 1412000
    unit: tons_per_year
    rationale: 'annualized rolling run-rate from the H1-2026 filed production table:
      대한제강 496kt + 와이케이스틸 210kt in the half-year, x2.'
    segment: steel
  input_price:
  - value: 480000
    unit: KRW_per_ton
    rationale: domestic scrap purchase price 480 thousand KRW/ton from the H1-2026
      filing's own raw-material price table (대한제강; YK 478), declared as the input-price
      level pending a verified industry scrap series.
    segment: steel
  - value: 650
    unit: KRW_per_unit
    segment: transport
    rationale: 운송부문 톤당 투입원가(연료·인건비) 판단 - H1-26 부문 영업이익률 0.1%대와 정합하는 수준 (주석 20260814003201_45.xml).
  output_price:
  - value: 823000
    unit: KRW_per_ton
    rationale: rebar output price level set to the company's filed H1-2026 average
      selling price 823 thousand KRW/ton, declared pending a verified industry rebar
      series.
    segment: steel
  - value: 655
    unit: KRW_per_unit
    segment: transport
    rationale: 운송부문 톤·km당 운임 수준 판단 - 연환산 매출 ~37십억과 물동량 판단치의 비율.
  product_yield:
  - value: 0.9
    unit: ratio
    rationale: EAF billet-to-rebar overall yield judgment for the group's mills;
      no yield KPI is disclosed in the filing.
    segment: steel
  - value: 0.95
    unit: ratio
    segment: transport
    rationale: 실차율(적재 효율) 95% 판단; 부문 공시 없음.
  plant_runs:
  - value: 4
    unit: count
    rationale: 'four rolling sites per the H1-2026 filing''s production-facility
      note: 신평, 녹산, 평택 (대한제강) and 부산 (와이케이스틸).'
    segment: steel
  - value: 1
    unit: count
    segment: transport
    rationale: 단일 물류 운영 단위(종속 물류회사 1개사) - 주석의 부문 기술과 정합.
  turnaround:
  - value: 14
    unit: days
    rationale: annual EAF refractory/maintenance downtime judgment; not separately
      disclosed in the filing.
    segment: steel
  - value: 5
    unit: days
    segment: transport
    rationale: 차량 정기 정비에 따른 연간 비가동 판단; 부문 공시 없음.
  transport_fcff_year_1:
    value: 0.3
    unit: KRW_billion
    segment: transport
    rationale: 영업부문 정보 주석(반기 2026.06, 20260814003201_45.xml) 기준 운송부문 H1-26 매출 18.36십억·영업이익
      0.026십억 흑자전환; 연환산 매출 ~37십억에 1% FCFF 마진 판단.
  transport_fcff_year_2:
    value: 0.5
    unit: KRW_billion
    segment: transport
    rationale: 계열 철강 출하 회복과 함께 운임 정상화 - 연 매출 ~38십억에 1.3% 마진 판단.
  transport_fcff_year_3:
    value: 0.8
    unit: KRW_billion
    segment: transport
    rationale: 중기 정상화 - 물류 자회사의 계열+외부 화물 믹스에서 2% 수준 FCFF 마진 판단.
  transport_fcff_year_4:
    value: 1.0
    unit: KRW_billion
    segment: transport
    rationale: 중기 플래토 - 연 매출 ~40십억에 2.5% FCFF 마진 판단, capex는 차량 대체 수준.
  transport_fcff_year_5:
    value: 1.2
    unit: KRW_billion
    segment: transport
    rationale: 터미널 진입 FCFF - 3% 마진 상한 판단; 운송부문은 연결 매출의 ~2.5%에 불과하다.
  transport_terminal_growth:
    value: 0.0
    unit: ratio
    segment: transport
    rationale: 계열 화물 의존 물류사업의 장기 성장은 철강 출하와 같은 0% 판단.
  transport_terminal_roic:
    value: 0.06
    unit: ratio
    segment: transport
    rationale: 차량 자산 기반 운송업의 통과 사이클 ROIC 판단 - 자본비용 근방.
  transport_ownership:
    value: 1.0
    unit: ratio
    segment: transport
    rationale: 운송 자회사는 완전 연결 대상이며 비지배지분은 와이케이스틸(제강부문)에 귀속된다는 판단.
  transport_ev_adjustment:
    value: 0
    unit: KRW_billion
    segment: transport
    rationale: 부문별 순현금 배분 자료가 없어 회사 순현금 전액을 제강부문에 귀속; 운송부문 EV 조정 0 선언.
  other_gross_asset_value:
    value: 84.7
    unit: KRW_billion
    segment: other
    rationale: 영업부문 정보 주석(반기 2026.06, 20260814003201_45.xml) 자산·부채 표의 기타부문 자산 84,740,975,145원
      (반기말).
  other_liabilities:
    value: 39.0
    unit: KRW_billion
    segment: other
    rationale: 영업부문 정보 주석(반기 2026.06, 20260814003201_45.xml) 자산·부채 표의 기타부문 부채 38,999,452,730원
      (반기말).
  other_ownership:
    value: 1.0
    unit: ratio
    segment: other
    rationale: 기타(임대) 부문은 지배회사 직접 보유 자산 중심이며 비지배지분은 제강부문(YK)에 귀속된다는 판단.
  asset_value:
    value: 84.7
    unit: KRW_billion
    segment: other
    rationale: 기타부문 자산 84.7십억 (주석 부문 자산·부채 표, 반기말).
  noi_or_ffo:
    value: -1.8
    unit: KRW_billion
    segment: other
    rationale: H1-26 기타부문 영업손실 -0.91십억의 연환산 - 임대사업이 아직 적자인 실측을 그대로 선언.
  occupancy:
    value: 0.9
    unit: ratio
    segment: other
    rationale: 임대 자산 가동(임대율) 90% 판단; 부문 공시 없음.
  rent:
    value: 26
    unit: KRW_billion
    segment: other
    rationale: H1-26 기타부문 매출(임대수익 등) 13.05십억의 연환산 26.1십억.
  cap_rate:
    value: 0.05
    unit: ratio
    segment: other
    rationale: 산업용 부동산 임대의 캡레이트 5% 판단; 부문 공시 없음.
  debt:
    value: 39.0
    unit: KRW_billion
    segment: other
    rationale: 기타부문 부채 39.0십억 (주석 부문 자산·부채 표).
  maturities:
    value: 2.0
    unit: years
    segment: other
    rationale: 부문별 만기 미공시 - 회사 차입 만기 구조에 준한 2년 판단.
