
target_id: KR:DART:00687711
as_of: "2026-08-29"
source_ref: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319001021
declarations:
  normalized_ebitda:
    value: 60
    unit: KRW_billion
    source_refs:
      - https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319001021
      - https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814002934
    rationale: >-
      mid-cycle judgment from the filed operating-income path 121.5bn (2022) /
      86.6bn (2023) / 1.8bn (2024) / -38.7bn (2025) in the annual reports
      (OFS), with the H1-2026 filing showing utilization back at 82.78% and
      realized price recovering to 824,808 KRW/ton; ~45bn mid-cycle EBIT plus
      ~15bn depreciation run-rate.
  normalized_multiple:
    value: 4.0
    unit: multiple
    source_refs:
      - https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319001021
      - https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814002934
    rationale: >-
      through-cycle EV/EBITDA for a single-product rebar mill with flat
      long-run demand; low end of the domestic long-steel cohort.
  down_normalized_ebitda:
    value: 35
    unit: KRW_billion
    source_ref: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319001021
    rationale: >-
      structural re-basing scenario - domestic construction starts stay at the
      2025 trough, mid-cycle EBIT re-bases near 20bn plus depreciation; the
      2025 filed operating loss of -38.7bn marks the floor economics.
  down_normalized_multiple:
    value: 3.5
    unit: multiple
    source_ref: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319001021
    rationale: >-
      de-rated through-cycle multiple under structurally lower domestic rebar
      demand.
  bull_normalized_ebitda:
    value: 85
    unit: KRW_billion
    source_refs:
      - https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319001021
      - https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814002934
    rationale: >-
      cycle-recovery scenario - H1-2026 filed utilization 82.78% and realized
      price 824,808 KRW/ton hold, spreads mean-revert toward the 2022-2023
      filed operating-income levels (121.5bn/86.6bn).
  bull_normalized_multiple:
    value: 4.5
    unit: multiple
    source_ref: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814002934
    rationale: >-
      modest re-rating if the filed utilization and price recovery persists
      across a full year.
  cash_cost:
