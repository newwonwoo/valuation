    unit: KRW_per_ton
    source_ref: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814002934
    rationale: >-
      implied conversion+scrap cash cost consistent with the filed H1-2026
      scrap purchase price 470,468 KRW/ton plus conversion, against the filed
      H1-2026 average selling price 824,808 KRW/ton.
  benchmark_price:
    value: 820000
    unit: KRW_per_ton
    source_refs:
