      - https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260814002934
    rationale: >-
      domestic rebar distribution price level consistent with the company's
      filed realized-price series 838,286 (FY24) / 768,503 (FY25) / 824,808
      (H1-26) KRW/ton; benchmark held near the filed trajectory pending a
      verified industry series.
  inventory:
    value: 100
    unit: KRW_billion
    source_ref: https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260319001021
    rationale: >-
