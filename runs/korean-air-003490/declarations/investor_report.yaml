schema_version: investor_report/v2
conclusion: 현재가는 검증된 진입가격을 웃돌며, 아시아나 손실 축소와 항공기 투자 이후의 현금흐름 개선이 함께 확인되기 전에는 신규매수를 서두를 이유가 적습니다.
investment_points:
- title: 통합 매출보다 아시아나 손실 축소가 중요
  content: 아시아나는 이미 연결 대상입니다. 합병으로 매출을 다시 더하지 않고, 기준 시나리오에서 연간 영업 시너지 2,000억원과 통합
    초기 비용을 별도로 반영했습니다. 회사가 제시한 시너지에는 이자 절감도 포함돼 있어 전액을 영업이익으로 보지 않았습니다.
  evidence: 2026 반기 연결 부문손익·종속기업 주석 및 합병 설명자료
  valuation_link: 아시아나 손실 축소와 영업 시너지는 항공부문 이익률과 현금흐름을 높이지만, 통합비용이 커지면 같은 매출에서도 주주가치가 낮아집니다.
  falsifier: 연결 항공부문 이익률이 개선되지 않거나 통합비용이 계획보다 장기간 지속되는 경우입니다.
- title: 정비·방산 성장을 기존 항공사업과 분리해 반영
  content: 항공우주는 수주잔고와 양산 진입을 토대로 매출·마진을 추정했습니다. 신규 엔진 정비의 외부 매출은 기타부문에 반영하고, Lufthansa
    Technik의 실제 영업이익률 7.5%에서 초기 가동 부담을 차감했습니다. 자체 정비 절감과 외부 매출을 중복 가산하지 않았습니다.
  evidence: 반기 항공우주 수주잔고 4조7,176억원, 회사 엔진 정비 투자계획, Lufthansa Technik 2025 실적
  valuation_link: 수주잔고 전환과 외부 정비 매출은 비항공 여객 현금흐름을 늘려 항공업 변동성을 완충합니다.
  falsifier: 수주잔고의 매출 전환이 지연되거나 외부 정비 고객 확보가 초기 가동비를 상쇄하지 못하는 경우입니다.
- title: 항공기 투자와 리스가 주주 몫을 결정
  content: 초기 3년은 투자 부담이 크고 이후 현금창출이 개선되는 경로입니다. 신규 항공기 사용권 취득도 투자에 포함했으며, 기존 리스부채는
    순차입금에서 한 번만 차감했습니다. 합병 신주를 포함한 주식 수로 가치를 배분했습니다.
  evidence: 반기 연결 현금흐름·리스 주석, 장기 항공기 투자계획, 7월24일 합병 투자설명서
  valuation_link: 항공기 투자·신규리스·차입은 기업가치가 아니라 구주주에게 남는 현금흐름과 진입가격을 직접 낮춥니다.
  falsifier: 투자 후 영업현금흐름이 개선되지 않거나 추가 차입·증자가 기준 경로를 웃도는 경우입니다.
valuation_method: 항공운송·항공우주·기타의 5년 현금흐름 DCF와 호텔 영업자산 NAV를 합산한 전 사업부 평가
method_rationale: 여객·화물의 수요와 단가, 항공기 투자, 리스·차입, 합병 신주가 서로 연결돼 있어 단순 이익배수보다 사업별 현금흐름과 주주 몫을 함께 추적하는 방식이 적합합니다.
major_assumptions: 평가일은 2026년9월13일이며, 향후 5개 연간 기간을 추정했습니다. 항공운송 기준 매출 증가율은 연3~4%,
  시너지 전 영업이익률은 5%에서 8%로 회복한다고 가정합니다. 말기 성장은 하방1.5%·기준2%·상방2.5%이고, 말기 투자도 성장에 필요한 수준으로
  정상화했습니다. 리스 포함 순차입금에 사용제한예금과 6월말 이후 자금소요 추정 7,000억원을 더해 약20조원을 차감합니다. 잔여 비지배지분·영구채
  청구권은 합계3,500억원으로 추정합니다. 유통 보통주와 계획 합병신주, 우선주의 경제적 배분을 합친 주식 수는 389,669,121주입니다.
  동종기업 위험과 차입비용에서 산출한 할인율은 약7.10%입니다. 호텔 NAV는 비금융 영업채무와 현금·내부거래 중복도 포함한 일괄 할인 추정으로,
  개별 채무를 모두 확인한 감정가가 아닙니다. 증권사 비교는 기준일 이전에 공개 본문을 확인한 세 곳의 최신 보고서 각 한 건이며 시장 전체의 컨센서스가 아닙니다.
  미래에셋은 2026년3분기 연결 영업이익 4,887억원, LS증권은 2027년 연결 영업이익 2조6,630억원을 예상하고 하나증권 공개자료에는 세부 이익 추정치가 없습니다.
  본 모형은 매년9월까지의 향후12개월 기준이므로 각 증권사 전망과 기간이 직접 같지 않습니다.
valuation_exclusions: 공시된 네 사업부를 모두 포함했습니다. 미확정 MOU를 확정수주로 보지 않았으며, 아시아나 매출과 이자 절감은
  중복 가산하지 않았습니다. 영업 경로의 범위는 2019~2024년 대한항공·아시아나의 연결 매출과 영업이익을 연도별 합산해 동일한 통합 경제범위로
  재구성한 6개년 이력과 2026년 반기 조건을 참고했습니다. 다만 분포형 지급평가의 사전확률은 실제 성공빈도로 보정하지 않았으므로 단일 목표가나 성공확률로 사용하지 않습니다. 순부채 차감 후
  음수인 경우는 감사용 자본가치 부족액으로 보존하며, 투자자용 확률가중 주식가치에는 유한책임에 따른 0원 하한을 적용합니다. 표본은 최소 요건인
  6개년이고 코로나 충격을 포함해 오차범위가 넓으므로, 확률은 고정 예측이 아니라 추가 실적 공시 때 갱신할 조건부 추정입니다.
scenario_conditions:
- scenario_id: Down
  condition: 통합비용과 항공기 투자가 이어지는 가운데 연결 항공부문 이익률 회복이 지연되는 경우입니다.
  valuation_effect: 초기 현금유출과 순차입금 부담이 주주 몫을 압박해 가치범위 하단에 가까워집니다.
- scenario_id: Base
  condition: 아시아나 손실이 단계적으로 줄고 항공부문 이익률이 5%대에서 8%대로 회복되는 경우입니다.
  valuation_effect: 초기 3년 투자부담 뒤 현금흐름이 개선돼 가치범위 중앙이 성립합니다.
- scenario_id: Bull
  condition: 여객·화물 수요와 운임이 유지되고 통합 시너지·정비·방산 성장이 계획보다 빠른 경우입니다.
  valuation_effect: 영업현금흐름 회복이 투자와 금융비용을 앞서면서 가치범위 상단에 가까워집니다.
sensitivity_watch:
- driver: 연결 항공부문 이익률
  downside: 유가·환율·통합비용을 운임으로 흡수하지 못하면 현금흐름 회복이 늦어집니다.
  upside: 아시아나 손실 축소와 프리미엄·화물 수요가 이어지면 현금흐름이 빨리 개선됩니다.
  monitor: 분기 연결 항공부문 매출·영업이익과 아시아나 손익
- driver: 항공기 투자와 신규리스
  downside: 인도·리스 취득과 자금소요가 계획을 웃돌면 추가 차입 또는 희석 위험이 커집니다.
  upside: 투자 집행이 계획 안에서 이뤄지고 운항수익이 따라오면 주주 잉여현금이 개선됩니다.
  monitor: 투자활동 현금흐름, 사용권자산 취득, 리스부채와 차입금
- driver: 정비·방산 매출 전환
  downside: 외부 정비 고객과 군용기 양산이 늦어지면 초기 비용만 먼저 반영됩니다.
  upside: 수주잔고가 매출로 전환되고 정비 가동률이 오르면 비여객 수익이 확대됩니다.
  monitor: 항공우주 수주잔고·매출, 기타부문 외부매출과 이익률
entry_rule:
  margin_of_safety: 0.25
  rationale: 합병 통합비용, 약 20조원의 리스 포함 순차입금, 유가·환율 민감도와 초기 3년의 높은 항공기 투자 부담 때문에 확률가중 목표가 대비 25% 안전마진을 요구합니다.
segment_notes:
- segment_id: 항공운송
  content: 연결 항공사업의 수익성 회복·통합 비용·항공기 투자·신규리스를 현금흐름에 반영
  note: 별도 수송지표를 연결 매출로 오인하지 않음
- segment_id: 항공우주
  content: 공시 수주잔고와 초기 양산을 반영한 매출·마진 경로
  note: 확정수주와 MOU를 구분하고 운전자본·투자비 차감
- segment_id: 호텔
  content: 장부 총자산1조7,381억원을 참고한 영업자산 가치 9,500억~1조5,500억원
  note: 감정평가액이 아닌 추정범위이며 연결 부채는 별도 한 번 차감
- segment_id: 기타부문
  content: IT·기존 엔진서비스와 신규 외부 정비매출을 현금흐름으로 반영
  note: 외부 매출과 내부 원가절감의 중복 가산 방지
risks:
- 유가·환율 상승이 운임 인상보다 빠르면 연결 이익률 회복이 지연됩니다. 화물 운임 상승의 일부는 유류할증료이므로 물량 성장과 구분해야 합니다.
- 항공기 인도·리스 신규취득·통합 비용이 예상보다 크면 현금창출 전 추가 자금조달이 필요합니다. 6월말 이후 자금소요는 공시 실적이 아닌 추정입니다.
- 엔진 정비 외부 고객 확보와 군용기 양산이 늦어지면 성장보다 초기 비용이 먼저 발생합니다. 유럽 정비업체의 조정 영업이익률과 대한항공의 회계·고객구성에는
  차이가 있습니다.
- 호텔 NAV와 비지배지분 공정가치는 불확실합니다. 호텔 총자산을 현금성 자산과 중복 가산하지 않도록 할인했지만 실제 처분·운영 가치와 차이가 날
  수 있습니다.
- 할인율 비교기업 표본이 작고 국가위험 처리에도 판단이 들어갑니다. 합병 신주 최종 수량과 우선주의 차등 권리가 주당 가치에 영향을 줍니다.
conditions:
  upside: 아시아나 손실 축소와 통합 비용 절감이 연결 영업이익으로 확인되고, 엔진 정비 외부 수주와 양산 매출이 초기 비용을 넘어설 때입니다.
  downside: 연결 이익률이 회복되지 않거나 항공기·리스 투자와 추가 차입이 기준 경로를 지속적으로 초과할 때입니다.
  actionable: 지급경로와 요구수익률을 반영해 검증된 보수적 진입 상한 이하에서만 신규 매수를 검토합니다. 그 전에는 아시아나 손실 축소·연결
    이익률 회복·투자 후 현금흐름 개선이 함께 확인되는지 점검합니다.
