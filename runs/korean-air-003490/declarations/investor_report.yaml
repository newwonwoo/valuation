investment_points:
- title: 통합 매출보다 아시아나 손실 축소가 중요
  content: 아시아나는 이미 연결 대상입니다. 합병으로 매출을 다시 더하지 않고, 기준 시나리오에서 연간 영업 시너지 2,000억원과 통합
    초기 비용을 별도로 반영했습니다. 회사가 제시한 시너지에는 이자 절감도 포함돼 있어 전액을 영업이익으로 보지 않았습니다.
  evidence: 2026 반기 연결 부문손익·종속기업 주석 및 합병 설명자료
- title: 정비·방산 성장을 기존 항공사업과 분리해 반영
  content: 항공우주는 수주잔고와 양산 진입을 토대로 매출·마진을 추정했습니다. 신규 엔진 정비의 외부 매출은 기타부문에 반영하고, Lufthansa
    Technik의 실제 영업이익률 7.5%에서 초기 가동 부담을 차감했습니다. 자체 정비 절감과 외부 매출을 중복 가산하지 않았습니다.
  evidence: 반기 항공우주 수주잔고 4조7,176억원, 회사 엔진 정비 투자계획, Lufthansa Technik 2025 실적
- title: 항공기 투자와 리스가 주주 몫을 결정
  content: 초기 3년은 투자 부담이 크고 이후 현금창출이 개선되는 경로입니다. 신규 항공기 사용권 취득도 투자에 포함했으며, 기존 리스부채는
    순차입금에서 한 번만 차감했습니다. 합병 신주를 포함한 주식 수로 가치를 배분했습니다.
  evidence: 반기 연결 현금흐름·리스 주석, 장기 항공기 투자계획, 7월24일 합병 투자설명서
valuation_method: 항공운송·항공우주·기타의 5년 현금흐름 DCF와 호텔 영업자산 NAV를 합산한 전 사업부 평가
major_assumptions: 평가일은 2026년9월13일이며, 향후 5개 연간 기간을 추정했습니다. 항공운송 기준 매출 증가율은 연3~4%,
  시너지 전 영업이익률은 5%에서 8%로 회복한다고 가정합니다. 말기 성장은 하방1.5%·기준2%·상방2.5%이고, 말기 투자도 성장에 필요한 수준으로
  정상화했습니다. 리스 포함 순차입금에 사용제한예금과 6월말 이후 자금소요 추정 7,000억원을 더해 약20조원을 차감합니다. 잔여 비지배지분·영구채
  청구권은 합계3,500억원으로 추정합니다. 유통 보통주와 계획 합병신주, 우선주의 경제적 배분을 합친 주식 수는 389,669,121주입니다.
  동종기업 위험과 차입비용에서 산출한 할인율은 약7.10%입니다. 호텔 NAV는 비금융 영업채무와 현금·내부거래 중복도 포함한 일괄 할인 추정으로,
  개별 채무를 모두 확인한 감정가가 아닙니다. 증권사 비교는 확인한 7월 공개 보고서 두 건이며 시장 전체의 최신 컨센서스가 아닙니다. 양사의 2027년
  연결 영업이익 전망은 약2.35조~2.66조원으로, 본 모형보다 빠른 실적 개선을 기대합니다. 본 모형은 매년9월까지의 향후12개월 기준이므로
  달력연도 전망과 직접 같은 기간은 아닙니다.
valuation_exclusions: 공시된 네 사업부를 모두 포함했습니다. 미확정 MOU를 확정수주로 보지 않았으며, 아시아나 매출과 이자 절감은
  중복 가산하지 않았습니다. 통합 이후와 동일한 범위의 장기 실적 이력이 짧아 시나리오 확률을 임의로 붙이지 않았습니다. 아래 시나리오 값은 각
  가정이 성립할 때의 조건부 가치입니다. 순부채 차감 후 음수인 경우는 자본가치 부족액으로 읽어야 하며 주식의 음수 거래가격을 뜻하지 않습니다.
segment_notes:
- segment_id: 항공운송
  content: 연결 항공사업의 수익성 회복·통합 비용·항공기 투자·신규리스를 현금흐름에 반영
  note: 별도 수송지표를 연결 매출로 오인하지 않음
- segment_id: 항공우주
  content: 공시 수주잔고와 초기 양산을 반영한 매출·마진 경로
  note: 확정수주와 MOU를 구분하고 운전자본·투자비 차감
- segment_id: 호텔
  content: 장부 총자산1조7,381억원을 참고한 영업자산 가치 9,500억~1조5,500억원
  note: 감정평가액이 아닌 추정범위이며 연결 부채는 별도 한 번 차감
- segment_id: 기타부문
  content: IT·기존 엔진서비스와 신규 외부 정비매출을 현금흐름으로 반영
  note: 외부 매출과 내부 원가절감의 중복 가산 방지
risks:
- 유가·환율 상승이 운임 인상보다 빠르면 연결 이익률 회복이 지연됩니다. 화물 운임 상승의 일부는 유류할증료이므로 물량 성장과 구분해야 합니다.
- 항공기 인도·리스 신규취득·통합 비용이 예상보다 크면 현금창출 전 추가 자금조달이 필요합니다. 6월말 이후 자금소요는 공시 실적이 아닌 추정입니다.
- 엔진 정비 외부 고객 확보와 군용기 양산이 늦어지면 성장보다 초기 비용이 먼저 발생합니다. 유럽 정비업체의 조정 영업이익률과 대한항공의 회계·고객구성에는
  차이가 있습니다.
- 호텔 NAV와 비지배지분 공정가치는 불확실합니다. 호텔 총자산을 현금성 자산과 중복 가산하지 않도록 할인했지만 실제 처분·운영 가치와 차이가 날
  수 있습니다.
- 할인율 비교기업 표본이 작고 국가위험 처리에도 판단이 들어갑니다. 합병 신주 최종 수량과 우선주의 차등 권리가 주당 가치에 영향을 줍니다.
conditions:
  upside: 아시아나 손실 축소와 통합 비용 절감이 연결 영업이익으로 확인되고, 엔진 정비 외부 수주와 양산 매출이 초기 비용을 넘어설 때입니다.
  downside: 연결 이익률이 회복되지 않거나 항공기·리스 투자와 추가 차입이 기준 경로를 지속적으로 초과할 때입니다.
  actionable: 현재가는 기준 시나리오보다 상방 시나리오에 가까운 회복을 요구합니다. 신규 매수의 가격 매력은 낮다고 판단합니다. 아시아나
    손실 축소·연결 이익률 회복·투자 후 현금흐름 개선이 함께 확인되는지 점검해야 합니다. 이는 확률가중 목표가가 아닌 조건부 시나리오에 따른
    판단입니다.
