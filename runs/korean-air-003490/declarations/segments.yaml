- segment_id: airline
  disclosed_name: 항공운송
  ksic_code: '51100'
  rationale: 공시상 여객 및 화물운송 부문으로, 실제 운송량·운임·가동률과 연료·리스 및 기재투자가 현금흐름을 결정한다. 항공운송 전용
    원형으로 연결대상 항공사를 함께 평가한다.
- segment_id: aerospace
  disclosed_name: 항공우주
  ksic_code: '31311'
  classification_status: RESOLVED_VALUATION_PROXY
  constituent_activities:
  - 항공기 부품제작
  - 항공기 정비
  rationale: 공시상 항공기 정비 및 항공기 부품제작이 합산된 보고부문이다. 계약 기반 제조·정비 현금흐름을 평가하는 대리 분류를 적용하며,
    전체 수익을 확정 수주로 간주하지 않고 공개 실적과 별도 성장 가정을 구분한다.
- segment_id: hotel
  disclosed_name: 호텔
  ksic_code: '68112'
  classification_status: RESOLVED_VALUATION_PROXY
  constituent_activities:
  - 호텔숙박서비스
  - 호텔 부동산 보유·운영
  rationale: 공시상 호텔숙박서비스와 관련 부동산 보유·운영을 함께 평가한다. 부동산 자산가치 기반 대리 분류를 적용하되 REIT라는 사실
    주장으로 사용하지 않는다. 호텔 운영손실과 자산 실현 할인은 가치 가정에 별도로 반영한다.
- segment_id: other
