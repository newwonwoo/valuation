  constituent_activities:
  - IT서비스
  - 항공기엔진수리
  - 전자상거래
  rationale: 주석에서 IT서비스·항공기엔진수리·전자상거래 등을 합산하므로 순수 소프트웨어 기업으로 분류하지 않는다. 실제 부문 실적을 기준으로
    서비스 운영 현금흐름 대리 모형을 적용하고 서비스별 혼합과 불확실성을 명시한다.
