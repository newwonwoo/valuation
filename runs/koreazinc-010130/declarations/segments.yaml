    rationale: >-
      IFRS 8 주석은 폐기물처리·광물 등을 하나의 기타부문으로 합산하고,
      사업 주석은 자원순환·광산개발·신재생에너지·이차전지 소재 활동과
      주요 자회사를 식별합니다. 단일 산업으로 단정하지 않고 공시 명칭의
      주된 경제활동인 지정폐기물 처리업을 평가 프록시로 사용하며, 수익배수
      대신 집계 공시 유형자산만 반영하는 NAV 방법으로 이질성과 중복가산을
      통제합니다. 개발사업의 별도 옵션가치는 추가하지 않습니다.
